- id: predict
  stage: prediction
  pdf: 41
  hold: 6
  c:
  - Spanning Tree Protocol
  say: Trace the other two paths on the tree. What route does A to C follow? And B
    to C?
  moves:
  - pause:
      text: the switch path for A to C, and for B to C?
- id: answer
  stage: explanation
  pdf: 41
  c:
  - Spanning Tree Protocol
  say: 'A to C goes S3, S2, S1, S4. B to C goes S7, S1, S4. Notice that A to B took
    three hops, though the physical drawing offers something shorter. Spanning tree
    does not promise shortest paths between hosts, and it does not minimize total
    cost either. It promises one thing: no loops. Different priorities could pick
    a different tree, so the assumptions stay attached to the answer.'
  moves:
  - net.walk:
      name: seven
      path:
      - S3
      - S2
      - S1
      - S4
      state: done
      when: A to C goes
  - table.set:
      name: paths
      r: 1
      c: 1
      v: S3 S2 S1 S4
      state: done
  - net.walk:
      name: seven
      path:
      - S7
      - S1
      - S4
      state: done
      when: B to C goes
  - table.set:
      name: paths
      r: 2
      c: 1
      v: S7 S1 S4
      state: done
  - net.walk:
      name: seven
      path:
      - S3
      - S2
      - S1
      - S7
      when: Notice that A
  - rule:
      text: A spanning tree promises no loops. It does not promise shortest paths.
      when: Spanning tree does
  - keep: {}
