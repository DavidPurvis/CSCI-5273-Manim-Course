- id: predict
  stage: prediction
  pdf: 46
  hold: 6
  c:
  - Port-Based VLANs
  say: Whose broadcasts does the laptop hear now? And can it keep its old IP address
    and still work?
  moves:
  - pause:
      text: whose broadcasts does it hear? does its old IP still work?
- id: answer
  stage: explanation
  pdf: 46
  c:
  - Port-Based VLANs
  - VLANs
  say: It now hears engineering's broadcasts, because the port decided its membership.
    And if each VLAN is its own IP subnet, its old address no longer fits, so it needs
    a new configuration. The laptop is physically fine, yet logically it moved. Remember
    too that VLANs separate traffic, but they are no complete security proof. Addresses
    can be changed, and configuration decides what is accepted. That word, subnet,
    needs a real meaning. And it is the point where local delivery runs out. To go
    further, we need addresses with structure.
  moves:
  - table.show:
      name: res
      zone: bottom
      cols:
      - Question
      - Answer
      rows: &id001
      - - Broadcasts heard
        - engineering
      - - Old IP address
        - fails if the subnet changed
  - rule:
      text: 'Next: addresses with structure.'
      when: To go further
  - keep: {}
