        - tree
      - - S1
        - S3
        - tree
      - - S2
        - S3
        - blocked
      when: S2 and S3 use
  - card:
      kind: clarification
      text: This is a simplified account. Real STP adds tie handling and designated
        forwarding.
      zone: right_bottom
      when: The slides simplify
