dish: '6.2'
title: From hub to switch
deck: lec06-lan.pdf
target_min: 3.5
concepts:
- Repeaters and Hubs
- Ethernet Switching
- Full-Duplex Links
- Store-and-Forward Switching
- Cut-Through Switching
beats:
- id: question
  stage: question
  pdf: 15
  c:
  - Repeaters and Hubs
  say: Plug eight machines into one box. Do they now have eight private conversations,
    or one big shared one? It depends entirely on what the box does with the bits.
  moves:
  - heading:
      text: 'Lecture 6: from hub to switch'
  - q:
      text: 'Eight machines in one box: eight conversations, or one?'
- id: hub
  stage: animation
  pdf: 16
  c:
  - Repeaters and Hubs
  say: A repeater amplifies a weakening signal, so a LAN can stretch further. A hub
    is a repeater with many ports. Every bit arriving on one port is copied out of
    all the others. It reads no addresses. It stores nothing. So a hub with eight
    ports is still one wire, wearing a different shape. If A sends to B while C sends
    to D, they collide. The boundary that matters is the collision domain, not the
    number of boxes in the picture.
  moves:
  - clear: {}
  - net.show:
      name: hubnet
      zone: left
      nodes:
        H:
          k: hub
          at:
          - 0
          - 0
          l: Hub
          lp: right
        A:
          k: host
          at:
          - -2
          - 1.4
          l: A
        B:
          k: host
          at:
          - 2
          - 1.4
          l: B
        C:
          k: host
          at:
          - -2
          - -1.4
          l: C
        D:
          k: host
          at:
          - 2
          - -1.4
          l: D
      links:
      - - A
        - H
      - - B
        - H
      - - C
        - H
      - - D
        - H
  - packet.spawn:
      name: f1
      net: hubnet
      at: A
      layers:
      - eth
      when: Every bit
  - packet.hop:
      name: f1
      to: H
  - packet.flood:
      name: f1
      to:
      - B
      - C
      - D
  - packet.fade:
      name: f1
  - fx.burst:
      net: hubnet
      node: H
      when: If A sends
- id: switch
  stage: animation
  pdf: 20
  c:
  - Ethernet Switching
  say: Ethernet switching is different in kind. It receives a whole frame, reads the
    destination MAC address, and sends the frame only out the port that leads there.
    Now A to B and C to D run at the same time, through independent port pairs, with
    no collision at all. Each link has become its own little collision domain.
  moves:
  - net.show:
      name: swnet
      zone: right
      nodes:
        H:
          k: switch
          at:
          - 0
          - 0
          l: Switch
          lp: right
        A:
          k: host
          at:
          - -2
          - 1.4
          l: A
        B:
          k: host
          at:
          - 2
          - 1.4
          l: B
        C:
          k: host
          at:
          - -2
          - -1.4
          l: C
        D:
          k: host
          at:
          - 2
          - -1.4
          l: D
      links:
      - - A
        - H
      - - B
        - H
      - - C
        - H
      - - D
        - H
  - packet.spawn:
      name: f2
      net: swnet
      at: A
      layers:
      - eth
      when: It receives
  - packet.spawn:
      name: f3
      net: swnet
      at: C
      layers:
      - eth
      when: Now A to B
  - packet.hop:
      name: f2
      to:
      - H
      - B
  - packet.hop:
      name: f3
      to:
      - H
      - D
- id: duplex
  stage: state
  pdf: 22
  c:
  - Full-Duplex Links
  say: And with a private point to point link, a host can send and receive at once.
    That is a full-duplex link, and on it, collision detection has nothing left to
    do. Does that mean a switch never loses anything? No. If A and C both send to
    B, both frames need the same output. A switch has finite output rates and finite
    buffers, so frames must queue. We removed collisions, not contention.
  moves:
  - packet.fade:
      name: f2
  - packet.fade:
      name: f3
  - rule:
      text: 'Full duplex removes collisions, not contention: a shared output still
        queues.'
  - packet.spawn:
      name: f4
      net: swnet
      at: A
      layers:
      - eth
      when: If A and C
  - packet.spawn:
      name: f5
      net: swnet
      at: C
      layers:
      - eth
  - packet.hop:
      name: f4
      to: H
  - packet.hop:
      name: f5
      to: H
- id: modes
  stage: state
  pdf: 26
  c:
  - Store-and-Forward Switching
  - Cut-Through Switching
  say: 'One choice remains: when does the switch start sending? Store-and-forward
    switching receives the entire frame first, and checks the CRC, so bad frames die
    here. Cut-through switching begins as soon as it has read the destination address.
    That saves some waiting, but it may forward a frame that later turns out to be
    corrupt.'
  moves:
  - clear: {}
  - tl.show:
      name: sf
      zone: top
      tracks:
      - Store-and-forward
      - Cut-through
      span:
      - 0
      - 10
  - tl.block:
      name: sf
      track: Store-and-forward
      start: 0
      end: 5
      text: receive all
      kind: eth
      when: Store-and-forward switching
  - tl.block:
      name: sf
      track: Store-and-forward
      start: 5
      end: 10
      text: send
      kind: ip
  - tl.block:
      name: sf
      track: Cut-through
      start: 0
      end: 0.8
      kind: eth
      when: Cut-through switching
  - tl.block:
      name: sf
      track: Cut-through
      start: 0.8
      end: 5.8
      text: send while receiving
      kind: ip
- id: rule
  stage: rule
  pdf: 26
  c:
  - Store-and-Forward Switching
  say: It helps to name exactly which delay is being removed. Reception time is frame
    length divided by rate. A 1500 byte frame at 100 megabits per second takes 120
    microseconds just to arrive. Store-and-forward pays this at every switch.
  moves:
  - tex:
      name: rx
      zone: bottom
      tex: \frac{1500 \times 8 \text{ bits}}{100\,\text{Mb/s}} = 120\,\mu s
      size: 44
  - rule:
      text: Store-and-forward pays the full reception time at each switch, but checks
        the CRC first.
- id: pitfall
  stage: rule
  pdf: 26
  c:
  - Store-and-Forward Switching
  say: People often say a switch fixes everything a hub got wrong. It doesn't stop
    broadcasts from spreading, and a collision-free output can still queue and drop.
  moves:
  - trap:
      wrong: A switch stops broadcasts and ends all congestion
      right: A switch isolates unicast. Broadcasts still spread, and outputs still
        queue.
- id: changed
  stage: changed_example
  pdf: 26
  c:
  - Cut-Through Switching
  say: Change the situation. Our frame's last bytes get corrupted on the way into
    the switch. And suppose the output port is busy, so the frame cannot begin leaving
    at once either.
  moves:
  - clear: {}
  - net.show:
      name: pair
      zone: top
      nodes:
        A:
          k: host
          at:
          - 0
          - 0
          l: A
        H:
          k: switch
          at:
          - 4
          - 0
          l: Switch
        B:
          k: host
          at:
          - 8
          - 0
          l: B
      links:
      - - A
        - H
      - - H
        - B
  - packet.spawn:
      name: bad
      net: pair
      at: A
      layers:
      - eth
  - packet.hop:
      name: bad
      to: H
- id: predict
  stage: prediction
  pdf: 26
  hold: 6
  c:
  - Cut-Through Switching
  say: Under cut-through, does the bad frame reach B? And what does cut-through save
    if the output was busy anyway?
  moves:
  - pause:
      text: does the corrupt frame reach B? what was saved?
- id: answer
  stage: explanation
  pdf: 26
  c:
  - Cut-Through Switching
  - Ethernet Switching
  say: With a free output, cut-through would already be sending when the corruption
    arrives, so a bad frame can reach B. With a busy output, the frame has to wait
    anyway, so the savings shrink. Store-and-forward would have discarded it. There
    is still a gap in the switch story. It sends a frame only out the right port.
    But how could a box you just took out of the packaging possibly know which port
    is right?
  moves:
  - packet.hop:
      name: bad
      to: B
  - packet.drop:
      name: bad
      when: Store-and-forward would
  - rule:
      text: How does a brand new switch know which port is right?
      when: There is still
  - keep: {}
prediction_contracts:
- prediction_beat: 6.2.predict
  answer_beat: 6.2.answer
  answer_events:
  - 6.2.answer:move:0
  - 6.2.answer:move:1
  - 6.2.answer:move:2
  answer_objects:
  - object: bad
    after: 6.2.answer:move:0
    effect: packet.hop
    selector: {}
    before_answer: hidden_or_neutral
  - object: bad
    after: 6.2.answer:move:1
    effect: packet.drop
    selector: {}
    before_answer: hidden_or_neutral
  - object: _rule
    after: 6.2.answer:move:2
    effect: rule
    selector: {}
    before_answer: hidden_or_neutral
  review_scope: Inspect the listed answer objects for neutral or hidden state during
    the prediction hold.
