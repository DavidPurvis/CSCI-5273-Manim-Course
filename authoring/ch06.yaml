- id: pitfall
  stage: rule
  pdf: 41
  c:
  - Spanning Tree Protocol
  say: Watch out for this one. When a switch floods an unknown destination, the frame
    doesn't become a broadcast. Its destination address stays exactly as it was. Only
    the set of output ports changed.
  moves:
  - trap:
      wrong: Flooding turns the frame into a broadcast
      right: Unknown unicast floods, but the destination address doesn't change
- id: changed
  stage: changed_example
  pdf: 41
  c:
  - Spanning Tree Protocol
  say: Use this tree. Host A hangs off S3, host B off S7, and host C off S4. A to
    B cannot use the short-looking route through S5, because those dashed links do
    not forward.
  moves:
  - table.show:
      name: paths
      zone: right_bottom
      cols:
      - Hosts
      - Path
