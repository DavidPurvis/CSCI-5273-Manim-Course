- id: trunk
  stage: state
  pdf: 47
  c:
  - 802.1Q Trunking
  say: Finance spans two switches, joined by one cable. That cable carries both departments.
    When a frame arrives at the far switch, how can it tell which VLAN the frame belongs
    to? The sending switch inserts a tag. This is 802.1Q trunking. It adds four bytes
    after the source address, including a 12 bit VLAN ID. Because the frame changed,
    the CRC is recomputed. The receiving switch reads the tag, and removes it before
    delivering to an ordinary host.
  moves:
  - clear: {}
  - net.show:
      name: t
      zone: top
      nodes:
        F1:
          k: host
          at:
          - 0
          - 0
          l: Finance 1
        A:
          k: switch
          at:
          - 3.5
          - 0
          l: Switch A
        B:
          k: switch
          at:
          - 7
          - 0
          l: Switch B
        F2:
          k: host
          at:
          - 10.5
          - 0
          l: Finance 2
      links:
      - - F1
        - A
      - - A
        - B
        - s: active
      - - B
        - F2
  - fields.show:
      name: tag
      zone: bottom
      unit: 0.21
      rows:
      - - - Dest
          - 7
        - - Source
          - 8
        - - 802.1Q tag
          - 13
        - - Type
          - 6
        - - Payload
          - 13
        - - New CRC
          - 11
    when: The sending switch
  - fields.mark:
      name: tag
      label: 802.1Q tag
      when: It adds four
  - fields.mark:
      name: tag
      label: New CRC
      when: the CRC is
  - packet.spawn:
      name: tf
      net: t
      at: F1
      layers:
      - eth
      when: The receiving switch
  - packet.hop:
      name: tf
      to:
      - A
      - B
      - F2
- id: devices
  stage: rule
  pdf: 49
  c:
  - VLANs
  - Ethernet Switching
  say: Before leaving the LAN, compare the three boxes we now have. A hub gives you
    no traffic isolation, and it needs no setup. A switch isolates traffic, and it's
    still plug and play, but flooding and spanning trees keep it from routing efficiently.
    An IP router isolates traffic and routes well, but it isn't plug and play, because
    someone must configure it. Each step up costs something, and buys something.
  moves:
  - clear: {}
  - table.show:
      name: dev
      zone: top
      cols:
      - ''
      - Hub
      - Switch
      - Router
      rows:
      - - Traffic isolation
        - 'no'
        - 'yes'
        - 'yes'
      - - Plug and play
        - 'yes'
        - 'yes'
        - 'no'
      - - Efficient routing
        - 'no'
        - 'no'
        - 'yes'
- id: rule
  stage: rule
  pdf: 48
  c:
  - VLANs
  - 802.1Q Trunking
  say: Keep the jobs separate. A VLAN decides who shares a broadcast domain. A trunk
    carries that identity between switches. Neither one moves traffic between different
    VLANs. For that, you need a router, even if the router lives inside a multilayer
    switch.
  moves:
  - packet.fade:
      name: tf
  - rule:
      text: A VLAN limits a broadcast domain. A trunk preserves VLAN identity. Only
        routing crosses between VLANs.
- id: pitfall
  stage: rule
  pdf: 48
  c:
  - VLANs
  - 802.1Q Trunking
  say: The slide's phrase can mislead you here. A trunk carries frames between switches,
    keeping their VLANs separate. It doesn't move traffic from one VLAN to another.
    That takes a router.
  moves:
  - trap:
      wrong: A trunk routes traffic between VLANs
      right: A trunk carries VLANs across switches. Moving between VLANs needs a router.
