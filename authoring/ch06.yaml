dish: '6.1'
title: Sharing a wire
deck: lec06-lan.pdf
target_min: 6.5
concepts:
- Channel Partitioning
- Taking Turns
- Random Access
- Ethernet Frames
- MAC Addresses
- CSMA-CD
- Binary Exponential Backoff
- Collision Detection Window
beats:
- id: question
  stage: question
  pdf: 7
  c:
  - Channel Partitioning
  - Taking Turns
  - Random Access
  say: Our laptop's very first hop crosses a local network. So start there. Suppose
    many computers share one wire, and whatever one sends, everybody hears. If two
    speak at once, the signals garble each other. Who gets to talk, and when? Notice
    this is not a technical detail. It is a resource allocation problem.
  moves:
  - heading:
      text: 'Lecture 6: sharing a wire'
  - spine:
      current: LAN
      zone: top
  - q:
      text: Many senders, one wire. Who talks, and when?
      zone: bottom
- id: partition
  stage: animation
  pdf: 7
  c:
  - Channel Partitioning
  say: One family of answers is channel partitioning. Divide the wire into fixed shares
    of time or frequency, one for each user. With four users on a 12 megabit per second
    wire, each user owns 3 megabits per second. It is perfectly fair and collision
    free. But watch what happens when only one user has anything to send. Three quarters
    of the wire sits idle, and that lone user still gets just 3.
  moves:
  - clear: {}
  - tl.show:
      name: slots
      zone: top
      tracks:
      - Partitioned
      - Taking turns
      - Random access
      span:
      - 0
      - 12
  - tl.block:
      name: slots
      track: Partitioned
      start: 0
      end: 1
      text: A
      kind: ip
      when: Divide the wire
  - tl.block:
      name: slots
      track: Partitioned
      start: 1
      end: 2
      text: ''
      kind: data
  - tl.block:
      name: slots
      track: Partitioned
      start: 2
      end: 3
      text: ''
      kind: data
  - tl.block:
      name: slots
      track: Partitioned
      start: 3
      end: 4
      text: ''
      kind: data
  - tl.block:
      name: slots
      track: Partitioned
      start: 4
      end: 5
      text: A
      kind: ip
      when: But watch
  - tl.block:
      name: slots
      track: Partitioned
      start: 8
      end: 9
      text: A
      kind: ip
- id: turns
  stage: animation
  pdf: 7
  c:
  - Taking Turns
  say: A second family is taking turns. A controller polls each station, or a token
    passes around, so only the holder may send. Idle stations can be skipped, which
    fixes the waste. The price is control overhead, and a dependency on the coordinator
    or the token.
  moves:
  - tl.block:
      name: slots
      track: Taking turns
      start: 0
      end: 3
      text: A
      kind: ip
  - tl.block:
      name: slots
      track: Taking turns
      start: 3.2
      end: 3.6
      text: ''
      kind: data
  - tl.block:
      name: slots
      track: Taking turns
      start: 3.8
      end: 7
      text: A
      kind: ip
- id: random
  stage: animation
  pdf: 7
  c:
  - Random Access
  say: The third family is random access. Do not coordinate at all. Whoever has data
    just tries. When the network is quiet, a lone sender gets nearly the whole wire.
    When many are active, collisions waste capacity. None of the three wins everywhere.
    They make different trades among idle capacity, control overhead, and contention.
    Ethernet chose random access.
  moves:
  - tl.block:
      name: slots
      track: Random access
      start: 0
      end: 5
      text: A
      kind: ip
  - tl.block:
      name: slots
      track: Random access
      start: 5.5
      end: 6.5
      text: crash
      state: error
  - tl.block:
      name: slots
      track: Random access
      start: 7
      end: 11
      text: B
      kind: eth
  - rule:
      text: Partition reserves. Taking turns coordinates. Random access contends.
        Ethernet contends.
- id: frame
  stage: animation
  pdf: 11
  c:
  - Ethernet Frames
  say: Before watching Ethernet contend, look at what it sends. A frame starts with
    a preamble, which lets the receiver's clock synchronize. Then a destination address,
    a source address, a type field saying what the payload is, such as IP, then the
    payload, and finally a CRC that detects corruption. The CRC only detects. It does
    not repair, and Ethernet sends no acknowledgment. Delivery here is best effort.
  moves:
  - clear: {}
  - fields.show:
      name: frame
      zone: top
      unit: 0.21
      rows:
      - - - Preamble
          - 9
        - - Dest MAC
          - 9
        - - Source MAC
          - 11
        - - Type
          - 6
        - - Payload (for example IP)
          - 20
        - - CRC
          - 6
  - fields.mark:
      name: frame
      label: Preamble
      when: A frame starts
  - fields.mark:
      name: frame
      label: Preamble
      state: null
      when: Then a destination
  - fields.mark:
      name: frame
      label: Dest MAC
  - fields.mark:
      name: frame
      label: Source MAC
  - fields.mark:
      name: frame
      label: CRC
      when: and finally
- id: mac
  stage: animation
  pdf: 28
  c:
  - MAC Addresses
  say: Those addresses are MAC addresses, 48 bits burned into each network interface.
    A MAC address is flat, like a serial number. It says nothing about location, and
    it has meaning only for local delivery. A network card keeps a frame only if the
    destination is its own address, or the broadcast address. Everything else, it
    ignores.
  moves:
  - fields.mark:
      name: frame
      label: Source MAC
      state: null
  - fields.mark:
      name: frame
      label: CRC
      state: null
  - bullets:
      name: macs
      zone: bottom
      show: 3
      items:
      - 48 bits, assigned to an interface
      - 'Flat: says nothing about location'
      - A card keeps frames for its own address or broadcast
- id: mac-more
  stage: state
  pdf: 28
  c:
  - MAC Addresses
  say: Picture one LAN. A host has one IP address and one MAC address, written as
    six hexadecimal bytes. A switch learns that MAC from incoming frames. A sending
    host learns the IP to MAC mapping through ARP. And the broadcast address is all
    ones.
  moves:
  - table.show:
      name: m2
      zone: bottom
      cols:
      - Item
      - Example
      rows:
      - - IP address
        - 192.0.2.10
      - - MAC address
        - 02:00:00:00:00:0A
      - - Broadcast
        - FF:FF:FF:FF:FF:FF
      show: 0
  - table.reveal:
      name: m2
      n: 2
      when: A host has
  - table.reveal:
      name: m2
      when: And the broadcast
- id: csma
  stage: state
  pdf: 12
  c:
  - CSMA-CD
  say: 'The Ethernet rule, called CSMA/CD. Carrier sense: listen first, and if someone
    is talking, wait. Collision detection: keep listening while you send. If what
    you hear differs from what you sent, there is a collision, so stop and send a
    brief jam signal. But why would a collision ever happen, if everyone listens first?
    Because signals take time to travel. A and B can both hear silence, because neither
    signal has arrived yet.'
  moves:
  - clear: {}
  - net.show:
      name: wire
      zone: top
      nodes:
        A:
          k: host
          at:
          - 0
          - 0
          l: A
        M:
          k: point
          at:
          - 5
          - 0
          l: ''
        B:
          k: host
          at:
          - 10
          - 0
          l: B
      links:
      - - A
        - M
      - - M
        - B
  - radio.pulse:
      net: wire
      node: A
      radius: 5.4
      kind: eth
      when: A and B can
  - radio.pulse:
      net: wire
      node: B
      radius: 5.4
      kind: ip
  - fx.burst:
      net: wire
      node: M
- id: backoff
  stage: state
  pdf: 12
  c:
  - Binary Exponential Backoff
  say: After a collision, if both retry immediately, they collide again forever. So
    each picks a random wait. After the m-th collision, choose K from zero up to 2
    to the m, minus one, and wait K times 512 bit times. Each further collision doubles
    the range, so the group spreads itself out without any coordination. That is binary
    exponential backoff. Try one. After the third collision, K ranges from 0 to 7.
    On 10 megabit Ethernet, 512 bit times is 51 point 2 microseconds. So K equal to
    5 means a wait of 256 microseconds.
  moves:
  - text:
      name: bo
      zone: left_bottom
      lines:
      - "K is random, from 0 to 2^m \u2212 1"
      - "Wait K \xD7 512 bit times"
  - table.show:
      name: bo3
      zone: right_bottom
      cols:
      - Quantity
      - Value
      rows:
      - - Collision m
        - 3
      - - K range
        - 0 to 7
      - - One slot
        - "51.2 \u03BCs"
      - - K = 5 waits
        - "256 \u03BCs"
      show: 0
    when: Try one
  - table.reveal:
      name: bo3
      n: 2
  - table.reveal:
      name: bo3
      n: 2
      when: On 10 megabit
- id: window
  stage: rule
  pdf: 13
  c:
  - Collision Detection Window
  say: 'There is one more trap. A sender can only detect a collision while it is still
    transmitting. Suppose A starts at time zero, and the one-way delay is d. B starts
    just before A''s signal arrives, at almost d. B''s collision news then needs another
    d to return. So A may not hear about it until 2 d. So A must still be sending
    at 2 d, which gives the rule: frame length over rate must be at least twice the
    propagation delay.'
  moves:
  - clear:
      keep:
      - wire
  - tl.show:
      name: win
      zone: bottom
      tracks:
      - A sends
      - B sends
      span:
      - 0
      - 2.4
      ticks:
      - 0
      - 1
      - 2
  - tl.block:
      name: win
      track: A sends
      start: 0
      end: 2
      text: A must still be sending
      kind: ip
      when: Suppose A starts
  - tl.block:
      name: win
      track: B sends
      start: 0.95
      end: 1.15
      state: error
      when: B starts just
  - rule:
      text: "Frame length \xF7 rate \u2265 2 \xD7 propagation delay"
      when: which gives the rule
- id: pitfall
  stage: rule
  pdf: 13
  c:
  - Collision Detection Window
  say: 'A tempting one: if everyone listens before sending, collisions can''t happen.
    But a signal takes time to travel, so two stations can both hear silence, and
    both start.'
  moves:
  - trap:
      wrong: Carrier sensing prevents collisions
      right: Propagation delay still lets two senders collide
- id: changed
  stage: changed_example
  pdf: 14
  c:
  - Collision Detection Window
  say: Put in the classic numbers. At 10 megabits per second, with a one-way delay
    of 25 point 6 microseconds, the frame must last at least 51 point 2 microseconds.
    That is 512 bits, which is the famous 64 byte minimum Ethernet frame. Now change
    the delay to just 20 microseconds, at the same rate.
  moves:
  - clear: {}
  - tex:
      name: f
      zone: top
      tex: L \ge 2dR = 2 \times 25.6\,\mu s \times 10\,\text{Mb/s} = 512 \text{ bits}
      size: 40
  - text:
      name: tw
      zone: bottom
      lines:
      - "Now: d = 20 \u03BCs at the same 10 Mb/s"
      when: Now change
- id: predict
  stage: prediction
  pdf: 14
  hold: 12
  c:
  - Collision Detection Window
  say: What minimum length does the same formula give now, in bits?
  moves:
  - pause:
      text: "the minimum L in bits for d = 20 \u03BCs?"
      long: true
- id: answer
  stage: explanation
  pdf: 14
  c:
  - Collision Detection Window
  - CSMA-CD
  say: 'Two times 20 microseconds times 10 megabits per second is 400 bits. That is
    the formula''s answer. It does not replace Ethernet''s real minimum of 64 bytes,
    and the rule belongs to shared, half-duplex wires. Notice what the whole design
    has been fighting: everyone shares one collision domain. So the next question
    is obvious. Could we simply stop sharing?'
  moves:
  - text:
      name: tw
      zone: bottom
      lines:
      - "L \u2265 2 \xD7 20 \u03BCs \xD7 10 Mb/s = 400 bits"
      - The formula's answer, not a new Ethernet minimum
  - rule:
      text: 'These limits belong to shared half-duplex wires. Next: stop sharing.'
  - keep: {}
prediction_contracts:
- prediction_beat: 6.1.predict
  answer_beat: 6.1.answer
  answer_events:
  - 6.1.answer:move:0
  - 6.1.answer:move:1
  answer_objects:
  - object: tw
    after: 6.1.answer:move:0
    effect: text
    selector: {}
    before_answer: hidden_or_neutral
  - object: _rule
    after: 6.1.answer:move:1
    effect: rule
    selector: {}
    before_answer: hidden_or_neutral
  review_scope: Inspect the listed answer objects for neutral or hidden state during
    the prediction hold.
