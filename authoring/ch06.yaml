      size: 28
- id: aging
  stage: rule
  pdf: 30
  c:
  - Self-Learning Switch Tables
  clar:
  - ttl-aging
  say: The rule is, learn from the source, then forward by the destination. Unknown
    destination, flood. Known destination on another port, forward. Known destination
    on the arrival port, filter. Entries also expire, so that a host which moves or
    disappears does not stay wrong forever. The slides call this a TTL. Be careful
    with that word. It is a local aging timer in the switch. It is not a hop counter
    carried in the Ethernet frame, and that fact is about to matter a great deal.
  moves:
  - rule:
      text: Learn from the source. Forward by the destination. Flood when unknown.
      when: The rule
  - net.state:
      name: sw
      nodes:
        X: now
      when: Entries also expire
  - card:
      kind: clarification
      text: The slide's table TTL is a local aging timer, not a hop count in the frame.
      zone: right_bottom
      when: The slides call
- id: loop
  stage: animation
  pdf: 35
  c:
  - Spanning Tree Protocol
  say: Networks want spare links, in case one fails. So connect three switches in
    a triangle. Now send one broadcast. S1 floods it to S2 and S3. Each floods it
    onward, to the other. Those copies come back, and get flooded again. IP has a
    TTL that kills looping packets. Ethernet has no such field. The copies circulate
    and multiply until the network collapses. A cycle in the wiring is fatal.
  moves:
  - clear: {}
  - net.show:
      name: tri
      zone: left
      nodes:
        S1:
          k: switch
          at:
          - 0
          - 1.3
          l: S1
          lp: up
        S2:
          k: switch
          at:
          - -2.4
          - -1.2
          l: S2
        S3:
          k: switch
          at:
          - 2.4
          - -1.2
          l: S3
      links:
      - - S1
        - S2
      - - S1
        - S3
      - - S2
        - S3
  - packet.spawn:
      name: b
      net: tri
      at: S1
      layers:
      - eth
      when: Now send one
  - packet.flood:
      name: b
      to:
      - S2
      - S3
  - packet.fade:
      name: b
  - packet.spawn:
      name: b2
      net: tri
      at: S2
      layers:
      - eth
      when: Each floods
  - packet.flood:
      name: b2
      to:
      - S3
      - S1
  - packet.fade:
      name: b2
  - packet.spawn:
      name: b3
      net: tri
      at: S3
      layers:
      - eth
      when: Those copies
  - packet.flood:
      name: b3
      to:
      - S2
      - S1
  - packet.fade:
      name: b3
  - text:
      name: why
      zone: right
      lines:
      - Ethernet has no hop limit.
      - Copies circulate and multiply.
      color: error
      when: IP has a TTL
  - packet.spawn:
      name: b4
      net: tri
      at: S2
      layers:
      - eth
      when: The copies circulate
  - packet.hop:
      name: b4
      to:
      - S3
      - S1
      - S2
      - S3
      - S1
      t: 2.5
  - packet.drop:
      name: b4
- id: stp
  stage: state
  pdf: 37
  c: &id001
  - Spanning Tree Protocol
  clar:
  - stp-simplified
  say: 'The fix is the spanning tree protocol. Keep every physical link, but let frames
    use only a loop-free subset. Switches exchange messages carrying three things:
    who they think the root is, their distance to it, and their own ID. Each begins
    by claiming to be the root. Hearing a lower ID, it gives up that claim.'
  moves:
  - text:
      name: why
      zone: right_top
      lines:
      - 'Each message: root ID, distance, sender ID'
      when: Switches exchange
  - net.badge:
      name: tri
      node: S2
      text: I'm root
      side: down
      when: Each begins
  - net.badge:
      name: tri
      node: S3
      text: I'm root
      side: down
      t: 0.3
  - msg.send:
      name: tri
      a: S1
      b: S2
      text: root S1
      when: Hearing a lower
      t: 1.0
  - net.unbadge:
      name: tri
      node: S2
- id: stp-2
  stage: state
  pdf: 37
  c: *id001
  say: Hearing a shorter path to the root, it adopts that path. In the triangle, S1
    becomes root, S2 and S3 use their direct links, and the link between them stops
    forwarding. Three switches, two active links, and no cycle. The slides simplify
    the real protocol, which also needs deterministic ties and a designated forwarder
    on each segment.
  moves:
  - msg.send:
      name: tri
      a: S1
      b: S3
      text: root S1
      when: Hearing a shorter
      t: 1.0
  - net.unbadge:
      name: tri
      node: S3
  - net.state:
      name: tri
      nodes:
        S1: done
      when: In the triangle
  - net.state:
      name: tri
