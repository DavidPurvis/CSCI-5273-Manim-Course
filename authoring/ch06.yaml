  c:
  - Port-Based VLANs
  - MAC-Based VLANs
  say: How does a switch know which VLAN a frame belongs to? There are two ways. With
    port-based VLANs, membership belongs to the port. Ports 1 through 8 are VLAN 10,
    and ports 9 through 16 are VLAN 20. Whatever plugs into that port joins that VLAN.
    With MAC-based VLANs, membership follows the machine's address instead, so a laptop
    keeps its VLAN wherever it plugs in.
