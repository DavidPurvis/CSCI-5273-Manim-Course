dish: '6.3'
title: Learning and loops
deck: lec06-lan.pdf
target_min: 6
concepts:
- Self-Learning Switch Tables
- Spanning Tree Protocol
beats:
- id: question
  stage: question
  pdf: 30
  c:
  - Self-Learning Switch Tables
  say: 'Nobody configures a home switch. You plug in the cables and it works. Yet
    it sends frames out the correct port. Where did that knowledge come from? Pause
    on a clue: every frame carries two addresses. Only one of them says where a machine
    actually is right now.'
  moves:
  - heading:
      text: 'Lecture 6: learning and loops'
  - q:
      text: Nobody configures a switch. How does it know where hosts are?
- id: setup
  stage: animation
  pdf: 31
  c:
  - Self-Learning Switch Tables
  say: A switch with an empty table, and three hosts. A is on port 1, B is on port
    2, and C is on port 3. A sends a frame to B. Watch the order of the next two steps,
    because they use two different addresses.
  moves:
  - clear: {}
  - net.show:
      name: sw
      zone: left
      nodes:
        X:
          k: switch
          at:
          - 0
          - 0
          l: Switch
          lp: up
        A:
          k: host
          at:
          - -3
          - -1
          l: A (port 1)
        B:
          k: host
          at:
          - 0
          - -1.6
          l: B (port 2)
        C:
          k: host
          at:
          - 3
          - -1
          l: C (port 3)
      links:
      - - A
        - X
      - - B
        - X
      - - C
        - X
  - table.show:
