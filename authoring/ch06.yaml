- id: learn
  stage: state
  pdf: 33
  c:
  - Self-Learning Switch Tables
  say: First, the switch looks at the source address. This frame says it came from
    A, and it arrived on port 1. So A must be reachable through port 1. Write that
    down. Second, it looks up the destination, B. B is not in the table, so the switch
    has no idea. It floods the frame out every other port. Note what it did not learn.
    It cannot learn where B is just because A mentioned B.
  moves:
  - packet.hop:
      name: f
      to: X
  - switch.learn_source:
      table: mac
      mac: A
      port: '1'
      when: So A must
  - packet.flood:
      name: f
      to:
      - B
      - C
      when: It floods
  - packet.fade:
      name: f
- id: reply
  stage: state
  pdf: 34
  c:
  - Self-Learning Switch Tables
  say: B answers. Its frame's source address teaches the switch that B is on port
    2. And now the destination, A, is in the table, so this frame goes only out port
    1. Finally, A sends to B once more. Nothing new to learn. The destination is known,
    and the frame goes only to port 2. C is no longer bothered.
  moves:
  - packet.spawn:
      name: g
      net: sw
      at: B
      layers:
      - eth
  - packet.hop:
      name: g
      to: X
  - switch.learn_source:
      table: mac
      mac: B
      port: '2'
      when: teaches the switch
  - packet.hop:
      name: g
      to: A
      when: so this frame
  - packet.fade:
      name: g
  - packet.spawn:
      name: h
      net: sw
      at: A
      layers:
      - eth
      when: Finally, A sends
  - packet.hop:
      name: h
      to:
      - X
      - B
  - packet.fade:
      name: h
  - table.show:
      name: tr
      zone: right_bottom
