- id: noack
  stage: rule
  pdf: 40
  c:
  - Wireless Error Recovery
  say: And a missing ACK does not prove a collision. The data might have been corrupted
    by noise, or the ACK itself might have been lost. Note too that this is a local,
    link-layer ACK, not TCP's. It repairs one radio hop. Together with coding, retries,
    and rate changes, that's wireless error recovery. It's done locally because the
    radio hop is where the errors happen. Local repair doesn't guarantee end to end
    delivery, though.
  moves:
  - clear: {}
  - bullets:
      name: na
      zone: top
      show: 0
      items:
      - Noise may have corrupted the data
      - The ACK itself may have been lost
      - A link-layer ACK repairs one radio hop, not TCP's job
  - reveal:
      name: na
      when: The data might
  - reveal:
      name: na
      when: or the ACK
  - reveal:
      name: na
      when: Note too
  - rule:
      text: No ACK does not prove a collision. Local recovery repairs one hop, not
        the whole path.
      when: Local repair
- id: rts
  stage: state
  pdf: 24
  c:
  - RTS and CTS
  say: CSMA/CA still doesn't cure the hidden terminal. For that, there's an optional
    reservation. Before sending data, A sends a short request to send, RTS, to B.
    B answers with clear to send, CTS. Here's the clever part. CTS comes from the
    receiver, so everybody near the receiver hears it, including hidden C. Now C knows
    to stay quiet. Then A sends the data, and B acknowledges.
