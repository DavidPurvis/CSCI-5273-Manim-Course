beats:
- id: question
  stage: question
  pdf: 21
  c:
  - CSMA-CA
  say: Ethernet senders listen before and during transmission, and they abort on a
    collision. Why can't Wi-Fi do the same thing? It has a radio, it can listen. Is
    there something about radio that breaks collision detection?
  moves:
  - heading:
      text: 'Lecture 14: contention and reservations'
  - q:
      text: Why can't Wi-Fi simply detect collisions like Ethernet?
  - keep: {}
- id: why
  stage: animation
  pdf: 22
  c:
  - CSMA-CA
  say: There are two reasons. First, while transmitting, a radio's own signal overwhelms
    the tiny signal arriving from elsewhere, so it can't really listen while it talks.
    Second, and more deeply, what matters isn't what the sender hears. What matters
    is what the receiver hears. That difference needs a picture.
  moves:
  - clear: {}
  - bullets:
      name: y
      zone: top
      show: 0
      items:
      - Its own signal drowns out what it would hear
      - The collision happens at the receiver, not at the sender
  - reveal:
      name: y
      when: First, while
  - reveal:
      name: y
      when: Second, and more
- id: hidden
  stage: animation
  pdf: 13
  c:
  - Hidden Terminals
  say: 'A, B, and C sit in a row. Each one''s radio range reaches only its neighbors.
    A hears B. C hears B. But A and C can''t hear each other. A senses the channel:
    silence. It starts sending to B. C senses too: silence, because it''s out of A''s
    range. It also starts sending to B. Each sender was perfectly polite, and both
    frames are destroyed at B. Neither of them noticed anything. This is the hidden
    terminal problem. Local sensing simply can''t see interference at a distant receiver.'
  moves:
