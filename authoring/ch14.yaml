dish: '14.3'
title: Joining and moving
deck: lec14-wireless.pdf
target_min: 5
concepts:
- Wireless Channels
- Wi-Fi Association
- Passive Scanning
- Active Scanning
- Wi-Fi Frame Addressing
- Same-Subnet Roaming
beats:
- id: question
  stage: question
  pdf: 18
  c:
  - Wi-Fi Association
  say: Open your laptop in a coffee shop. Several networks appear, and you click one.
    What has actually happened? Are you on the Internet yet? And when the frame leaves
    the laptop, whose address goes on it, the access point's, or the router's?
  moves:
  - heading:
      text: 'Lecture 14: joining and moving'
  - q:
      text: You click a Wi-Fi network. Are you on the Internet yet?
- id: channels
  stage: animation
  pdf: 17
  c:
  - Wireless Channels
  say: Start with the vocabulary. An access point and the stations associated with
    it form a basic service set, or BSS. Wi-Fi divides its spectrum into channels,
    and each access point operates on a chosen channel. Neighboring access points
    on overlapping channels interfere. The SSID is the human-readable network name,
    and the BSSID identifies one particular BSS. None of these are subnet masks, or
    IP addresses.
  moves:
  - clear: {}
  - table.show:
      name: v
      zone: top
      cols:
      - Term
      - Means
      rows:
      - - BSS
        - an AP and its stations
      - - Channel
        - a frequency resource
      - - SSID
        - the network's name
      - - BSSID
        - one particular BSS
- id: scan
  stage: animation
  pdf: 20
  c:
  - Passive Scanning
  - Active Scanning
  say: How do you find one? Two ways. In passive scanning, access points regularly
    send out beacons, and the laptop just listens. In active scanning, the laptop
    sends a probe request, and access points answer with probe responses. Either way,
    you end up with a list of candidates, and you choose one. Passive scanning costs
    the laptop only listening time. Active scanning finds networks sooner, at the
    price of a few transmissions.
  moves:
  - clear: {}
  - seq.show:
      name: pa
      zone: left
      lanes:
      - AP
      - Laptop
      steps: 4
  - seq.show:
      name: ac
      zone: right
      lanes:
      - AP
      - Laptop
      steps: 4
  - seq.msg:
      name: pa
      a: AP
      b: Laptop
      text: beacon
      kind: radio
      when: In passive
  - seq.msg:
      name: ac
      a: Laptop
      b: AP
      text: probe request
      kind: eth
      when: In active
  - seq.msg:
      name: ac
      a: AP
      b: Laptop
      text: probe response
      kind: radio
  - seq.msg:
      name: pa
      a: Laptop
      b: AP
      text: association request
      kind: eth
      when: you end up
  - seq.msg:
      name: pa
      a: AP
      b: Laptop
      text: association reply
      kind: radio
  - seq.msg:
      name: ac
      a: Laptop
      b: AP
      text: association request
      kind: eth
      when: you choose
  - seq.msg:
      name: ac
      a: AP
      b: Laptop
      text: association reply
      kind: radio
- id: assoc
  stage: rule
  pdf: 20
  c:
  - Wi-Fi Association
  say: That final exchange, a request and a reply, is association. It creates a link-layer
    relationship with one access point. It doesn't give you an IP address. So your
    laptop still needs DHCP, then ARP, then DNS, exactly as in chapter 5. Being associated
    means you can reach the AP, and nothing more.
  moves:
  - rule:
      text: Association is link-layer attachment. DHCP, ARP, and DNS still come afterward.
- id: addressing
  stage: state
  pdf: 31
  c:
  - Wi-Fi Frame Addressing
  say: The frame. An access point isn't a router. It bridges between radio and Ethernet.
    So a Wi-Fi frame needs to name both the immediate radio hop, and the final link-layer
    destination. Say host H1 sends to router R. Address one is the receiver on this
    radio hop, the AP. Address two is the transmitter, H1. Address three is R's MAC,
    which is where the AP should bridge the frame. The AP then emits an ordinary Ethernet
    frame, from H1 to R. H1 stays the Ethernet source. The AP never becomes the IP
    destination.
  moves:
  - clear: {}
  - net.show:
      name: f
      zone: top
      nodes:
        H:
          k: laptop
          at:
          - 0
          - 0
          l: H1
        A:
          k: ap
          at:
          - 4
          - 0
          l: AP
        R:
          k: router
          at:
          - 8
          - 0
          l: R
      links:
      - - H
        - A
        - s: radio
      - - A
        - R
  - table.show:
      name: ad
      zone: bottom
      cols:
      - Hop
      - Receiver
      - Transmitter
      - Also carries
      rows:
      - - Radio
        - AP
        - H1
        - 'Address 3: R'
      - - Ethernet
        - R
        - H1
        - (no AP address)
      show: 0
  - packet.spawn:
      name: p
      net: f
      at: H
      layers:
      - radio
      - ip
      when: Say host H1
  - table.reveal:
      name: ad
      when: Address one
  - packet.hop:
      name: p
      to: A
  - packet.swap_link_header:
      name: p
      when: The AP then
  - packet.hop:
      name: p
      to: R
  - table.reveal:
      name: ad
- id: four
  stage: state
  pdf: 32
  c:
  - Wi-Fi Frame Addressing
  clar:
  - wifi-4addr
  say: There's also a fourth address field. The slide says address 4 appears only
    in ad hoc mode, but its own table shows a bridged case. Don't memorize that note
    as a universal rule. Four-address operation is used for bridging and distribution
    scenarios.
  moves:
  - card:
      kind: clarification
      text: Four-address frames are a bridging case, not an ad hoc rule.
      zone: right_bottom
- id: roam
  stage: state
  pdf: 35
  c:
  - Same-Subnet Roaming
  say: Move. The laptop walks from access point 1 to access point 2. Both connect
    to one switch, on the same subnet. It associates with AP 2. Its IP address stays
    valid, because the subnet hasn't changed. So who updates what? The switch does,
    through its ordinary self-learning. The laptop's next frame arrives on a new port,
    so the switch's table changes. No Internet routes change. Chapter 2's mechanism
    handles this mobility case for free.
  moves:
  - clear: {}
  - net.show:
      name: r
