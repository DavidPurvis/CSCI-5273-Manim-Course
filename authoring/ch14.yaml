dish: '14.1'
title: What radio does to bits
deck: lec14-wireless.pdf
target_min: 5
concepts:
- Wireless Network Types
- Path Loss
- Radio Interference
- Multipath Propagation
- Signal-to-Noise Ratio and BER
- Rate Adaptation
beats:
- id: question
  stage: question
  pdf: 2
  c:
  - Wireless Network Types
  say: Our laptop leaves the wire. Everything above the link layer still works, in
    principle. Yet on radio, a frame that was perfect at the sender may be garbage
    at the receiver, and the sender may have no idea. What actually changes when the
    wire goes away?
  moves:
  - heading:
      text: 'Lecture 14: what radio does to bits'
  - spine:
      current: Radio
      zone: top
  - q:
      text: What actually changes when the wire goes away?
      zone: bottom
- id: two
  stage: animation
  pdf: 2
  c:
  - Wireless Network Types
  say: 'First, separate two ideas people often mix up. Wireless is about the medium:
    communicating over a radio link. Mobility is about changing your point of attachment.
    A fixed sensor is wireless, without being mobile. A laptop moved between wired
    subnets is mobile, without being wireless. This chapter is about the radio problem.
    The next is about movement.'
  moves:
  - clear: {}
  - table.show:
      name: wm
      zone: top
      cols:
      - Idea
      - Means
      - Example without the other
      rows:
      - - Wireless
        - a radio link
        - fixed sensor
      - - Mobile
        - changing attachment
        - laptop moved between wired subnets
- id: types
  stage: animation
  pdf: 10
  c:
  - Wireless Network Types
  say: 'Networks also differ in structure. In infrastructure mode, hosts talk through
    a base station, such as a Wi-Fi access point or a cell tower, that connects into
    the wired network. In ad hoc mode, there''s no base station, and the nodes organize
    themselves. And either kind can be single hop or multiple hops, as in a mesh network,
    where traffic is relayed through other wireless nodes. Two independent questions:
    is there infrastructure, and how many wireless hops?'
  moves:
  - table.show:
      name: tax
      zone: bottom
      cols:
      - ''
      - Single hop
      - Multiple hops
      rows:
      - - Infrastructure
        - Wi-Fi, cellular
        - mesh
      - - No infrastructure
        - Bluetooth, ad hoc
        - MANET, VANET
- id: rates
  stage: animation
  pdf: 7
  c:
  - Wireless Network Types
  clar:
  - era-context
  say: The slides chart radio technologies by rate and range, from Bluetooth at a
    couple of megabits per second, up through Wi-Fi and cellular generations. Those
    numbers belong to that era, and aren't promises about today's products. What lasts
    is the pattern. Higher rates tend to mean shorter range, and every link faces
    the same questions about frequency, coverage, and sharing.
  moves:
  - clear: {}
  - text:
      name: rt
      zone: top
      lines:
      - 'Bluetooth: low rate, short range'
      - 'Wi-Fi: higher rate, tens of meters'
      - 'Cellular: wide-area coverage'
  - rule:
      text: 'Rates on the chart are era-specific. The pattern lasts: higher rate,
        usually shorter range.'
- id: impair
  stage: animation
  pdf: 11
  c:
  - Path Loss
  - Radio Interference
  - Multipath Propagation
  say: 'The channel. Three separate things degrade a radio signal. Path loss: the
    signal weakens with distance, and when passing through obstacles. Interference:
    other transmitters and devices add competing energy, since many of them share
    frequencies like 2 point 4 gigahertz. And multipath: the signal bounces off walls
    and the ground, so delayed copies arrive at different times, and overlap with
    each other. An application may see the same symptom from all three, a lost packet,
    but they aren''t the same mechanism.'
  moves:
  - clear: {}
  - net.show:
      name: r
      zone: top
      nodes:
        T:
          k: ap
          at:
          - 0
          - 0.6
          l: Sender
        R:
          k: laptop
          at:
          - 8
          - 0.6
          l: Receiver
        W:
          k: box
          at:
          - 4
          - 1.8
          l: Wall
        I:
          k: box
          at:
          - 4
          - -0.4
          l: Other device
      links:
      - - T
        - R
        - s: radio
  - radio.pulse:
      net: r
      node: T
      radius: 3
      when: Path loss
  - radio.pulse:
      net: r
      node: I
      radius: 2
      kind: tunnel
      when: Interference
  - net.add:
      name: r
      links:
      - - T
        - W
        - s: radio
      - - W
        - R
        - s: radio
      when: And multipath
  - bullets:
      name: im
      zone: bottom
      show: 3
      items:
      - 'Path loss: weakens with distance and obstacles'
      - 'Interference: competing energy'
      - 'Multipath: delayed reflected copies'
- id: snr
  stage: state
  pdf: 12
  c:
  - Signal-to-Noise Ratio and BER
  say: 'To measure signal quality, we compare signal power to noise power. That''s
    the signal to noise ratio, in decibels: 10 times log base 10 of signal over noise.
    A power ratio of 100 is 20 decibels. Higher SNR means fewer errors. The result
    is called bit error rate, or BER: the fraction of bits received wrong. These curves
    show the tradeoff. At the same SNR, a low-rate, robust scheme gives very few errors,
    while a high-rate scheme fails.'
  moves:
  - clear: {}
  - tex:
      name: s
      zone: left_top
      tex: \text{SNR}_{dB}=10\log_{10}\frac{S}{N}\qquad 100\to 20\text{ dB}
      size: 36
  - plot.show:
      name: ber
      zone: right
      xlabel: SNR
      ylabel: Bit error rate
      xr:
      - 0
      - 10
      yr:
      - 0
      - 10
      curves:
      - name: low
        k: radio
        points:
        - - 0
          - 8
        - - 2
          - 4
        - - 4
          - 1.5
        - - 6
          - 0.4
        - - 8
          - 0.1
      - name: high
        k: tunnel
        points:
        - - 2
          - 9
        - - 4
          - 7
        - - 6
          - 4
        - - 8
          - 1.5
        - - 10
          - 0.4
    when: These curves
  - plot.mark:
      name: ber
      x: 4
      y: 1.5
      text: 'low rate: works'
      state: done
      when: a low-rate
  - plot.mark:
      name: ber
      x: 6
      y: 4
      text: 'high rate: fails'
      state: error
      when: while a high-rate
- id: adapt
  stage: state
  pdf: 36
  c:
  - Rate Adaptation
  say: A radio link can't just pick one rate and stick to it. As a host moves away,
    SNR falls, and errors climb. Rate adaptation lowers the physical rate, moving
    to a more robust scheme. Raw rate is not goodput. Repeated failures at a high
    rate can deliver less than steady success at a low rate. And why not just raise
    the power? That burns energy, and it interferes with everybody else.
  moves:
  - text:
      name: ad
      zone: left_bottom
      lines:
      - 'SNR falls: lower the rate'
      - Raw rate is not goodput
- id: rule
  stage: rule
  pdf: 12
  c:
  - Signal-to-Noise Ratio and BER
  say: The rule is, the link's capacity isn't a fixed number. It depends on distance,
    surroundings, and everyone else who's transmitting at this moment.
  moves:
  - rule:
      text: A radio link's usable rate changes with distance, surroundings, and other
        transmitters.
- id: pitfall
  stage: rule
  pdf: 12
  c:
  - Signal-to-Noise Ratio and BER
  say: Turning up the power seems like an easy fix for a weak signal. But it drains
    the battery, and it raises interference for everyone nearby.
  moves:
  - trap:
      wrong: More power is a free fix
      right: It costs battery, and raises interference for others
- id: changed
  stage: changed_example
  pdf: 12
  c:
  - Signal-to-Noise Ratio and BER
  say: Try the arithmetic. A receiver's signal is 1,000 times stronger than the noise.
    Then the laptop walks behind a wall, and the ratio drops to 10.
  moves:
  - clear: {}
  - table.show:
      name: db
      zone: top
      cols:
      - Power ratio
      - SNR
      rows:
      - - '100'
        - 20 dB
      - - '1000'
        - '?'
      - - '10'
        - '?'
- id: predict
  stage: prediction
  pdf: 12
  hold: 12
  c:
  - Signal-to-Noise Ratio and BER
  say: What are those two values, in decibels? And what should the sender do after
    the drop?
  moves:
  - pause:
      text: both SNR values in dB? what should the sender do?
      long: true
- id: answer
  stage: explanation
  pdf: 12
  c:
  - Signal-to-Noise Ratio and BER
  say: 1,000 is 30 decibels. 10 is 10 decibels. That's a large drop, and the sender
    should adapt to a slower, more robust rate. Each station can react to its own
    radio conditions. But here's something it can't deal with alone. How do many stations
    share this one radio channel? Here's a very different answer to that question.
  moves:
  - table.set:
      name: db
      r: 1
      c: 1
      v: 30 dB
      state: done
  - table.set:
      name: db
      r: 2
      c: 1
      v: 10 dB
      state: done
  - rule:
      text: 'Next: can two senders use the same channel at the same time?'
  - keep: {}
prediction_contracts:
- prediction_beat: 14.1.predict
  answer_beat: 14.1.answer
  answer_events:
  - 14.1.answer:move:0
  - 14.1.answer:move:1
  - 14.1.answer:move:2
  answer_objects:
  - object: db
    after: 14.1.answer:move:0
    effect: table.set
    selector:
      r: 1
      c: 1
    before_answer: hidden_or_neutral
  - object: db
    after: 14.1.answer:move:1
    effect: table.set
    selector:
      r: 2
      c: 1
    before_answer: hidden_or_neutral
  - object: _rule
    after: 14.1.answer:move:2
    effect: rule
    selector: {}
    before_answer: hidden_or_neutral
  review_scope: Inspect the listed answer objects for neutral or hidden state during
    the prediction hold.
