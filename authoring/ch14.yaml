- id: predict
  stage: prediction
  pdf: 35
  hold: 6
  c:
  - Same-Subnet Roaming
  say: Does the laptop keep working with its old address? Does matching SSID text
    guarantee anything?
  moves:
  - pause:
      text: does the old address still work? what does the SSID guarantee?
- id: answer
  stage: explanation
  pdf: 35
  c:
  - Same-Subnet Roaming
  say: 'It does not keep working. The old address doesn''t belong on that subnet,
    so return traffic gets routed to the wrong place. A matching SSID is just a matching
    name. What counts is subnet continuity. Crossing subnets is the true mobility
    problem, and we''ll take that on next chapter. First, a problem that hits every
    Wi-Fi network: when stations share one channel, who''s allowed to talk?'
  moves:
  - rule:
      text: Matching SSIDs are just matching names. Subnet continuity is what counts.
  - keep: {}
