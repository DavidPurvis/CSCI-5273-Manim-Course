  say: C hears the CTS, so it sets its NAV, and it defers. That protects B's reception.
    E hears only the RTS. RTS frames also carry a duration, so in the standard behavior,
    E sets its NAV too, even though it might not harm B. E is exposed, and the shortcut
    of ignoring it is the idealization we flagged. So the radio link now works, for
    a laptop that stays put. But what if it doesn't? When a phone drives across a
    city, changing towers every few minutes, how can a call stay up, and how can anyone
    even find it?
