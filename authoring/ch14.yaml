      track: Sender
      start: 0
      end: 2
      text: DIFS
      kind: data
      when: Wait until
  - tl.block:
      name: c
      track: Sender
      start: 2
      end: 4
      text: backoff
      kind: label
      when: Then count down
  - tl.block:
      name: c
      track: Sender
      start: 4
      end: 9
      text: DATA
      kind: radio
      when: Transmit when
  - tl.block:
      name: c
      track: Receiver
      start: 9
      end: 10
      text: SIFS
      kind: data
      when: after a shorter
  - tl.block:
      name: c
      track: Receiver
      start: 10
      end: 12
      text: ACK
      kind: ip
      when: returns an ACK
  - rule:
      text: CSMA/CA avoids collisions. A shorter gap lets the ACK go first.
      when: So the ACK goes
