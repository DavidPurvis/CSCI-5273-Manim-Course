  say: There's a mirror image. Now B sends to A, and C wants to send to D, on the
    far side. C hears B, so carrier sense says wait. But C's signal wouldn't reach
    A at all. These two transmissions could have happened at the same time safely.
    Sensing suppressed useful concurrency. That's the exposed terminal problem. A
    note of care, though. The slide's shortcut, about hearing an RTS but not a CTS,
