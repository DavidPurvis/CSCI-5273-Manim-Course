dish: '14.2'
title: CDMA
deck: lec14-wireless.pdf
target_min: 4
concepts:
- CDMA
beats:
- id: question
  stage: question
  pdf: 14
  c:
  - CDMA
  say: In a crowded room, two pairs can talk at once if one pair speaks English and
    the other speaks French. You filter out what you can't decode. Could two senders
    transmit on the same frequency at the same time, with the receiver still separating
    them?
  moves:
  - heading:
      text: 'Lecture 14: CDMA'
  - q:
      text: Can two senders share a channel at the same moment?
- id: codes
  stage: animation
  pdf: 14
  c:
  - CDMA
  say: 'That''s the idea behind code division multiple access. Each sender gets its
    own code, a sequence of plus and minus ones, called chips. Sender one uses 1,
    1, minus 1, minus 1. Sender two uses 1, minus 1, 1, minus 1. The magic is in how
    these two relate. Multiply them chip by chip, and add: 1, minus 1, minus 1, plus
    1. That''s zero. The codes are orthogonal.'
  moves:
  - clear: {}
  - chips.show:
      name: c
      zone: top
      rows:
      - label: c1
        values: $wireless.c1
      - label: c2
        values: $wireless.c2
      show: 0
  - chips.reveal:
      name: c
      when: Sender one uses
  - chips.reveal:
      name: c
      when: Sender two uses
  - tex:
      name: d
      zone: bottom
      tex: c_1\cdot c_2 = 1-1-1+1 = 0
      size: 48
      when: Multiply them
- id: send
  stage: state
  pdf: 15
  c:
  - CDMA
  say: To send a bit, multiply the whole code by the bit's value. Sender one sends
    plus 1, so it transmits its code unchanged. Sender two sends minus 1, so it transmits
    its code flipped. On the air, the signals simply add. Chip by chip, the receiver
    gets 0, 2, minus 2, 0. This sum looks like neither sender.
  moves:
  - clear: {}
  - chips.show:
      name: w
      zone: full
      rows:
      - label: c1, bit +1
        values: $wireless.first_rows.a
      - label: c2, bit -1
        values: $wireless.c2
      - label: z
        values: $wireless.first.z
      show: 0
  - chips.reveal:
      name: w
      when: Sender one sends
  - chips.reveal:
      name: w
      when: Sender two sends
  - chips.flip:
      name: w
      row: 1
      values: $wireless.first_rows.b
      label: c2, bit -1
      when: so it transmits its code flipped
  - chips.sum:
      name: w
      when: On the air
  - rule:
      text: The sum on the air looks like neither sender.
      when: This sum
- id: decode
  stage: state
  pdf: 16
  c:
  - CDMA
  say: Decode. To hear sender one, take the dot product of the received signal with
    c 1, then divide by 4, the code length. 0 times 1, plus 2 times 1, plus minus
    2 times minus 1, plus 0. That's 4, over 4, which is plus 1. Sender one's bit is
    recovered. With c 2, 0, minus 2, minus 2, plus 0 gives minus 4, over 4, which
    is minus 1. Why does this work? Correlating with c 1 leaves sender two's contribution
    multiplied by c 1 dot c 2, and that's zero. Sender two simply vanishes.
  moves:
  - clear: {}
  - chips.show:
      name: w
      zone: left
      rows:
      - label: z
        values: $wireless.first.z
      - label: c1
        values: $wireless.c1
      - label: c2
        values: $wireless.c2
  - chips.dot:
      name: w
      a: 0
      b: 1
      products: $wireless.first_rows.corr1
      total: 4
      result: '+1'
      when: 0 times 1
      t: 4.5
  - chips.dot:
      name: w
      a: 0
      b: 2
      products: $wireless.first_rows.corr2
      total: -4
      result: '-1'
      when: With c 2
      t: 4
  - rule:
      text: "Correlating with c1 multiplies sender two by c1 \xB7 c2, and that's zero."
      when: Why does this
- id: rule
  stage: rule
  pdf: 16
  c:
  - CDMA
  say: 'In formula form: the sum of each bit times its code goes out on the air. The
    receiver takes z dot c k, over M, the code length. This is an ideal model. It
    assumes synchronized chips and well balanced powers. It''s a clean demonstration,
    not a promise of zero interference in the real world.'
  moves:
  - clear: {}
  - tex:
      name: f1
      zone: top
      tex: z=\sum_k d_k\,c_k
      size: 54
      when: In formula form
  - tex:
      name: f2
      zone: bottom
      tex: d_k=\frac{z\cdot c_k}{M}
      size: 54
      when: The receiver takes
  - rule:
      text: 'Ideal model: synchronized chips, balanced power.'
      when: This is an ideal
  pre_roll: 0.7
- id: pitfall
  stage: rule
  pdf: 16
  c:
  - CDMA
  say: 'Don''t treat orthogonality as magic. It cancels the other sender only under
    ideal conditions: synchronized chips, balanced powers, and little noise.'
  moves:
  - trap:
      wrong: Orthogonal codes never interfere
      right: Only with synchronized chips and balanced powers
- id: changed
  stage: changed_example
  pdf: 16
  c:
  - CDMA
  say: Change one bit. Sender one also sends minus 1, so both bits are minus 1.
  moves:
  - clear: {}
  - chips.show:
      name: w
      zone: upper
      rows:
      - label: c1, bit -1
        values: $wireless.second_rows.a
      - label: c2, bit -1
        values: $wireless.second_rows.b
      - label: z
        values: $wireless.second.z
      show: 2
- id: predict
  stage: prediction
  pdf: 16
  hold: 12
  c:
  - CDMA
  say: What's the new sum z? And what do you get when you decode each sender?
  moves:
  - pause:
      text: the new z? what does each sender decode to?
      long: true
- id: answer
  stage: explanation
  pdf: 16
  c:
  - CDMA
  say: 'z is minus 2, 0, 0, 2. Correlate with c 1: minus 2, plus 0, minus 0, minus
    2, which is minus 4, over 4, or minus 1. Correlate with c 2: also minus 4 over
    4, or minus 1. Both bits come out right. Codes are one way to share a medium,
    and cellular networks have used them. But Wi-Fi takes a completely different approach.
    Before that, a laptop has to find a network to join in the first place.'
  moves:
  - chips.sum:
      name: w
      when: z is minus 2
  - tex:
      name: dc1
      zone: lower
      tex: z\cdot c_1/4=(-2+0+0-2)/4=-1
      size: 38
      when: Correlate with c 1
  - tex:
      name: dc2
      zone: lower
      tex: z\cdot c_2/4=(-2+0+0-2)/4=-1
      size: 38
      when: Correlate with c 2
  - rule:
      text: "Both decode to \u22121. Next: joining a Wi-Fi network."
      when: Both bits
  - keep: {}
prediction_contracts:
- prediction_beat: 14.2.predict
  answer_beat: 14.2.answer
  answer_events:
  - 14.2.answer:move:0
  - 14.2.answer:move:1
  - 14.2.answer:move:2
  - 14.2.answer:move:3
  answer_objects:
  - object: w
    after: 14.2.answer:move:0
    effect: chips.sum
    selector: {}
    before_answer: hidden_or_neutral
  - object: dc1
    after: 14.2.answer:move:1
    effect: tex
    selector: {}
    before_answer: hidden_or_neutral
  - object: dc2
    after: 14.2.answer:move:2
    effect: tex
    selector: {}
    before_answer: hidden_or_neutral
  - object: _rule
    after: 14.2.answer:move:3
    effect: rule
    selector: {}
    before_answer: hidden_or_neutral
  review_scope: Inspect the listed answer objects for neutral or hidden state during
    the prediction hold.
