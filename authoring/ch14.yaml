- id: tradeoff
  stage: rule
  pdf: 26
  c:
  - RTS and CTS
  say: Is this free? No. RTS frames can themselves collide, but they're short, so
    a collision costs much less than losing a long data frame. And the four-frame
    exchange adds overhead. For short frames on a quiet channel, that overhead can
    exceed what it saves. So choose it for long frames under real contention.
