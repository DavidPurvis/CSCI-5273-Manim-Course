      when: The data plane
  - table.reveal:
      name: pl
      when: The control plane
  - table.reveal:
      name: pl
      when: The management plane
  - rule:
      text: Static entries don't adapt to failures, new equipment, or load.
      when: Tables could
- id: macvsip
  stage: state
  pdf: 35
  c:
  - Router Architecture
  say: 'It''s also a good moment to compare our two forwarding worlds, as the instructor''s
    questions do. Are both MAC and IP addresses allocated hierarchically? Yes, both
    are: MAC blocks go to vendors, and IP blocks go down through registries. Which
    is organized by topology? Only IP. Which forwards by exact match? MAC, since IP
    uses longest prefix. Which builds its table automatically, by watching data? Ethernet
    switches. Which keeps per-host state in the network? MAC. Routers keep state per
    prefix. And which keeps per-connection state? Neither one. These answers are worked
    out from the lecture''s material, as the slide gives no key.'
  moves:
