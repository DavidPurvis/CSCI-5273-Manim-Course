      when: An operator installs
- id: predict
  stage: prediction
  pdf: 29
  hold: 12
  c:
  - Longest Prefix Matching
  say: Which output does it take now? And what would 201.10.6.33 do?
  moves:
  - pause:
      text: the output for 201.10.6.17, and for 201.10.6.33?
      long: true
- id: answer
  stage: explanation
  pdf: 29
  c:
  - Longest Prefix Matching
  say: The slash 28 covers 201.10.6.16 through 31, so 201.10.6.17 goes to D. The metric
    never entered into it. And 201.10.6.33 is outside the slash 28, so the slash 23
    catches it, output B. Finding the output is only half of forwarding, though. The
    packet still has to physically cross the router. So let us go inside.
  moves:
  - table.mark:
      name: rt2
      r: 2
      state: done
      when: The slash 28 covers
  - bullets:
      name: an
      zone: bottom
      show: 0
      items:
      - "201.10.6.17 \u2192 /28 \u2192 D"
