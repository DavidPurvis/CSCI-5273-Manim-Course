- id: rule
  stage: rule
  pdf: 26
  c:
  - Router Architecture
  - Output Queuing and Scheduling
  say: Before proposing a fix, find the contention. Is it at lookup, in the memory
    or bus or fabric, in an input queue, or at the output? Upgrading one simply moves
