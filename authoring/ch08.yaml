      when: Parallel paths
- id: hol
  stage: state
  pdf: 24
  c:
  - Input Queuing and HOL Blocking
  say: Even a crossbar has a trap. If two inputs want the same output at once, one
    must wait. Say input B and input C both have a head packet for output 1. B wins.
    C's head packet stays blocked. Now look behind it. C's second packet wants output
    2, and output 2 is idle. But the queue is first in, first out, so that packet
    is stuck behind the blocked head. This is head of line blocking. A free output
    sits unused because of how the queue is arranged.
  moves:
  - clear: {}
  - queue.show:
      name: qb
      zone: left_top
      items:
      - to 1
      kind: ip
      title: Input B
  - queue.show:
      name: qc
      zone: left_bottom
      items:
      - to 2
      - to 1
      kind: eth
      title: Input C
  - bullets:
      name: idle
      zone: right
      show: 0
      items:
      - 'Output 1: busy with B'
      - 'Output 2: idle, yet unused'
  - queue.pop:
      name: qb
      when: B wins
  - reveal:
      name: idle
      when:
        phrase: B wins
        frame_offset: 21
  - queue.mark:
      name: qc
      i: 1
      state: error
      when: C's head packet
  - queue.mark:
      name: qc
      i: 0
      state: candidate
      when: C's second packet
  - reveal:
      name: idle
      when: and output 2
  - rule:
      text: 'Head of line blocking: a free output sits unused because of how the queue
        is arranged.'
      when: This is head
- id: outq
  stage: state
  pdf: 25
  c:
  - Output Queuing and Scheduling
  say: Packets can also wait at the output, and this limit is physical. Three 1,500
    byte packets arrive together at a 12 megabit per second output. Each needs 1 millisecond
    to transmit. So they finish at 1, 2, and 3 milliseconds, after waiting 0, 1, and
    2. A faster fabric can't help, because the wire has a fixed rate. If arrivals
    keep exceeding that rate, the buffer eventually fills, and something is dropped.
    A drop policy chooses what to discard. A scheduler chooses what to send next.
    Priority shifts who suffers, but it creates no new bits per second.
  moves:
  - clear: {}
  - queue.show:
      name: oq
      zone: left_top
      items:
      - P3
      - P2
      - P1
      kind: ip
      title: Output queue
  - table.show:
      name: ot
      zone: right_top
      data: $router.output_table
      show: 0
  - queue.pop:
      name: oq
      when: So they finish
  - table.reveal:
      name: ot
  - queue.pop:
      name: oq
      t: 0.5
  - table.reveal:
      name: ot
      t: 0.4
  - queue.pop:
      name: oq
      t: 0.5
  - table.reveal:
      name: ot
      t: 0.4
  - bullets:
      name: pol
      zone: bottom
      show: 0
      items:
      - 'Drop policy: what to discard'
      - 'Scheduler: what to send next'
      - Priority shifts who suffers, not the total rate
  - reveal:
      name: pol
      when: A drop policy
  - reveal:
      name: pol
      when: A scheduler
  - reveal:
      name: pol
      when: Priority shifts
- id: timescales
  stage: state
  pdf: 34
  c:
  - Router Architecture
  say: Step back from the queues, and look at the timescales in this machine. The
    data plane forwards, buffers, and schedules, in nanoseconds per packet, in line
    card hardware. The control plane runs routing and signaling, in tens of milliseconds
    to seconds per event, in router software. The management plane is people and scripts
    doing analysis and configuration, in minutes to hours. Tables could be typed in
    statically, but static entries don't adapt to failures, new equipment, or load.
  moves:
  - clear: {}
  - table.show:
      name: pl
      zone: top
      cols:
