          l: Input 2
        D:
          k: box
          at:
          - 8
          - 1
          l: Output 1
        E:
          k: box
          at:
          - 8
          - -1
          l: Output 2
      links:
      - - A
        - B
      - - C
        - B
      - - B
        - D
      - - B
        - E
