- id: predict
  stage: prediction
  pdf: 25
  hold: 6
  c:
  - Output Queuing and Scheduling
  say: Will it help? What would a bigger buffer do instead?
  moves:
  - pause:
      text: does a faster fabric help? does a bigger buffer?
- id: answer
  stage: explanation
  pdf: 25
  c:
  - Output Queuing and Scheduling
  - Router Architecture
  say: It won't. Packets just reach the same full output sooner. A bigger buffer absorbs
    short bursts, but under persistent overload it only adds delay before the same
    drops. The output's rate is the limit. That finishes the forwarding path, given
    a table. We assumed our laptop already knew its own address, its router, and its
    destination. It knew none of them when it woke up. So how does it find out?
  moves:
  - bullets:
      name: ans
      zone: bottom
      show: 0
      items:
      - 'Faster fabric: reaches the same full output sooner'
      - 'Bigger buffer: absorbs bursts, adds delay under overload'
  - reveal:
      name: ans
      when: Packets just
  - reveal:
      name: ans
      when: A bigger buffer
  - rule:
      text: 'Next: how did the laptop learn its address at all?'
      when: We assumed
  - keep: {}
