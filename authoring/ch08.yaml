  - net.state:
      name: bus
      nodes:
        B: error
      when: The bus is
- id: crossbar
  stage: animation
  pdf: 22
  c:
  - Crossbar and Clos Switching
  say: The third design is an interconnection network, such as a crossbar. Now input
    1 to output 2 and input 2 to output 1 can transfer at the same moment, over separate
    crossing points. Clos networks build big fabrics out of small switching stages.
    Many of them chop packets into fixed internal cells. Those cells are an internal
    technique, not IP fragments.
  moves:
  - net.show:
      name: xb
      zone: bottom
      nodes:
        A:
          k: box
          at:
          - 0
          - 1
          l: Input 1
        C:
          k: box
          at:
          - 0
          - -1
          l: Input 2
        D:
          k: box
          at:
          - 8
          - 1
          l: Output 1
        E:
          k: box
          at:
          - 8
          - -1
          l: Output 2
      links:
      - - A
        - E
        - s: now
      - - C
        - D
        - s: active
  - packet.spawn:
      name: x1
      net: xb
      at: A
      layers:
      - ip
      when: The third design
  - packet.spawn:
      name: x2
      net: xb
      at: C
      layers:
      - eth
  - packet.both:
      moves:
      - name: x1
        to: E
      - name: x2
        to: D
      when: Now input 1
      t: 2
  - rule:
      text: Those cells are an internal technique, not IP fragments.
      when: Those cells
  pre_roll: 1.4000000000000001
- id: crossbar-more
  stage: state
  pdf: 22
  c:
  - Crossbar and Clos Switching
  say: There's still a limit. Input 1 to output 2 and input 2 to output 1 can move
    together. But send both inputs to output 1, and they contend for that one output.
    Parallel paths inside the fabric create no extra capacity at a single output.
  moves:
  - packet.fade:
      name: x1
  - packet.fade:
      name: x2
  - packet.spawn:
      name: y1
      net: xb
      at: A
      layers:
      - ip
      when: But send both
  - packet.spawn:
      name: y2
      net: xb
      at: C
      layers:
      - eth
  - packet.both:
