      text: 'Locate the contention first: lookup, fabric, input queue, or output.'
      when: Upgrading one
- id: pitfall
  stage: rule
  pdf: 26
  c:
  - Router Architecture
  - Output Queuing and Scheduling
  say: Careful with memory switching. Its internal copy rate is not its useful throughput.
    Each packet crosses memory twice, so useful throughput is half.
  moves:
  - trap:
      wrong: Memory switching forwards at the full memory bandwidth
      right: Each packet crosses twice, so throughput is half of it
