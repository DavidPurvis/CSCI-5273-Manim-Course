      net: bus
      at: A
      layers:
      - ip
      when: A packet crosses
  - packet.hop:
      name: bp
      to:
      - B
      - E
  - packet.fade:
      name: bp
  - packet.spawn:
      name: b1
      net: bus
      at: A
      layers:
      - ip
      when: But only one
  - packet.spawn:
      name: b2
      net: bus
      at: C
      layers:
      - eth
  - packet.hop:
      name: b1
      to:
      - B
      - D
      t: 1.2
  - net.state:
