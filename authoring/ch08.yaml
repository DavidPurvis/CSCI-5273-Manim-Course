dish: '8.2'
title: The longest match
deck: lec08-network2.pdf
target_min: 7
concepts:
- Longest Prefix Matching
- Patricia Tries
- Content-Addressable Memory
- TCAM
- Generalized Forwarding
beats:
- id: question
  stage: question
  pdf: 13
  c:
  - Longest Prefix Matching
  say: R1 holds a table of prefixes. Because prefixes can nest, one destination can
    match several entries at once. Which one should win? And how can a router decide
    this in a few nanoseconds, a few million times every second?
  moves:
  - heading:
      text: 'Lecture 8: the longest match'
  - q:
      text: One destination matches several routes. Which one wins?
- id: table
  stage: animation
  pdf: 29
  c:
  - Longest Prefix Matching
  say: A router's table with three entries. 201.10.0.0/21 goes out output A. Inside
    that block, 201.10.6.0/23 goes out output B. And 0.0.0.0/0 goes out output C.
    Those entries overlap on purpose. The slash 21 is an aggregate, the slash 23 is
    an exception carved out of it, and the slash 0 is the fallback.
  moves:
  - clear: {}
  - table.show:
      name: rt
      zone: left_top
      data: $lpm.routes
      show: 0
  - table.reveal:
      name: rt
      when: 201.10.0.0/21 goes
  - table.reveal:
      name: rt
      when: Inside that block
  - table.reveal:
      name: rt
      when: And 0.0.0.0/0
  - bullets:
      name: note
      zone: right_top
      show: 0
      items:
      - /21 is an aggregate
      - /23 is an exception inside it
      - /0 is the fallback
  - reveal:
      name: note
      when: The slash 21 is
  - reveal:
      name: note
      when: the slash 23 is
  - reveal:
      name: note
      when: and the slash 0
- id: match
  stage: state
  pdf: 29
  c:
  - Longest Prefix Matching
  say: A packet arrives for 201.10.6.17. To test a route, mask the destination with
    the route's prefix length and compare. Under the slash 21 mask it matches. Under
    the slash 23 it also matches. And slash 0 matches everything. Three matches. The
    rule is longest prefix match. Choose the match with the most network bits, because
    it is the most specific claim. So the slash 23 wins, and the packet leaves on
    output B.
  moves:
  - table.mark:
      name: rt
      r: 0
      state: candidate
      when: Under the slash 21
  - table.mark:
      name: rt
      r: 1
      state: candidate
      when: Under the slash 23
  - table.mark:
      name: rt
      r: 2
      state: candidate
      when: And slash 0
  - rule:
      text: 'Longest prefix match: the most network bits is the most specific claim.'
      when: The rule is
  - table.flash:
      name: rt
      rows:
      - 0
      - 2
      state: null
      when: So the slash 23
  - table.mark:
      name: rt
      r: 1
      state: done
  - table.show:
      name: lk
      zone: bottom
      data: $lpm.lookup_table
      show: 1
- id: more
  stage: state
  pdf: 29
  c:
  - Longest Prefix Matching
  say: 201.10.4.8. Its third byte, 4, lies within the slash 21, which covers 0 through
    7, but not within the slash 23, which covers only 6 and 7. So output A. And 203.0.113.8
    matches only the fallback, so output C. A route's position in the list does not
    matter. Neither does any metric from an unrelated route. Only prefix length decides
    among installed matches.
  moves:
  - table.mark:
      name: rt
      r: 1
      state: null
  - fade:
      names: _rule
  - table.reveal:
      name: lk
      when: 201.10.4.8
  - table.mark:
      name: rt
      r: 0
      state: done
      when: So output A
  - table.reveal:
      name: lk
      when: And 203.0.113.8
  - table.flash:
      name: rt
      rows:
      - 0
      state: null
  - table.mark:
      name: rt
      r: 2
      state: done
  - rule:
      text: Only prefix length decides among installed matches.
      when: A route's position
  pre_roll: 1.1
- id: bitlevel
  stage: state
  pdf: 15
  c:
  - Longest Prefix Matching
  say: Let's see this at the level of bits, because that's what the hardware does.
    Write the destination, 201.10.6.17, above the route's network, 201.10.6.0. Under
    a slash 23, only the first 23 bits count. Compare them. Every one matches, so
    this route matches. Whatever's to the right of the boundary doesn't matter. Now
    compare 201.10.4.8 against that same route. Look at the third byte. 4 is 00000100,
    and 6 is 00000110. They differ in bit 23, inside the prefix. So that's no match,
    and that second packet falls through to the shorter route.
  moves:
  - clear: {}
  - bits.show:
      name: lb
      zone: full
      rows:
      - label: Destination 201.10.6.17
        value: 201.10.6.17
      - label: Route 201.10.6.0/23
        value: 201.10.6.0
  - bits.draw_mask:
      name: lb
      prefix: 23
      when: Under a slash 23
  - bits.mark:
      name: lb
      row: 0
      start: 0
      end: 23
      state: done
      when: Every one matches
  - bits.mark:
      name: lb
      row: 0
      start: 23
      end: 32
      state: candidate
      when: Whatever's to the right
  - bits.add:
      name: lb
      label: Destination 201.10.4.8
      value: 201.10.4.8
      when: Now compare
  - bits.mark:
      name: lb
      row: 2
      start: 16
      end: 24
      state: now
      when: Look at the third
  - bits.mark:
      name: lb
      row: 2
      start: 22
      end: 23
      state: error
      when: They differ
- id: budget
  stage: animation
  pdf: 30
  c:
  - Longest Prefix Matching
  clar:
  - budget-51
  say: The speed problem. Scanning every route is far too slow. On a 10 gigabit link
    with 64 byte packets, there are about 19 and a half million packets each second,
    which leaves 51 point 2 nanoseconds per packet. That calculation leaves out Ethernet's
    physical overhead, so treat it as a budget illustration. But the conclusion holds.
    There is no time for a linear scan.
  moves:
  - clear: {}
  - tex:
      name: bud
      zone: top
      tex: \frac{10^{10}\text{ b/s}}{8\times 64\text{ bits}}=19{,}531{,}250\text{
        packets/s}\ \Rightarrow\ 51.2\text{ ns}
      size: 40
      when: On a 10 gigabit
  - card:
      kind: note
      text: 'This leaves out Ethernet''s physical overhead: a budget illustration.'
      zone: bottom
      when: That calculation
  - rule:
      text: No time for a linear scan.
      when: But the conclusion
- id: trie
  stage: state
  pdf: 31
  c:
  - Patricia Tries
  say: One answer is a trie, a tree you walk one address bit at a time. Follow the
    destination's bits down from the root. Whenever you pass a node holding a route,
    remember it. If the path dead-ends deeper down, you still have the last route
    you remembered. That is why a failed deep branch does not lose the earlier match.
    A Patricia trie compresses long chains with no branching, and multi-bit nodes
    trade memory for fewer steps.
  moves:
  - clear: {}
  - net.show:
      name: tr
      zone: full
      nodes:
        r:
          k: node
          at:
          - 0
          - 2
          l: /0
        a:
          k: node
          at:
          - -2.4
          - 1
          l: /21
        n:
          k: node
          at:
          - 4
          - 1
          l: "\xB7"
        b:
          k: node
          at:
          - -3.8
          - 0
          l: /23
        m:
          k: node
          at:
          - -1
          - 0
          l: "\xB7"
      links:
      - - r
        - a
        - c: "\u2026"
      - - r
        - n
      - - a
        - b
        - c: '11'
      - - a
        - m
  - net.state:
      name: tr
      nodes:
        r: now
      when: Follow the destination
  - net.badge:
      name: tr
      node: r
      text: remember /0
      side: right
      state: now
      when: Whenever you pass
  - net.walk:
      name: tr
      path:
      - r
      - a
      state: now
  - net.state:
      name: tr
      nodes:
        r: null
        a: candidate
  - net.badge:
      name: tr
      node: a
      text: remember /21
      side: left
      state: now
  - net.walk:
      name: tr
      path:
      - r
      - a
      - m
      state: error
      when: If the path
  - net.state:
      name: tr
      nodes:
        m: error
  - net.state:
      name: tr
      nodes:
        a: done
        m: null
      when: That is why
  - net.unwalk:
      name: tr
      when: A Patricia
  - rule:
      text: A Patricia trie compresses long chains with no branching.
      when: compresses long chains
- id: cam
  stage: state
  pdf: 32
  c:
  - Content-Addressable Memory
  - TCAM
  say: The other answer is hardware. Ordinary memory takes an address and returns
    the content. Content-addressable memory does the reverse. Give it a key, and it
    compares against every entry at the same time. A plain CAM needs exact matches,
    which suits MAC tables. Prefixes have don't care bits. TCAM adds a third state,
    so a stored entry can say these bits must match, and these do not matter. Several
    entries can still match, so hardware priority must favor the longest prefix.
  moves:
  - clear: {}
  - table.show:
      name: tc
      zone: top
      cols:
      - TCAM entry (third byte)
      - Length
      - Output
      rows:
      - - 0000011*
        - /23
        - B
      - - 00000***
        - /21
        - A
      - - '********'
        - /0
        - C
  - text:
      name: key
      zone: bottom
      lines:
      - 'Key, third byte of 201.10.6.17: 00000110'
      when: Give it a key
  - table.flash:
      name: tc
      rows:
      - 0
      - 1
      - 2
      state: now
      when: at the same time
  - table.flash:
      name: tc
      rows:
      - 0
      - 1
      - 2
      state: null
      when: A plain CAM
  - table.flash:
      name: tc
      rows:
      - 0
      - 1
      - 2
      state: candidate
      when: Several entries
  - table.mark:
      name: tc
      r: 0
      state: done
      when: so hardware priority
  - rule:
      text: TCAM compares every entry at once. Priority must still favor the longest
        prefix.
- id: general
  stage: rule
  pdf: 11
  c:
  - Generalized Forwarding
  say: Once you can match bit patterns, why stop at the destination? Generalized forwarding
    matches on selected header fields and applies a configured action, such as forward,
    drop, or rewrite. That connects back to software-defined networking. Whether by
    prefix or by general match, the principle holds. Control installs the rules. The
    data plane applies them, one packet at a time.
  moves:
  - fade:
      names:
      - key
      - _rule
  - table.show:
      name: gf
      zone: bottom
      cols:
      - Match
      - Action
      rows:
      - - destination prefix
        - forward
      - - source and port
        - drop
      - - any selected fields
        - rewrite
      show: 0
  - table.reveal:
      name: gf
      n: 3
      when: Generalized forwarding
  - rule:
      text: Control installs the rules. The data plane applies them, one packet at
        a time.
      when: Control installs
- id: pitfall
  stage: rule
  pdf: 11
  c:
  - Generalized Forwarding
  say: The classic slip is stopping at the first match, or taking the lowest cost.
    In a table, order doesn't matter. In a trie, you keep walking, and remember the
    longest valid prefix so far.
  moves:
  - trap:
      wrong: Stop at the first matching route
      right: 'Keep looking: the longest match wins, wherever it''s listed'
- id: changed
  stage: changed_example
  pdf: 29
  c:
  - Longest Prefix Matching
  say: Add a route. An operator installs 201.10.6.16/28 going to a new output, D,
    and a metric says the slash 21 is an excellent path. Our first packet, 201.10.6.17,
    comes back through.
  moves:
