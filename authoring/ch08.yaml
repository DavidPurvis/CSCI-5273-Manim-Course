dish: '8.1'
title: Carving a subnet
deck: lec08-network2.pdf
target_min: 6
concepts:
- VLSM Subnetting
beats:
- id: question
  stage: question
  pdf: 3
  c:
  - VLSM Subnetting
  say: Our laptop's network got its addresses from somewhere. An organization holds
    one block, and four departments of very different sizes. How do you cut the block
    so that everyone fits, nothing overlaps, and routers can still describe each piece
    with a single prefix?
  moves:
  - heading:
      text: 'Lecture 8: carving a subnet'
  - spine:
      current: Forward
      zone: top
  - q:
      text: One block, four departments. How do you cut it?
      zone: bottom
- id: sizing
  stage: animation
  pdf: 5
  c:
  - VLSM Subnetting
  say: Start with size, not with addresses. A subnet with h host bits holds 2 to the
    h addresses. Two are reserved, for the network and the broadcast. So to hold H
    hosts, choose the smallest h where 2 to the h, minus 2, is at least H. The prefix
    length is then 32 minus h. Using different sizes inside one block is called variable
    length subnet masking.
  moves:
  - clear: {}
  - bullets:
      name: st
      zone: bottom
      show: 0
      items:
      - h host bits give 2^h addresses
      - 'Two are reserved: network and broadcast'
      - 'Different sizes in one block: variable length subnet masking'
  - reveal:
      name: st
      when: A subnet with
  - reveal:
      name: st
      when: Two are reserved
  - tex:
      name: size
      zone: top
      tex: 2^{h}-2 \ge H,\qquad p = 32-h
      size: 52
      when: So to hold
  - reveal:
      name: st
      when: Using different
- id: borrow
  stage: state
  pdf: 4
  c:
  - VLSM Subnetting
  say: 'To feel the trade, take one slash 24 and start borrowing host bits for subnets.
    Borrow 1 bit: 2 subnets, with 7 host bits left, so 126 hosts in each. Borrow 2
    bits: 4 subnets of 62 hosts. Borrow 3: 8 subnets of 30. Each borrowed bit doubles
    the number of subnets, and roughly halves their size. Keep going, and at 7 borrowed
    bits, only one host bit remains. The formula then gives zero ordinary hosts. A
    slash 31 needs its own point to point interpretation, so don''t apply the subtraction
    blindly there.'
  moves:
  - clear: {}
  - table.show:
      name: bor
      zone: top
      cols:
      - Borrowed bits
      - Subnets
      - Host bits
      - Hosts each
      rows:
      - - 1
        - 2
        - 7
        - 126
      - - 2
        - 4
        - 6
        - 62
      - - 3
        - 8
        - 5
        - 30
      - - 7
        - 128
        - 1
        - 0 by the formula
      show: 0
  - table.reveal:
      name: bor
      when: Borrow 1 bit
  - table.reveal:
      name: bor
      when: Borrow 2 bits
  - table.reveal:
      name: bor
      when: Borrow 3
  - rule:
      text: Each borrowed bit doubles the subnets and roughly halves their size.
      when: Each borrowed
  - table.reveal:
      name: bor
      when: Keep going
  - table.mark:
      name: bor
      r: 3
      state: error
      when: A slash 31
- id: endsystem
  stage: state
  pdf: 5
  c:
  - VLSM Subnetting
  say: Why does a host care about all this? Because the mask is how it makes its first
    decision. Before sending, it ANDs the destination with its own mask, and compares
    that with its own network. If they match, the destination is on this link, so
    it sends directly. If not, it sends to its gateway. Routers apply masks too, but
    to a whole table of prefixes, as we'll see in a moment.
  moves:
  - clear: {}
  - bullets:
      name: es
      zone: top
      show: 0
      items:
      - Destination AND my mask = my network?
      - 'Yes: send directly on this link'
      - 'No: send to the gateway'
  - reveal:
      name: es
      when: Before sending
  - reveal:
      name: es
      when: If they match
  - reveal:
      name: es
      when: If not
- id: parent
  stage: state
  pdf: 7
  c:
  - VLSM Subnetting
  clar:
  - parent-23
  say: The instructor's example. Four departments need 130, 120, 60, and 31 hosts,
    inside a slash 23. The slide labels the parent 128.101.5.0/23. Apply the mask,
    though. A slash 23 forces the last bit of the third byte to zero, and 5 is odd.
    So the true network is 128.101.4.0/23. It covers third byte values 4 and 5, and
    the slide's department blocks fit this normalized parent.
  moves:
  - fade:
      names: es
  - bits.show:
      name: par
      zone: bottom
      rows:
      - label: 'Printed: 128.101.5.0'
        value: 128.101.5.0
      - label: 'After the /23 mask: 128.101.4.0'
        value: 128.101.4.0
      when: Apply the mask
  - bits.draw_mask:
      name: par
      prefix: 23
  - bits.mark:
      name: par
      row: 0
      start: 22
      end: 23
      state: error
      when: and 5 is odd
  - card:
      kind: correction
      text: Printed 128.101.5.0/23 normalizes to 128.101.4.0/23.
      zone: top
      when: So the true
- id: largest
  stage: state
  pdf: 7
  c:
  - VLSM Subnetting
  say: Allocate the largest first, since that keeps the blocks aligned. Department
    A needs 130. 7 host bits give only 126, so it takes 8 bits, a slash 24, the first
    half of the parent. B needs 120, and 7 bits give 126. That is a slash 25, at 128.101.5.0.
    C needs 60. 6 bits give 62, so a slash 26. D needs 31. It is tempting to pick
    a slash 27, because 32 addresses seem like enough. But a slash 27 leaves only
    30 usable. So D also needs a slash 26.
  moves:
  - clear: {}
  - table.show:
      name: plan
      zone: top
      data: $subnet.plan_table
      show: 0
  - tl.show:
      name: blk
      zone: bottom
      tracks:
      - /23
      - Try
      span:
      - 0
      - 512
      ticks:
      - 0
      - 256
      - 384
      - 448
      - 512
  - table.reveal:
      name: plan
      when: Department A
  - tl.block:
      name: blk
      track: /23
      start: 0
      end: 256
      text: A /24
      kind: ip
  - table.reveal:
      name: plan
      when: B needs
  - tl.block:
      name: blk
      track: /23
      start: 256
      end: 384
      text: B /25
      kind: eth
  - table.reveal:
      name: plan
      when: C needs
  - tl.block:
      name: blk
      track: /23
      start: 384
      end: 448
      text: C
      kind: transport
  - table.reveal:
      name: plan
      when: D needs
  - table.mark:
      name: plan
      r: 3
      state: error
      when: It is tempting
  - table.mark:
      name: plan
      r: 3
      state: done
      when: So D also
  - tl.block:
      name: blk
      track: /23
      start: 448
      end: 512
      text: D
      kind: label
- id: bar
  stage: state
  pdf: 7
  c:
  - VLSM Subnetting
  say: See the blocks laid along the parent. 256 plus 128 plus 64 plus 64 is 512,
    and that fills the slash 23 exactly. Each block begins on a multiple of its own
    size, which is what lets a single prefix describe it.
  moves:
  - tex:
      name: tot
      zone: top
      tex: 256+128+64+64=512
      size: 48
      when: 256 plus
  - tl.ghost:
      name: blk
      track: Try
      start: 400
      end: 464
      text: at 400?
      when: Each block begins
  - tl.slide:
      name: blk
      start: 384
      end: 448
      text: at 384
      when: which is what
- id: rule
  stage: rule
  pdf: 7
  c:
  - VLSM Subnetting
  say: Check any allocation three separate ways. Does each subnet have enough usable
    hosts? Do any overlap? And is each one contained in the parent? A plausible looking
    dotted address proves none of those.
  moves:
  - clear: {}
  - bullets:
      name: ck
      zone: top
      show: 0
      items:
      - Enough usable hosts in each subnet?
      - No overlaps?
      - Contained in the parent?
  - reveal:
      name: ck
      when: Does each subnet
  - reveal:
      name: ck
      when: Do any overlap
  - reveal:
      name: ck
      when: And is each
  - rule:
      text: 'Check three things: enough usable hosts, no overlap, contained in the
        parent.'
      when: A plausible
- id: pitfall
  stage: rule
  pdf: 7
  c:
  - VLSM Subnetting
  say: 'The mistake that looks harmless: placing a block wherever there''s room. A
    block must begin on a multiple of its own size. Otherwise, no single prefix can
    describe it.'
  moves:
  - trap:
      wrong: A block can start anywhere it fits
      right: A block must start on a multiple of its own size
- id: changed
  stage: changed_example
  pdf: 5
  c:
  - VLSM Subnetting
  say: Change one requirement. Department C's count of 60 did not include its router
    interface or its printers. The real requirement is 63 interfaces.
  moves:
  - clear: {}
  - q:
      text: Department C now needs 63 interfaces, not 60.
      zone: top
- id: predict
  stage: prediction
  pdf: 5
  hold: 12
  c:
  - VLSM Subnetting
  say: What prefix does C need now? And does the whole plan still fit in the slash
    23?
  moves:
  - pause:
      text: C's new prefix? does everything still fit?
      long: true
- id: answer
  stage: explanation
  pdf: 5
  c:
  - VLSM Subnetting
  say: '6 bits give only 62 usable, so C jumps to 7 bits, a slash 25, with 128 addresses.
    Add that up: 256, plus 128, plus 128, plus 64, is 576. That is more than 512,
    so the plan no longer fits. A single extra host at a boundary doubled the block,
    which is why you must state exactly what the count includes. The result is a table
    of overlapping prefixes on every router, so how does a router choose among them?'
  moves:
  - tl.show:
      name: over
      zone: bottom
      tracks:
      - /23
      span:
      - 0
      - 576
      ticks:
      - 0
      - 256
      - 384
      - 512
      - 576
  - tl.block:
      name: over
      track: /23
      start: 0
      end: 256
      text: A /24
      kind: ip
      when: Add that up
      t: 0.5
  - tl.block:
      name: over
      track: /23
      start: 256
      end: 384
      text: B /25
      kind: eth
      t: 0.5
  - tl.block:
      name: over
      track: /23
      start: 384
      end: 512
      text: C /25
      kind: transport
      t: 0.5
  - tl.block:
      name: over
      track: /23
      start: 512
      end: 576
      text: D
      state: error
      when: That is more
  - rule:
      text: One host past a boundary doubles the block. State what the count includes.
      when: A single extra
  - clear:
      when: The result is
  - q:
      text: Overlapping prefixes on every router. How does it choose?
prediction_contracts:
- prediction_beat: 8.1.predict
