beats:
- id: question
  stage: question
  pdf: 9
  c:
  - Router Architecture
  say: A router has found the right output. Now a packet must physically cross the
    machine, while packets arrive on every other port too. Where can this go wrong?
    When a router is slow, which part is actually the bottleneck?
  moves:
  - heading:
      text: 'Lecture 8: inside a router'
  - q:
      text: When a router is slow, which part is the bottleneck?
  - keep: {}
- id: parts
  stage: animation
  pdf: 9
  c:
  - Router Architecture
  say: 'A router has four main parts. Input ports receive the bits, check the link
    layer, and do the lookup. A switching fabric moves packets between ports. Output
    ports buffer and transmit them. And a routing processor runs the control plane,
    computing the tables that input ports use. Follow our packet: in, lookup, across,
    queue, out.'
  moves:
  - clear: {}
  - net.show:
      name: rtr
      zone: full
      nodes:
        I:
          k: box
          at:
          - 0
          - 0
          l: Input port
        F:
          k: box
          at:
          - 4
          - 0
          l: Fabric
        O:
          k: box
          at:
          - 8
          - 0
          l: Output port
        C:
          k: box
          at:
          - 4
          - 2
          l: Routing processor
      links:
      - - I
        - F
      - - F
        - O
      - - C
        - I
        - s: control
  - net.state:
      name: rtr
      nodes:
        I: now
      when: Input ports
  - net.state:
      name: rtr
      nodes:
        I: null
        F: now
      when: A switching fabric
  - net.state:
      name: rtr
      nodes:
        F: null
        O: now
      when: Output ports
  - net.state:
      name: rtr
      nodes:
        O: null
        C: now
      when: And a routing
  - net.state:
      name: rtr
      nodes:
        C: null
  - packet.spawn:
      name: p
      net: rtr
      at: I
      layers:
      - eth
      - ip
      when: Follow our packet
  - packet.hop:
      name: p
      to:
      - F
      - O
      t: 2
- id: fabrics
  stage: state
  pdf: 19
  c:
  - Router Architecture
  say: The fabric's capacity is the first limit. With 4 inputs, each at 10 gigabits
    per second, up to 40 gigabits per second may be offered. A fabric that cannot
    move that much makes inputs wait, even when every output is free. There are three
    classic designs.
  moves:
  - clear: {}
  - tex:
      name: cap
      zone: top
      tex: N\times R = 4\times 10\,\text{Gb/s}=40\,\text{Gb/s offered}
      size: 44
      when: With 4 inputs
  - rule:
      text: "If the fabric cannot carry N \xD7 R, inputs wait even when outputs are\
        \ free."
      when: A fabric that
- id: memory
  stage: animation
  pdf: 20
  c:
  - Memory Switching
  say: The oldest design is memory switching. The packet is copied into shared memory,
    and then copied out again. Each packet crosses memory twice, so memory bandwidth
    must be double the useful throughput.
  moves:
  - fade:
      names: _rule
  - net.show:
      name: mem
      zone: bottom
      nodes:
        I:
          k: box
          at:
          - 0
          - 0
          l: Input
        M:
          k: box
          at:
          - 4
          - 0
          l: Shared memory
        O:
          k: box
          at:
          - 8
          - 0
          l: Output
      links:
      - - I
        - M
        - c: copy in
      - - M
        - O
        - c: copy out
  - packet.spawn:
      name: mp
      net: mem
      at: I
      layers:
      - ip
  - packet.hop:
      name: mp
      to: M
      when: The packet is copied
  - packet.hop:
      name: mp
      to: O
      when: and then copied
  - packet.fade:
      name: mp
  - net.state:
      name: mem
      nodes:
        M: now
      when: so memory bandwidth
- id: memory-more
  stage: state
  pdf: 20
  c:
  - Memory Switching
  say: Put a number on it. If a memory system can sustain 20 gigabits per second of
    copying, each forwarded bit is copied twice, so the router tops out near 10 gigabits
    per second, before any other overhead.
  moves:
  - tex:
      name: mm
      zone: top
      tex: 20\ \text{Gb/s of copying}\div 2 = 10\ \text{Gb/s forwarded}
      size: 42
      when: Put a number
  - net.pulse:
