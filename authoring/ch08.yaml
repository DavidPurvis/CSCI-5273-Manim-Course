      - M
      - O
      when: each forwarded bit
- id: bus
  stage: animation
  pdf: 21
  c:
  - Bus Switching
  say: Next is a shared bus. A packet crosses directly from input to output, over
    one internal bus. That avoids the double copy. But only one packet can use the
    bus at a time, so the bus speed caps the entire router.
  moves:
