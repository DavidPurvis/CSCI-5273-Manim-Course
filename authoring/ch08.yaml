- id: bus-more
  stage: state
  pdf: 21
  c:
  - Bus Switching
  say: Again, a number. Four 10 gigabit inputs feed a 20 gigabit bus. They offer 40
    gigabits per second, and only 20 can cross, even if every output link sits idle.
    The bus is the bottleneck, before the outputs are even considered.
  moves:
  - tex:
      name: bb
      zone: top
      tex: 4\times 10=40\ \text{Gb/s offered},\quad 20\ \text{Gb/s bus}
      size: 42
