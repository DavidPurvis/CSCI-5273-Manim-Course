dish: '18.4'
title: The slide clarifications
deck: lec06-lan.pdf
target_min: 2.5
beats:
- id: open
  stage: question
  pdf: 30
  say: Finally, the places where the slides need a careful reading. These are the corrections and scope
    notes we met along the way. No new material. For each one, keep the corrected version in mind.
  moves:
  - heading:
      text: 'Exam warm-up: the slide clarifications'
  - q:
      text: Where do the slides need a careful reading?
- id: lan
  stage: state
  pdf: 30
  say: On LANs. The slide's table TTL is a local aging timer in the switch, not a hop count in the frame.
    And spanning tree, shortest-path trees, and minimum spanning trees have different objectives.
  moves:
  - clear: {}
  - bullets:
      name: a
      zone: full
      show: 0
      items:
      - 'Switch-table TTL: a local aging timer, not a hop count'
      - STP, shortest-path trees, and MSTs have different objectives
  - reveal:
      name: a
      when: The slide's table
  - reveal:
      name: a
      when: And spanning
- id: ip
  stage: state
  pdf: 35
  say: On IP. The maximum IPv4 total length is 65,535 bytes, not the 63,535 printed on the slide, because
    the field has 16 bits. In the subnet example, 128.101.5.0/23 normalizes to 128.101.4.0/23, and the
    31-host department needs a slash 26. And the 51.2 nanosecond budget leaves out Ethernet's physical
    overhead.
  deck: lec07-network1.pdf
  moves:
  - clear: {}
  - bullets:
      name: a
      zone: full
      show: 0
      items:
      - 'IPv4 maximum: 65,535 bytes, not 63,535'
      - 128.101.5.0/23 normalizes to 128.101.4.0/23; 31 hosts need /26
      - '51.2 ns omits physical overhead: a budget illustration'
  - reveal:
      name: a
      when: The maximum IPv4
  - reveal:
      name: a
      when: In the subnet
  - reveal:
      name: a
      when: And the 51.2
  - keep: {}
  pre_roll: 0.2
- id: dns
  stage: state
  pdf: 31
  say: On discovery. DNS has 13 root identities, A through M, and each is deployed as many physical instances.
    And the slide's quick TCP recap leaves out the final ACK of the handshake.
  deck: lec09-discovery.pdf
  moves:
  - clear: {}
  - bullets:
      name: a
      zone: full
      show: 0
      items:
      - '13 DNS roots: identities A to M, many physical instances'
      - The TCP recap omits the handshake's final ACK
  - reveal:
      name: a
      when: DNS has
  - reveal:
      name: a
      when: And the slide's
  pre_roll: 0.7
- id: mc
  stage: state
  pdf: 14
  say: On anycast and multicast. Anycast's problem with TCP is lost connection state, not a blanket incompatibility.
    IGMP queries go to all hosts, while a report goes to the group being reported. The slide's membership
    timer computes 270 seconds, while the RFC's default formula gives 260. And sparse mode begins with
    a shared tree through the RP, whatever the slide's shorthand says.
  deck: lec13-multicast.pdf
  moves:
  - clear: {}
  - bullets:
      name: a
      zone: full
      show: 0
      items:
      - 'Anycast and TCP: the issue is lost connection state'
      - 'IGMP: queries to all hosts, reports to the group'
      - 'Membership timer: 270 s on the slide, 260 s by RFC formula'
      - Sparse mode begins with a shared (*,G) tree
  - reveal:
      name: a
      when: Anycast's problem
  - reveal:
      name: a
      when: IGMP queries
  - reveal:
      name: a
      when: The slide's membership
  - reveal:
      name: a
      when: And sparse
- id: radio
  stage: state
  pdf: 32
  say: On wireless and mobility. Four-address Wi-Fi is a bridging case, not an ad hoc rule. The exposed-terminal
    shortcut is idealized. IMSI is a decimal subscriber identity of at most 15 digits, not a MAC address.
    And the foreign-agent drawing is one Mobile IPv4 arrangement, separate from LTE.
  deck: lec14-wireless.pdf
  moves:
  - clear: {}
  - bullets:
      name: a
      zone: full
      show: 0
      items:
      - 'Four-address Wi-Fi: a bridging case'
      - 'Exposed-terminal shortcut: idealized'
      - 'IMSI: decimal subscriber identity, not a MAC address'
      - 'Foreign agent: one Mobile IPv4 arrangement, not LTE'
  - reveal:
      name: a
      when: Four-address
  - reveal:
      name: a
      when: The exposed-terminal
  - reveal:
      name: a
      when: IMSI is
  - reveal:
      name: a
      when: And the foreign
- id: close
  stage: explanation
  pdf: 32
  say: One last thing. A correct answer you can't defend is still a gap, and a mistake you can name is
    one you won't repeat. Good luck today. You've traced this packet from one wire to a moving phone.
    Go show them.
  deck: lec14-wireless.pdf
  moves:
  - clear: {}
  - spine:
      current: Move
      zone: top
