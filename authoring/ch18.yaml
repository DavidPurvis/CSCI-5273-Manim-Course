dish: '18.1'
title: The packet story, from memory
deck: lec09-discovery.pdf
target_min: 5
beats:
- id: open
  stage: question
  pdf: 49
  say: It's Wednesday. Don't reread anything. Get a blank page, and draw the connected packet story from
    memory, one question at a time. I'll ask, you draw, and then I'll show you the answer. A laptop wakes
    up, and wants to reach a web server. Start at the very beginning. What does it need before it can
    send anything?
  moves:
  - heading:
      text: 'Exam warm-up: the packet story'
  - spine:
      current: LAN
      zone: top
  - q:
      text: What does a waking laptop need before it can send anything?
      zone: bottom
- id: p1
  stage: prediction
  pdf: 49
  hold: 12
  say: Draw the host, the switch, the gateway, the DNS resolver, and the server. Then name what's missing.
  moves:
  - pause:
      text: draw the devices, and name the missing facts
- id: a1
  stage: explanation
  pdf: 22
  c:
  - DHCP
  say: 'It needs an address, a mask, a gateway, and a resolver. DHCP supplies all four, in four messages:
    Discover, Offer, Request, ACK.'
  moves:
  - clear: {}
  - net.show:
      name: n
      zone: story_upper
      nodes:
        L:
          k: laptop
          at:
          - 0
          - 0
          l: Laptop
        S:
          k: switch
          at:
          - 2.6
          - 0
          l: Switch
        R:
          k: router
          at:
          - 5.2
          - 0
          l: Gateway
        D:
          k: server
          at:
          - 5.2
          - 2.2
          l: DNS resolver
          lp: right
        Q:
          k: router
          at:
          - 8
          - 0
          l: Next router
          lp: up
        W:
          k: server
          at:
          - 11
          - 0
          l: Web server
      links:
      - - L
        - S
      - - S
        - R
      - - R
        - D
      - - R
        - Q
      - - Q
        - W
  - table.show:
      name: t
      zone: story_lower
      cols:
      - Missing fact
      - Mechanism
      rows: &id001
      - - Address, mask, gateway, resolver
        - DHCP
      show: 0
  - table.reveal:
      name: t
      when: DHCP supplies
  - msg.send:
      name: n
      a: L
      b: R
      text: 'DHCP: 4 messages'
      when: in four messages
      t: 1.2
- id: p2
  stage: prediction
  pdf: 54
  hold: 10
  say: The laptop wants the server's name resolved, and the resolver is on another network. What does
    it send first, and to whom?
  moves:
  - pause:
      text: what goes out first, and to whom?
- id: a2
  stage: explanation
  pdf: 54
  c:
  - ARP
  say: Its mask says the resolver is remote, so the first thing out is an ARP for the gateway. Then the
    DNS query leaves, with the gateway's MAC on the frame, and the resolver's address in the packet. The
    frame crosses one link. The packet crosses the network.
  moves:
  - msg.send:
      name: n
      a: L
      b: R
      text: 'ARP: gateway?'
      when: so the first
      t: 1.1
  - packet.spawn:
      name: p
      net: n
      at: L
      layers:
      - eth
      - ip
      when: Then the DNS
  - packet.hop:
      name: p
      to:
      - S
      - R
      t: 1.1
  - packet.swap_link_header:
      name: p
  - packet.hop:
      name: p
      to: D
      t: 0.7
  - packet.fade:
      name: p
  - rule:
      text: A frame crosses one link. A packet crosses the network.
      when: The frame crosses
- id: p3
  stage: prediction
  pdf: 33
  hold: 10
  say: The switch along the way had an empty table. What did it just learn, and what did it do with the
    frame?
  moves:
  - pause:
      text: what did the switch learn, and do?
- id: a3
  stage: explanation
  pdf: 31
  c:
  - Self-Learning Switch Tables
  say: It learned the laptop's port from the source address. If the destination was unknown, it flooded.
    Once known, it forwards out one port. Source teaches. Destination decides.
  deck: lec06-lan.pdf
  moves:
  - net.state:
      name: n
      nodes:
        S: now
      when: It learned
  - table.show:
      name: t
      zone: story_lower
      cols:
      - Missing fact
      - Mechanism
      rows: &id002
      - - Which port for a MAC
        - Switch learning
  - fade:
      names: _rule
  - rule:
      text: Source teaches. Destination decides.
      when: Source teaches
- id: p4
  stage: prediction
  pdf: 13
  hold: 10
  say: The packet reaches the gateway, headed for the server. What does the router look at, and what changes
    in the packet?
  moves:
  - net.state:
      name: n
      nodes:
        S: null
  - pause:
      text: what does the router read, and what changes?
- id: a4
  stage: explanation
  pdf: 13
  c:
  - Longest Prefix Matching
  say: It reads the destination IP, and picks the longest matching prefix. It replaces the Ethernet frame,
    and decrements TTL. The source and destination IP addresses stay put.
  deck: lec08-network2.pdf
  moves:
  - table.show:
      name: t
      zone: story_lower
      cols:
      - Missing fact
      - Mechanism
      rows: &id003
      - - Which output for a prefix
        - Longest prefix match
  - fade:
      names: _rule
  - packet.spawn:
      name: p
      net: n
      at: R
      layers:
      - eth
      - ip
      when: It reads
  - packet.swap_link_header:
      name: p
      when: It replaces
  - packet.hop:
      name: p
      to:
      - Q
      - W
      t: 1.4
  - packet.fade:
      name: p
  pre_roll: 1.5
- id: p5
  stage: prediction
  pdf: 19
  hold: 10
  say: Where did that forwarding table come from, inside one network, and between networks?
  moves:
  - pause:
      text: who builds the table, inside and between networks?
- id: a5
  stage: explanation
  pdf: 37
  c:
  - Link-State Routing
  - Distance-Vector Routing
  say: Inside one AS, link state floods facts and runs Dijkstra, or distance vector trades distances with
    neighbors. Between ASes, BGP carries paths, shaped by policy and money. The chosen BGP next hop is
    resolved through internal routing.
  deck: lec10-routing.pdf
  moves:
  - table.show:
      name: t
      zone: story_lower
      cols:
      - Scope
      - Mechanism
      rows: &id004
      - - Inside an AS
        - link state or distance vector
      - - Between ASes
        - BGP with policy
      show: 0
  - table.reveal:
      name: t
      when: Inside one AS
  - table.reveal:
      name: t
      when: Between ASes
  - net.walk:
      name: n
      path:
      - R
      - Q
      - W
      state: done
      when: The chosen
  pre_roll: 1.0
- id: p6
  stage: prediction
  pdf: 8
  hold: 10
  say: A link fails between the two routers. What goes wrong while the news spreads? Name two failure
    shapes.
  moves:
  - pause:
      text: name two things that go wrong during convergence
- id: a6
  stage: explanation
  pdf: 8
  c:
  - Forwarding Blackholes
  - Transient Forwarding Loops
  say: A blackhole, when a router holds an old route with no working continuation. And a transient loop,
    when routers install their changes at different times. Detect, disseminate, compute, install. Each
    stage takes time.
  deck: lec11-convergence.pdf
  moves:
  - net.unwalk:
      name: n
  - net.state:
      name: n
      links:
      - - R
        - Q
        - failed
      when: A blackhole
  - table.show:
      name: t
      zone: story_lower
      cols:
      - Shape
      - Cause
      rows: &id005
      - - Blackhole
        - old route, no way on
      - - Transient loop
        - installs at different times
      show: 0
  - table.reveal:
      name: t
  - table.reveal:
      name: t
      when: And a transient
  - rule:
      text: Detect, disseminate, compute, install.
      when: Detect, disseminate
  pre_roll: 0.5
- id: p7
  stage: prediction
  pdf: 39
  hold: 10
  say: Last one. The laptop leaves its wire and becomes a moving phone. What stays the same in the packet,
    and what changes?
  moves:
  - net.state:
      name: n
      links:
      - - R
        - Q
        - solid
  - pause:
      text: what stays the same, and what changes?
- id: a7
  stage: explanation
  pdf: 38
  c:
  - Cellular Handover
  - IP Tunneling
  say: 'The inner packet stays the same, with its stable address. The outer destination changes, as a
    tunnel follows the phone. That''s the picture from the very start, at a new scale: a local envelope,
    changing, around a global packet that isn''t. If you could draw all of that, you have the story.'
  deck: lec15-mobile.pdf
  moves:
  - clear: {}
  - stack.show:
      name: st
      zone: top
      layers:
      - t: 'Outer destination: changes as the phone moves'
        k: tunnel
      - t: 'Inner packet: stays the same'
        k: ip
  - stack.mark:
      name: st
      layer: 1
      state: done
      when: The inner packet
  - stack.mark:
      name: st
      layer: 0
      state: now
      when: The outer destination
  - rule:
      text: A local envelope changes, around a global packet that doesn't.
      when: That's the picture
  pre_roll: 1.6
