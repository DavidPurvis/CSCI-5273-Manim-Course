dish: '18.2'
title: One mask, one match, one fragment
deck: lec07-network1.pdf
target_min: 3.5
beats:
- id: open
  stage: question
  pdf: 23
  c:
  - Subnet Masks
  say: A quick recompute, with new numbers, on your own paper. First, a mask. A host has address 192.168.37.200/21.
    Give the mask, the network, the broadcast address, and the usable count.
  moves:
  - heading:
      text: 'Exam warm-up: mask, match, fragment'
  - q:
      text: '192.168.37.200/21: mask, network, broadcast, usable count?'
- id: p1
  stage: prediction
  pdf: 23
  hold: 15
  say: Do it from a blank page.
  moves:
  - pause:
      text: mask, network, broadcast, and usable count
- id: a1
  stage: explanation
  pdf: 23
  c:
  - Network and Broadcast Addresses
  say: A slash 21 is 255.255.248.0. Third-byte blocks have size 8, and 37 lies in 32 through 39. So the
    network is 192.168.32.0, and the broadcast is 192.168.39.255. That's 11 host bits, so 2 to the 11th,
    minus 2, gives 2,046 usable addresses.
  moves:
  - clear: {}
  - bits.show:
      name: d
      zone: full
      rows: &id001
      - label: Address 192.168.37.200
        value: $practice.warm.address
      - label: Mask 255.255.248.0
        value: $practice.warm.mask
      reserve: 4
  - bits.draw_mask:
      name: d
      prefix: 21
      when: A slash 21
  - bits.scan:
      name: d
      label: Network 192.168.32.0
      value: $practice.warm.network
      when: So the network
  - bits.scan:
      name: d
      label: Broadcast 192.168.39.255
      value: $practice.warm.broadcast
      when: and the broadcast
  - rule:
      text: 2^11 − 2 = 2046 usable addresses
      when: That's 11
  pre_roll: 1.7000000000000002
- id: q2
  stage: question
  pdf: 13
  c:
  - Longest Prefix Matching
  say: A match. A router holds 192.168.0.0/16 to A, 192.168.32.0/21 to B, 192.168.36.0/24 to C, and slash
    0 to D. Which output does that same address, 192.168.37.200, use?
  deck: lec08-network2.pdf
  moves:
  - clear: {}
  - table.show:
      name: rt
      zone: left_top
      data: $practice.warm_routes
- id: p2
  stage: prediction
  pdf: 13
  hold: 10
  say: Check each prefix, then choose.
  moves:
  - pause:
      text: which output, and why?
- id: a2
  stage: explanation
  pdf: 29
  c:
  - Longest Prefix Matching
  say: 'It matches the slash 16, the slash 21, and the slash 0. It doesn''t match the slash 24, because
    that covers only third byte 36. So the longest match is the slash 21: output B.'
  deck: lec08-network2.pdf
  moves:
  - table.flash:
      name: rt
      rows: &id002
      - 0
      - 1
      - 3
      state: candidate
      when: It matches
  - table.mark:
      name: rt
      r: 2
      state: error
      when: It doesn't match
  - table.flash:
      name: rt
      rows: &id003
      - 0
      - 3
      state: null
      when: So the longest
  - table.mark:
      name: rt
      r: 1
      state: done
- id: q3
  stage: question
  pdf: 36
  c:
  - IPv4 Fragmentation
  say: Finally, a fragment. An 1,800 byte datagram, with a 20 byte header, crosses an MTU of 600. Give
    the largest nonfinal payload, the fragment count, and the offsets.
  moves:
  - clear: {}
  - bar.show:
      name: b
      zone: full
      total: 1800
      header: 20
      rows: 4
- id: p3
  stage: prediction
  pdf: 37
  hold: 15
  say: Round down to a multiple of 8.
  moves:
  - pause:
      text: the largest payload, the count, and the offsets
- id: a3
  stage: explanation
  pdf: 37
  c:
  - IPv4 Fragmentation
  say: '600 minus 20 is 580, and 580 rounds down to 576. The data is 1,780 bytes, so the payloads are
    576, 576, 576, and 52. That''s four fragments. The offsets go up in steps of 72: 0, 72, 144, and 216.
    Only the last has its more fragments flag at 0.'
  moves:
  - bar.ruler:
      name: b
  - bar.zoom:
      name: b
      at: 580
      state: error
      when: 600 minus 20
  - bar.snap:
      name: b
      at: 576
      when: and 580 rounds
  - bar.slice:
      name: b
      i: 0
      frag: $practice.warm_frags.0
      info: false
      when: The data is
      t: 0.7
  - bar.slice:
      name: b
      i: 1
      frag: $practice.warm_frags.1
      info: false
      t: 0.7
  - bar.slice:
      name: b
      i: 2
      frag: $practice.warm_frags.2
      info: false
      t: 0.7
  - bar.slice:
      name: b
      i: 3
      frag: $practice.warm_frags.3
      info: false
      t: 0.7
  - bar.info:
      name: b
      i: 0
      frag: $practice.warm_frags.0
      when: The offsets go
      t: 0.4
  - bar.info:
      name: b
      i: 1
      frag: $practice.warm_frags.1
      t: 0.4
  - bar.info:
      name: b
      i: 2
      frag: $practice.warm_frags.2
      t: 0.4
  - bar.info:
      name: b
      i: 3
      frag: $practice.warm_frags.3
      t: 0.4
  pre_roll: 1.0
