      - R2
      - R3
  - rule:
      text: Signaling sets up state along the chosen path
      when:
        phrase: Before any data
        frame_offset: 50
  - card:
      kind: clarification
      text: For MPLS traffic engineering the specific extension is RSVP-TE.
      zone: bottom
      when: The lecture names
  - rule:
      text: An explicit path can steer traffic onto spare capacity
      when: Because the path
- id: te
  stage: state
  pdf: 55
  c:
  - MPLS Label Switching
  say: See what that buys. With ordinary IP, two packets for the same destination
    take the same route from any given router, because they match the same prefix.
    With labels, an ingress router can place them on different prepared paths. The
    original motive for MPLS included faster lookup. Today, traffic engineering is
    the bigger reason.
  moves:
  - clear:
      keep:
      - m
  - rule:
      text: 'Plain IP: same prefix, same route'
      when: With ordinary IP
  - fade:
      names: _rule
      when: With labels
  - card:
      kind: note
      text: 'Same destination, different prepared paths: that''s traffic engineering.'
      zone: bottom
      when:
        phrase: With labels
        frame_offset: 17
  - rule:
      text: Original motive included faster lookup
      when: The original motive
  - rule:
      text: 'Today: traffic engineering is the bigger reason'
      when: Today
- id: rule
  stage: rule
  pdf: 54
  c:
  - MPLS Label Switching
  say: Remember what a label path is, and what it is not. It's prepared forwarding
    state. It doesn't by itself reserve bandwidth, and it doesn't make delivery reliable.
    Something must still decide what state to install, and that's the control plane
    again.
  moves:
  - rule:
      text: 'A label path is prepared forwarding state: not a reservation, and not
        reliable delivery.'
  - rule:
      text: It doesn't reserve bandwidth or make delivery reliable
      when: It doesn't by itself
  - rule:
      text: The control plane decides what state to install
      when: Something must
- id: laptop
  stage: rule
  pdf: 54
  c:
  - MPLS Label Switching
  say: Back to our laptop's packet. At every router on the way to the server, it now
    finds a table entry, built from a shared map, from neighbors' distances, or from
    paths. Where MPLS is in use, it may even carry a label for part of the way. The
    packet itself never knew any of this happened.
  moves:
  - rule:
      text: 'Maps, distances, paths, and labels: the packet never knew.'
      when: Back to our
  - rule:
      text: Entries come from a map, distances or paths
      when: built from a shared
  - rule:
      text: With MPLS, maybe a label for part of the way
      when: Where MPLS
  - rule:
      text: The packet itself never knew
      when: The packet itself
- id: pitfall
  stage: rule
  pdf: 54
  c:
  - MPLS Label Switching
  say: A label alone doesn't reserve anything. It's just how a router finds the next
    step. Reserving capacity takes signaling, and not every MPLS deployment uses it.
