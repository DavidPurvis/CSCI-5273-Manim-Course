- id: idea
  stage: rule
  pdf: 22
  c:
  - Dijkstra Algorithm
  say: 'Dijkstra''s algorithm grows a region of settled nodes, whose best distances
    are final. It keeps a tentative distance for every other node. Then it repeats
    one step. Pick the unsettled node with the smallest tentative distance, and settle
    it. Next, relax its edges: for each neighbor v, ask whether going through this
    node beats the best distance we had. Why is it safe to settle that smallest node?
    Because weights are not negative, so any other route to it would have to leave
    through a node that is already at least as far. No detour could ever come back
    cheaper.'
  moves:
  - clear: {}
  - net.show:
      name: g
      zone: left
      nodes:
        A:
          k: node
          at:
          - 0
          - 1
          l: A
        B:
          k: node
          at:
          - 3
          - 2.2
          l: B
        C:
          k: node
          at:
          - 3
          - -0.2
          l: C
        D:
          k: node
          at:
          - 6
          - 1
          l: D
      links:
      - - A
        - B
        - c: 2
      - - A
        - C
        - c: 5
      - - B
        - C
        - c: 1
      - - B
        - D
        - c: 4
      - - C
        - D
        - c: 2
  - net.state:
      name: g
      nodes:
        A: done
      when: grows a region
  - net.state:
      name: g
      nodes:
        B: candidate
        C: candidate
        D: candidate
      when: It keeps a tentative
  - text:
      name: key
      zone: right_top
      lines:
      - 'Green: settled, distance is final'
      - 'Dashed: tentative, may still improve'
  - graph.promote:
      name: g
      node: B
      via: A
      when: Pick the unsettled
  - net.pulse:
      name: g
      path:
      - B
      - C
      when: for each neighbor
  - net.pulse:
      name: g
      path:
      - B
      - D
  - rule:
      text: Settle the smallest tentative distance. Then relax its edges. Weights
        must not be negative.
      when: Why is it safe
  pre_roll: 0.9
