- Path-Vector Routing
beats:
- id: question
  stage: question
  pdf: 47
  c:
  - Path-Vector Routing
  say: Between organizations, neither method fits. Would your company publish its
    internal map to its competitors, as link state needs? Would it accept a single
    cost number from them, whose meaning it can't check? Networks run by different
    owners need something else.
  moves:
  - heading:
      text: 'Lecture 10: path vector'
  - q:
      text: Would a network share its map, or trust a rival's number?
- id: limits
  stage: animation
  pdf: 48
  c:
  - Path-Vector Routing
  say: Consider why each one breaks down. Link state floods topology, which reveals
    private structure, and it requires a common metric. Distance vector hides the
    structure, so it's on the right track. But one bare number has two problems. Different
    networks measure cost differently, so the numbers aren't comparable. And the number
    hides the route, so nobody can apply a preference such as, avoid that competitor.
  moves:
  - clear: {}
  - table.show:
      name: lim
      zone: top
      cols:
      - Method
      - Problem between organizations
      rows:
