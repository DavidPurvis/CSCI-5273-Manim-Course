- id: question
  stage: question
  pdf: 19
  c:
  - Shortest-Path Routing
  say: We ended the last chapter with a cut link, and a router whose table had gone
    wrong. So who fills in that table? A router forwards a packet using a table it
    reads in nanoseconds. But something has to build that table, and rebuild it when
    the network changes. An administrator cannot type routes into thousands of routers
    by hand. So how can routers, talking only to each other, work out good paths through
    a network none of them can see all at once?
  moves:
  - heading:
      text: 'Lecture 10: Dijkstra'
  - spine:
      current: Route
      zone: top
  - q:
      text: How do routers work out paths through a network none of them fully sees?
      zone: bottom
