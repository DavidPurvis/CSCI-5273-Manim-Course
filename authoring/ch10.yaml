- id: swap
  stage: state
  pdf: 56
  c:
  - MPLS Label Switching
  say: 'Labels only have local meaning. Label 17 reaches R2, whose table says: incoming
    17, swap to 42, and send on this interface. Then R3 sees 42, and its table says
    to pop. Each router picks its own numbers, so the label changes at each hop while
