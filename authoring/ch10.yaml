- id: answer
  stage: explanation
  pdf: 36
  c:
  - Dijkstra Algorithm
  - Link-State Routing
  say: Settle B at 2. Through B, C would now cost 8, which doesn't beat the direct
    5. D becomes 6 through B. Then settle C at 5. Through C, D would cost 7, which
    doesn't beat 6. So the distances are 2, 5, and 6. A's first hop to B is B, to
    C is C itself, and to D is B. One number changed, and A's route to C changed completely.
    But before A could install this, the new cost had to reach it. Flooding carries
    the whole map to everyone. What if routers shared something much smaller instead?
