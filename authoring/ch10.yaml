- id: round3
  stage: state
  pdf: 44
  c:
  - Bellman-Ford Updates
  - Distance-Vector Routing
  say: Here's the subtle step. During round two, B also heard from C, and learned
    it can reach D for 1 plus 2, which is 3. In round three, B advertises that better
    number. A computes 2 plus 3, which is 5, through B. It has discovered the path
    A, B, C, D, without ever knowing that C was involved. The next round changes nothing,
    so it has converged, on the same answers Dijkstra gave.
  moves:
  - msg.send:
      name: g
      a: C
      b: B
