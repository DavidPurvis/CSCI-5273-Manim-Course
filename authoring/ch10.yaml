- id: answer
  stage: explanation
  pdf: 56
  c:
  - MPLS Label Switching
  say: Reuse isn't automatically a conflict, because labels are local, and each entry's
    scope is defined by its table. Different routers routinely reuse the same number.
    A label with no matching state has no installed instruction, so it has no valid
    forwarding action. State has to exist before it can be used. And that raises this
    chapter's biggest question. We've treated every table as correct and complete.
    What really happens in the seconds after a link fails?
