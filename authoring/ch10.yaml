      to: W
- id: signal
  stage: state
  pdf: 53
  c:
  - RSVP Signaling
  clar:
  - rsvp-te
  say: Who installed those table entries? Signaling. Before any data flows, messages
    travel along the chosen path, setting up state at each router. The lecture names
    RSVP, and for MPLS traffic engineering, the specific extension is RSVP-TE. Because
    the path is explicit, an operator can steer some traffic away from the shortest
    route, onto spare capacity. That is traffic engineering.
  moves:
  - clear:
      keep:
      - m
  - packet.spawn:
      name: sg
      net: m
      at: R1
