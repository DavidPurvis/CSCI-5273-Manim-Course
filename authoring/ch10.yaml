- id: routing-forwarding
  stage: animation
  pdf: 12
  say: 'Start by separating two words. Forwarding is what a router does to one packet,
    right now: read the address, look it up, and send it out. Routing is how the table
    got there in the first place, a network-wide process of exchanging information
    and computing paths. And a route to a far prefix needs two pieces of knowledge.
    Which router, or exit, can reach that prefix? And how do I reach that router from
    here? This lecture solves the second piece. BGP will supply the first. Could you
    just type all this in by hand? Static routes don''t adapt to failures, new equipment,
    or load.'
