      when: Different networks
  - rule:
      text: The number hides the route, so no preferences
      when: And the number hides
- id: fix
  stage: state
  pdf: 50
  c:
  - Path-Vector Routing
  say: The fix is to advertise the whole path. Instead of saying, I'm 3 away, a network
    says, I can reach it through networks 3, 2, 1. Each network that passes this along
    adds its own identifier at the front. This is path-vector routing, and it's the
    basis of BGP.
  moves:
