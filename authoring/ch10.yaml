- id: firsthop
  stage: rule
  pdf: 36
  c:
  - Dijkstra Algorithm
  say: 'The part that catches people out. The computation gave us predecessors, but
    a forwarding table needs something else. D''s predecessor is C. That is the node
    just before D on the path. But router A cannot hand a packet to C. It is not even
    the right neighbor. The path to D is A, B, C, D, so A''s forwarding entry says:
    to reach D, send to B. In fact, every entry at A says B here. Distance, predecessor,
    and first hop are three different outputs. The first hop is the only one a forwarding
    table stores.'
  moves:
  - fade:
      names: _rule
  - table.show:
      name: fh
      zone: right_bottom
      cols:
      - Dest
      - Predecessor
      - First hop
      rows:
