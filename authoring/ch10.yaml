- id: idea
  stage: animation
  pdf: 37
  c:
  - Distance-Vector Routing
  say: That's distance-vector routing. No router keeps a map. Each one keeps a list
    of destinations and its best known distance to each, and it tells that list only
    to its direct neighbors. Then each router combines what its neighbors said with
    the cost of reaching them. It's like asking for directions. You can't see the
    route. But if your neighbor says they're 3 kilometers from the station, and they
    are 3 kilometers from you, then you know something about your own distance.
  moves:
