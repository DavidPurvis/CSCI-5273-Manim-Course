        frame_offset: 17
- id: real
  stage: rule
  pdf: 38
  c:
  - RIP
  - EIGRP
  say: Those neat rounds are a classroom picture. Real routers update whenever they
    like, with no global clock. A value from a neighbor could also be old, not a final
    truth. RIP and EIGRP are the named members of this family. RIP uses hop count
    as its metric. Don't assume EIGRP behaves identically, because its rules differ
    in detail.
