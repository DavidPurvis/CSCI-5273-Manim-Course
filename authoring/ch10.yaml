dish: '10.4'
title: MPLS labels
deck: lec10-routing.pdf
target_min: 4.5
concepts:
- MPLS Label Switching
- RSVP Signaling
beats:
- id: question
  stage: question
  pdf: 53
  c:
  - MPLS Label Switching
  say: Every router on a path repeats a longest prefix match, for the very same packet.
    And all traffic to one destination follows the shortest path, even when another
    route has spare capacity. Could we set up a path in advance, and just follow it?
  moves:
  - heading:
      text: 'Lecture 10: MPLS labels'
  - q:
      text: Could we set up a path in advance, and just follow it?
- id: label
  stage: animation
  pdf: 54
  c:
  - MPLS Label Switching
  say: That's what MPLS does. At the edge of the network, an ingress router classifies
    the packet, and pushes a short label in front of the IP header. Routers inside
    read only the label, and look it up in a small exact table. The label says which
    prepared path this packet is on. The last router pops the label, and ordinary
    IP takes over.
  moves:
  - clear: {}
  - net.show:
      name: m
      zone: top
      nodes:
        L:
          k: laptop
          at:
          - 0
          - 0
          l: Laptop
        R1:
          k: router
          at:
          - 3
          - 0
          l: R1
        R2:
          k: router
          at:
          - 6
          - 0
          l: R2
        R3:
          k: router
          at:
          - 9
          - 0
          l: R3
        W:
          k: server
          at:
          - 12
          - 0
          l: Server
      links:
      - - L
        - R1
      - - R1
        - R2
        - s: active
      - - R2
        - R3
        - s: active
      - - R3
        - W
  - stack.show:
      name: st
      zone: left_bottom
      width: 5.6
      reserve: 1
      layers:
      - t: "IP: laptop \u2192 server"
        k: ip
  - packet.spawn:
      name: p
      net: m
      at: L
      layers:
      - ip
  - packet.hop:
      name: p
      to: R1
  - packet.wrap:
      name: p
      kind: label
      when: an ingress router
  - stack.push:
      name: st
      text: MPLS label 17
      kind: label
  - rule:
      text: Ingress classifies the packet and pushes a label
      when:
        phrase: an ingress router
        frame_offset: 44
  - rule:
      text: Routers inside read only the label
      when: Routers inside
  - rule:
      text: The last router pops the label
      when: The last router
