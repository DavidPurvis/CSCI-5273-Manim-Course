- id: linkstate
  stage: animation
  pdf: 22
  c:
  - Link-State Routing
  - OSPF
  - IS-IS
  say: 'One approach is link-state routing, and its idea has two steps. Step one:
    every router tells everyone about its own links. Those messages flood through
    the whole network, so eventually every router holds the same map. Step two: each
    router independently runs a shortest path computation on its copy of that map,
    with itself as the source. It shares facts, not conclusions. OSPF and IS-IS are
    the two link-state protocols you will meet in practice, both used inside a single
    organization.'
  moves:
  - fade:
      names: _rule
  - net.path:
      name: g
      path:
      - A
      - C
      style: solid
  - net.path:
      name: g
      path:
      - A
      - B
      - C
      style: solid
  - fade:
      names: _rule
  - text:
      name: ls
      zone: right
      lines:
      - 'Step 1: flood your own links'
      - 'Step 2: compute from your map'
      - OSPF and IS-IS work this way
      when: Step one
