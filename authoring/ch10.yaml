        - $routing.small_first_hop.B
      - - C
        - $routing.small_pred.C
        - $routing.small_first_hop.C
      - - D
        - $routing.small_pred.D
        - $routing.small_first_hop.D
      when:
        phrase: The part
        frame_offset: 17
  - net.pulse:
