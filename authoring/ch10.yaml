    a total of 6. A''s link to C costs 2, and C says 5. That''s a total of 7. The
    minimum is 6, through B. So A''s distance is 6, and its next hop is B. A doesn''t
    know B''s internal path to Z, and it doesn''t need to. Now B advertises something
    new: its distance is 10. Through B would now cost 13. Through C still costs 7.
