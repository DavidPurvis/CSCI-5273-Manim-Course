- id: formula
  stage: rule
  pdf: 38
  c:
  - Bellman-Ford Updates
  say: The rule, called the Bellman-Ford update. x is me. y is the destination. v
    ranges over my neighbors. My distance to y is the minimum, over all neighbors
    v, of my link cost to v, plus v's advertised distance to y. And the neighbor that
    gives the minimum becomes my next hop. Two terms, and they come from different
    places. The first I can measure myself. The second I'm trusting my neighbor about.
  moves:
  - fade:
      names: _rule
  - tex:
      name: bf
      zone: right_top
      tex: D_x(y)=\min_{v}\{c(x,v)+D_v(y)\}
      size: 46
  - net.state:
      name: a
      nodes:
        A: now
        Z: now
      when: x is me
  - rule:
      text: x is me, y the destination, v a neighbor
      when:
        phrase: x is me
        frame_offset: 23
  - net.state:
      name: a
      nodes:
        B: candidate
        C: candidate
      when: v ranges over
  - net.pulse:
      name: a
      path:
      - A
      - B
      when: of my link cost
  - rule:
      text: My link cost to v, plus v's advertised distance
      when:
        phrase: of my link cost
        frame_offset: 29
  - msg.send:
      name: a
      a: B
      b: A
      text: 3 to Z
      when:
        phrase: plus v's advertised
        frame_offset: 8
  - net.state:
      name: a
      nodes:
        B: done
        C: null
      when: And the neighbor
  - rule:
      text: The neighbor giving the minimum is my next hop
      when:
        phrase: And the neighbor
        frame_offset: 23
  - text:
      name: terms
      zone: right_bottom
      lines:
      - 'c(x,v): I measure this myself'
      - 'D_v(y): I trust my neighbor'
      when: Two terms
  - rule:
      text: One term I measure; the other I trust
      when:
        phrase: Two terms
        frame_offset: 29
