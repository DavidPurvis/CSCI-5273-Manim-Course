dish: '15.1'
title: The cellular core
deck: lec15-mobile.pdf
target_min: 6.5
concepts:
- 2G Circuit-Switched Core
- 3G Parallel Voice and Data
- LTE All-IP Core
- UE and Subscriber Identity
- LTE eNodeB
- LTE Home Subscriber Server
- LTE Mobility Management Entity
- LTE Serving Gateway
- LTE Packet Gateway
beats:
- id: question
  stage: question
  pdf: 2
  c:
  - 2G Circuit-Switched Core
  say: Our laptop has become a phone, and now it's moving at highway speed, while
    it streams video. Its local Wi-Fi tricks are no help at this scale. A cellular
    carrier must find the phone anywhere in the country, keep its session alive across
    towers, and bill the right person. What kind of network can do all this?
  moves:
  - heading:
      text: 'Lecture 15: the cellular core'
  - spine:
      current: Move
      zone: top
  - q:
      text: What network can follow a phone across a whole country?
      zone: bottom
- id: g2
  stage: animation
  pdf: 3
  c:
  - 2G Circuit-Switched Core
  say: Follow the history, since it explains the design. 2G was built for voice, like
    the telephone network. A radio site, called a BTS, connects to a base station
    controller, a BSC. Those connect to a mobile switching center, the MSC, and a
    gateway leads to the public telephone network. It's circuit switched throughout.
  moves:
  - clear: {}
  - net.show:
      name: n
      zone: top
      nodes:
        P:
          k: phone
          at:
          - 0
          - 0
          l: Phone
        T:
          k: tower
          at:
          - 2.4
          - 0
          l: BTS
        B:
          k: box
          at:
          - 5
          - 0
          l: BSC
        M:
          k: box
          at:
          - 7.6
          - 0
          l: MSC
        G:
          k: cloud
          at:
          - 10.8
          - 0
          l: Telephone
      links:
      - - P
        - T
        - s: radio
      - - T
        - B
      - - B
        - M
      - - M
        - G
- id: g3
  stage: state
  pdf: 4
  c:
  - 3G Parallel Voice and Data
  say: '3G had to add data, without breaking voice. So it built a parallel packet
    core. The SGSN and GGSN form a data path to the Internet, sitting right beside
    the unchanged voice path. Voice and data share the radio side, and split at the
    edge of the core. That''s the key insight: coexistence, not replacement.'
  moves:
  - net.add:
      name: n
      nodes:
        SG:
          k: box
          at:
          - 7.6
          - -1.6
          l: SGSN
        GG:
          k: box
          at:
          - 10.8
          - -1.6
          l: GGSN
      links:
      - - B
        - SG
      - - SG
        - GG
        - s: active
  - rule:
      text: '3G: a packet-data core running beside the old voice core.'
- id: g3-more
  stage: state
  pdf: 4
  c:
  - 3G Parallel Voice and Data
  say: Watch one handset use both. Its voice call follows the MSC side. Its packet
    data follows the SGSN and GGSN side, toward the Internet.
  moves:
  - packet.spawn:
      name: vc
      net: n
      at: P
      layers:
      - eth
      when: Its voice
  - packet.hop:
      name: vc
      to:
      - T
      - B
      - M
      t: 1.6
  - packet.fade:
      name: vc
  - packet.spawn:
      name: dt
      net: n
      at: P
      layers:
      - ip
      when: Its packet
  - packet.hop:
      name: dt
      to:
      - T
      - B
      - SG
      - GG
      t: 1.8
  - packet.fade:
      name: dt
- id: g4
  stage: state
  pdf: 5
  c:
  - LTE All-IP Core
  say: 4G LTE makes a clean break. Everything, even voice, is carried as IP packets
    through one all-IP core. There's no separate circuit side. But all-IP doesn't
    mean ordinary routers and nothing else. LTE keeps specialized machinery for subscribers,
    authentication, location, radio scheduling, and tunnels.
  moves:
  - clear: {}
  - net.show:
      name: l
      zone: top
      nodes:
        U:
          k: phone
          at:
          - 0
          - 0
          l: UE
        E:
          k: tower
          at:
          - 2.8
          - 0
          l: eNodeB
        S:
          k: box
          at:
          - 6
          - 0
          l: S-GW
        G:
          k: box
          at:
          - 9
          - 0
          l: P-GW
        I:
          k: cloud
          at:
          - 12
          - 0
          l: Internet
        M:
          k: box
          at:
          - 6
          - 2
          l: MME
        H:
          k: box
          at:
          - 9
          - 2
          l: HSS
      links:
      - - U
        - E
        - s: radio
      - - E
        - S
        - s: active
      - - S
        - G
        - s: active
      - - G
        - I
        - s: active
      - - M
        - E
        - s: control
      - - M
        - S
        - s: control
      - - H
        - M
        - s: control
- id: ue
  stage: state
  pdf: 10
  c:
  - UE and Subscriber Identity
  clar:
  - imsi
  say: Let's assign each piece one main role. The UE, or user element, is the device,
    along with its subscription. The subscription is identified by an IMSI. This is
    an identity that stays the same, not a location. The slide calls it 64 bit, and
    draws it like a MAC address. In the standard, it's a string of no more than 15
    decimal digits. The point to keep is that it's separate from any MAC, IP, or tunnel
    address.
  moves:
  - net.state:
      name: l
      nodes:
        U: now
  - card:
      kind: clarification
      text: 'IMSI: a subscriber identity of up to 15 digits, not a MAC address.'
      zone: left_bottom
      when: The slide calls
- id: enb
  stage: state
  pdf: 11
  c:
  - LTE eNodeB
  say: The eNodeB is the base station. It's not a passive relay. It manages radio
    resources, and takes an active part in attachment and handover. It's where the
    wireless hop meets the core.
  moves:
  - fade:
      names: _card
  - net.state:
      name: l
      nodes:
        U: null
        E: now
- id: enb-more
  stage: state
  pdf: 11
  c:
  - LTE eNodeB
  say: For example, base station A decides that a target, B, should serve a moving
    phone. It asks B for resources, and later directs the phone there. The core's
    tunnel state then moves to match. An ordinary Ethernet switch does nothing like
    this.
  moves:
  - msg.send:
      name: l
      a: U
      b: E
      text: radio report
      when: For example
      t: 1.1
  - net.pulse:
      name: l
      path:
      - E
      - S
      when: The core's tunnel
- id: hss
  stage: state
  pdf: 12
  c:
  - LTE Home Subscriber Server
  say: The home subscriber server, the HSS, lives in the subscriber's home network.
    It stores who you are and what you're allowed to do, and it cooperates in authentication.
    It isn't on the path of your data at all.
  moves:
  - net.state:
      name: l
      nodes:
        E: null
        H: now
- id: hss-more
  stage: state
  pdf: 12
  c:
  - LTE Home Subscriber Server
  say: Picture a phone appearing in a visited network. Its mobility manager coordinates
    with the home HSS, to authenticate the subscription and set up state for the visit.
    That's a database and control role. No user packet ever passes through it.
  moves:
  - msg.send:
      name: l
      a: M
      b: H
      text: who is this?
      kind: control
      when: Its mobility
      t: 1.1
  - msg.send:
      name: l
      a: H
      b: M
      text: subscription
      kind: control
      t: 1.1
  - rule:
      text: The HSS is a database and control role, not a packet hop.
      when: That's a database
- id: mme
  stage: state
  pdf: 14
  c:
  - LTE Mobility Management Entity
  say: The mobility management entity, the MME, is the coordinator. It handles authentication
    with the HSS, tracks where the device is, handles paging, and sets up the tunnels.
    It tells other boxes what to do, but user data doesn't pass through it.
  moves:
  - net.state:
      name: l
      nodes:
        H: null
        M: now
- id: gw
  stage: state
  pdf: 13
  c:
  - LTE Serving Gateway
  - LTE Packet Gateway
  say: The serving gateway and the packet gateway are on the user's data path. The
    P-GW connects to external networks, such as the Internet. The S-GW joins the radio-side
    tunnel to the tunnel toward the P-GW. To see the point, watch a packet. It goes
    UE, eNodeB, S-GW, P-GW. It never touches the MME or the HSS.
  moves:
  - net.state:
      name: l
      nodes:
        M: null
        S: now
        G: now
  - packet.spawn:
      name: p
      net: l
      at: U
      layers:
      - ip
      when: To see the point
  - packet.hop:
      name: p
      to:
      - E
      - S
      - G
      - I
      t: 2.5
- id: pgw-more
  stage: state
  pdf: 13
  c:
  - LTE Packet Gateway
  say: The P-GW is the cellular system's outward doorway. The radio cell can change,
    while traffic stays anchored through that gateway. It may also perform NAT. But
    NAT translation and tunnel encapsulation are different operations, so don't treat
    them as one.
  moves:
  - packet.fade:
      name: p
  - net.state:
      name: l
      nodes:
        S: null
        G: now
      when: The P-GW is
  - net.pulse:
      name: l
      path:
      - G
      - I
      when: The radio cell
  - rule:
      text: NAT translates addresses. A tunnel adds an envelope.
      when: But NAT
  pre_roll: 0.5
- id: rule
  stage: rule
  pdf: 15
  c:
  - LTE All-IP Core
  say: Draw two separate pictures. The control story has the HSS and the MME. The
    payload story has the S-GW and the P-GW. A control message can change a data path
    without its sender being one of the hops. That's the data plane and control plane
    split again, from chapter 3.
  moves:
  - packet.fade:
      name: p
  - net.state:
      name: l
      nodes:
        S: null
        G: null
  - rule:
      text: HSS and MME are in the control story. S-GW and P-GW are in the payload
        story.
- id: pitfall
  stage: rule
  pdf: 15
  c:
  - LTE All-IP Core
  say: A tempting error is to route user data through every box in the diagram. The
    HSS and MME do control work. Payload travels through the base station, the S-GW,
    and the P-GW.
  moves:
  - trap:
      wrong: User data flows through the HSS or MME
      right: HSS and MME handle control. The gateways carry the data.
- id: changed
  stage: changed_example
  pdf: 14
  c:
  - LTE Mobility Management Entity
  say: Test that. Suppose the MME crashes for a moment, while a phone is sitting still,
    in the middle of a video stream. Separately, suppose the S-GW crashes.
  moves:
  - net.state:
      name: l
      nodes:
        M: error
- id: predict
  stage: prediction
  pdf: 14
  hold: 6
  c:
  - LTE Mobility Management Entity
  - LTE Serving Gateway
  say: Which failure immediately stops the video's packets? And which one affects
    moving phones, and new ones?
  moves:
  - pause:
      text: which failure stops the packets right away?
- id: answer
  stage: explanation
  pdf: 13
  c:
  - LTE Serving Gateway
  - LTE Mobility Management Entity
  say: An S-GW failure stops the packets right away, since it's on the data path.
    The tunnels that are already set up don't pass through the MME, so its failure
    hits control tasks first, like attaching, paging, and handover. So, the data flows
    through a chain of tunnels. What's inside those tunnels, and how does the radio
    hop actually work? That's next.
  moves:
  - net.state:
      name: l
      nodes:
        M: null
        S: error
  - rule:
      text: Data-path failure stops packets. Control failure stops changes.
  - keep: {}
prediction_contracts:
- prediction_beat: 15.1.predict
  answer_beat: 15.1.answer
  answer_events:
  - 15.1.answer:move:0
  - 15.1.answer:move:1
  answer_objects:
  - object: l
    after: 15.1.answer:move:0
    effect: net.state
    selector: {}
    before_answer: hidden_or_neutral
  - object: _rule
    after: 15.1.answer:move:1
    effect: rule
    selector: {}
    before_answer: hidden_or_neutral
  review_scope: Inspect the listed answer objects for neutral or hidden state during
    the prediction hold.
