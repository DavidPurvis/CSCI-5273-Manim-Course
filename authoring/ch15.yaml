  - Cellular Handover
  say: This is handover. Here's the setup. Packets come from the S-GW through a tunnel
    to base station A, then over the radio to the phone. Base station B sits next
    door, and it's stronger as the phone drives toward it. Base station A notices
    this from the phone's radio reports.
