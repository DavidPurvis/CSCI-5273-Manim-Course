    own slash 32 from wherever it is. Routers would find it, in principle. But think
    about billions of devices, each changing location constantly, with each change
    spreading through every router in the world. That would be enormous, rapidly changing
    routing state. And it would destroy the very aggregation that makes routing scale.
    So we push the problem to the edge instead.'
