- id: transport
  stage: state
  pdf: 41
  c:
  - Wireless Effects on Transport
  say: 'Does a preserved IP address mean nothing changes for TCP? No. The longer forwarding
    path raises delay for a while. Packets can arrive out of order. Radio errors and
    local retries make round trip times swing around. IP is still best effort, and
    its contract hasn''t changed. But TCP might read these effects as congestion,
    even when no queue is full. The details of transport belong to later lectures.
    For now, keep the link: what lower layers do can change the performance higher
    layers see.'
  moves:
  - bullets:
      name: ef
      zone: bottom
      show: 0
