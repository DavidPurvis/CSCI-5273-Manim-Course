  say: The problem that was planted back in chapter 3. An IP address says where you
    are in the topology. That's what makes routing scale. So what happens when you
    move? Your old address now points to the wrong place. But your identity, the thing
    others use to contact you, hasn't changed. One number has been doing two jobs.
