  stage: rule
  pdf: 41
  c:
  - Wireless Effects on Transport
  say: During handover, notice who carries what. The MME only sends control messages.
    The data goes from the S-GW, through A, and on to B.
  moves:
  - trap:
      wrong: The MME carries packets during handover
      right: The MME sends control messages. The data goes through the towers.
