dish: '15.2'
title: Radio stack and tunnels
deck: lec15-mobile.pdf
target_min: 6
concepts:
- LTE PDCP
- LTE RLC
- LTE Radio Scheduling
- OFDM
- GTP Tunnels
- LTE Attachment and System Information
- LTE Sleep and Paging
- 5G New Radio
- MIMO
beats:
- id: question
  stage: question
  pdf: 16
  c:
  - LTE PDCP
  - LTE RLC
  say: A phone's IP packet has to cross a noisy radio link, then a carrier's core
    network, and every few minutes the radio end of that path moves. How do you carry
    a packet through all that, so the packet itself never needs to know?
  moves:
  - heading:
      text: 'Lecture 15: radio stack and tunnels'
  - q:
      text: How does a packet cross all this without having to know?
  - keep: {}
- id: stack
  stage: animation
  pdf: 16
  c:
  - LTE PDCP
  - LTE RLC
  say: Start with the radio hop. LTE splits its link layer into pieces. PDCP handles
    header compression and encryption, so scarce radio bits aren't wasted on bulky
    headers. RLC handles fragmentation and reassembly, and reliable transfer over
    the radio. Below that sits the medium access layer. Note that RLC segmentation
    is not IPv4 fragmentation. The headers are different, and so is the scope of reassembly.
    The radio link fixes its own problems locally.
  moves:
  - clear: {}
  - stack.show:
      name: rs
      zone: left
      width: 6
      layers:
      - t: IP packet
        k: ip
      - t: 'PDCP: compress and encrypt'
        k: radio
      - t: 'RLC: segment and recover'
        k: radio
      - t: 'MAC: scheduled access'
        k: radio
      - t: 'Physical: radio'
        k: data
  - stack.mark:
      name: rs
      layer: 1
      when: PDCP handles
  - stack.mark:
      name: rs
      layer: 1
      state: null
      when: RLC handles
  - stack.mark:
      name: rs
      layer: 2
  - card:
      kind: note
      text: 'RLC segmentation is not IPv4 fragmentation: different headers, different
        scope.'
      zone: right
      when: Note that RLC
- id: sched
  stage: state
  pdf: 17
  c:
  - LTE Radio Scheduling
  - OFDM
  say: How do users share the radio? Unlike Wi-Fi, there's no contention for the downlink.
    The base station is a scheduler. It uses OFDM, which divides the channel into
    many orthogonal frequency subcarriers. Picture a grid, with time along one axis,
    and frequency along the other. The scheduler hands each small block to one user.
    A user with good conditions may get more. That grid only shows opportunities,
    and doesn't give you application throughput, because coding, modulation, and overhead
    still apply.
  moves:
  - clear: {}
  - table.show:
      name: g
      zone: top
      cols:
      - Frequency
      - t1
      - t2
      - t3
      - t4
      - t5
      rows:
      - - f3
        - A
        - A
        - B
        - C
        - C
      - - f2
        - B
        - B
        - B
        - C
        - A
      - - f1
        - A
        - C
        - C
        - B
        - B
      show: 0
  - table.reveal:
      name: g
      n: 3
      when: Picture a grid
  - rule:
      text: The base station schedules time-frequency blocks. No contention on the
        downlink.
- id: gtp
  stage: animation
  pdf: 18
  c:
  - GTP Tunnels
  say: The core. Inside the core, the phone's packet isn't routed by its own address.
    It travels in a tunnel, using GTP, the GPRS tunneling protocol. The eNodeB wraps
    the phone's IP packet in a GTP header, that in UDP, and that in an outer IP header
    addressed to the S-GW. Core routers read only that outer header. The S-GW then
    unwraps and rewraps, into a new tunnel toward the P-GW. There the outer layers
    come off, and the original packet heads into the Internet, unchanged.
  moves:
  - clear: {}
  - net.show:
      name: t
      zone: top
      nodes:
        U:
          k: phone
          at:
          - 0
          - 0
          l: UE
        E:
          k: tower
          at:
          - 3
          - 0
          l: eNodeB
        S:
          k: box
          at:
          - 6.4
          - 0
          l: S-GW
        G:
          k: box
          at:
          - 9.8
          - 0
          l: P-GW
        I:
          k: cloud
          at:
          - 13
          - 0
          l: Internet
      links:
      - - U
        - E
        - s: radio
      - - E
        - S
        - s: tunnel
      - - S
        - G
        - s: tunnel
      - - G
        - I
  - stack.show:
      name: enc
      zone: bottom
      width: 6.5
      reserve: 3
      layers:
      - t: "Inner IP: UE \u2192 server"
        k: ip
  - packet.spawn:
      name: p
      net: t
      at: U
      layers:
      - ip
  - packet.hop:
      name: p
      to: E
  - packet.wrap:
      name: p
      kind: tunnel
      when: The eNodeB wraps
  - stack.push:
      name: enc
      text: GTP-U
      kind: tunnel
  - stack.push:
      name: enc
      text: UDP
      kind: transport
  - stack.push:
      name: enc
      text: "Outer IP: eNodeB \u2192 S-GW"
      kind: tunnel
  - packet.hop:
      name: p
      to: S
      when: Core routers read
  - tunnel.reencapsulate:
      stack: enc
      outer: "Outer IP: S-GW \u2192 P-GW"
      when: The S-GW then
  - packet.hop:
      name: p
      to: G
  - packet.peel:
      name: p
      when: There the outer
  - packet.hop:
      name: p
      to: I
- id: why
  stage: rule
  pdf: 18
  c:
  - GTP Tunnels
  say: What's the benefit of all that wrapping? The radio end of the tunnel can change,
    without every Internet router learning a new route for this phone. The inner address
    stays fixed, while only the outer destination moves. And the core needs nothing
    beyond plain IP routing.
  moves:
  - rule:
      text: The inner packet stays fixed. Only the tunnel's outer destination moves.
- id: attach
  stage: state
  pdf: 19
  c:
  - LTE Attachment and System Information
  say: How does a phone get started? It first synchronizes with a nearby cell, and
    reads broadcast system information. It selects a base station. Then control setup,
    with authentication through the MME and HSS. And finally the data path is built.
    Finding a signal doesn't prove that a tunnel, or even an authorized subscription,
    is ready. Those are distinct stages.
  moves:
  - clear: {}
  - bullets:
      name: at
      zone: left
      show: 4
      items:
      - Synchronize, read system information
      - Select a base station
      - Authenticate through MME and HSS
      - Build the user data path
- id: sleep
  stage: state
  pdf: 20
  c:
  - LTE Sleep and Paging
  say: 'Radios drain batteries, so an idle phone sleeps. It can go into a deeper sleep,
    where it no longer tracks a specific cell, and then the network knows it only
    roughly. To reach it, the network pages it across that area. When it wakes, it
    might have moved, and may need a new association. It''s the same trade-off as
    Wi-Fi sleep: battery against delivery, with cellular machinery.'
  moves:
  - tl.show:
      name: sl
      zone: right
      tracks:
      - Phone
      - Network
      span:
      - 0
      - 10
  - tl.block:
      name: sl
      track: Phone
      start: 0
      end: 7
      text: asleep
      state: idle
  - tl.block:
      name: sl
      track: Network
      start: 6
      end: 8
      text: page
      kind: label
      when: To reach it
  - tl.block:
      name: sl
      track: Phone
      start: 7
      end: 10
      text: awake
      kind: ip
      when: When it wakes
- id: sleep-more
  stage: state
  pdf: 20
  c:
  - LTE Sleep and Paging
  say: Follow one phone. It sleeps, moves into another cell, and then becomes active.
    The old radio path can't simply be assumed, so it may need to reestablish access
    through the new cell before traffic can resume.
  moves:
  - rule:
      text: A sleeper may wake in a new cell, and must reattach.
      when: The old radio
  - tl.block:
      name: sl
      track: Network
      start: 8
      end: 10
      text: reattach
      state: now
      when: so it may need
- id: interconnect
  stage: state
  pdf: 22
  c:
  - LTE Attachment and System Information
  say: 'One more view. Carriers are networks of IP networks, joined by interconnections,
    just like the rest of the Internet. Your phone might attach in a visited network,
    while your subscriber record stays at home, in your home carrier''s HSS. So every
    topic in this course reappears here: tunnels, routers, and policy agreements between
    providers.'
  moves:
  - clear: {}
  - net.show:
      name: ic
      zone: top
      nodes:
        V:
          k: cloud
          at:
          - 0
          - 0
          l: Visited
        I:
          k: cloud
          at:
          - 5
          - 0
          l: Internet
        H:
          k: cloud
          at:
          - 10
          - 0
          l: Home
      links:
      - - V
        - I
      - - I
        - H
- id: fiveg
  stage: state
  pdf: 23
  c:
  - 5G New Radio
  - MIMO
  say: '5G New Radio extends the physical layer. Higher frequencies offer more capacity,
    but shorter range, so cells must be much denser. MIMO uses many antennas to send
    and receive multiple spatial streams. The slide''s specific rates and goals describe
    the era of those slides, so treat them as context. The trade-off is what lasts:
    more spectrum and antennas for capacity, paid for with deployment density.'
  moves:
  - clear: {}
  - table.show:
      name: f
      zone: top
      cols:
      - Technique
      - Gain
      - Cost
      rows:
      - - Higher frequency
        - more capacity
        - shorter range and denser cells
      - - MIMO
        - multiple spatial streams
        - more antennas
  - rule:
      text: Numbers on these slides are era-specific. The trade-off is what lasts.
- id: pitfall
  stage: rule
  pdf: 23
  c:
  - 5G New Radio
  - MIMO
  say: Don't mix these up. CDMA separates senders by code. OFDM organizes the channel
    by frequency and time, and the scheduler hands out those resources.
  moves:
  - trap:
      wrong: OFDM separates users by code, like CDMA
      right: OFDM separates by frequency and time
- id: changed
  stage: changed_example
  pdf: 18
  c:
  - GTP Tunnels
  say: Look at one packet, deep in the core, between S-GW and P-GW. Its inner destination
    is a web server on the Internet.
  moves:
  - clear: {}
  - stack.show:
      name: k
      zone: top
      width: 7
      layers:
      - t: "Outer IP: S-GW \u2192 P-GW"
        k: tunnel
      - t: UDP and GTP-U
        k: transport
      - t: "Inner IP: UE \u2192 web server"
        k: ip
- id: predict
  stage: prediction
  pdf: 18
  hold: 6
  c:
  - GTP Tunnels
  say: Which address does a core router in the middle use to forward it? Does that
    router need a route to the phone?
  moves:
  - pause:
      text: which address does a core router read?
- id: answer
  stage: explanation
  pdf: 18
  c:
  - GTP Tunnels
  say: 'It reads the outer destination, the P-GW. It needs no route to the phone at
    all. That''s the whole benefit: a carrier''s core routers know nothing about individual
    subscribers. And now the big question. Your phone has moved between cities, or
    even to another carrier''s network. Its identity hasn''t changed, but where it
    sits has. How does anybody find it?'
