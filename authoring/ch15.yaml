- id: answer
  stage: explanation
  pdf: 40
  c:
  - Cellular Handover
  - Wireless Effects on Transport
  say: 'Packets reach B, but the phone is still attached to A, so B has nobody to
    give them to. They would need buffering, or they''d be lost. The real ordering
    avoids this: the radio moves first, and packets follow, by way of A, and only
    then does the core switch. Order matters, just as it did with routing convergence.
    And with that, every piece of the story is in place. So let''s put it all together,
    one last time.'
  moves:
  - packet.spawn:
      name: x
      net: h
      at: S
      layers:
      - tunnel
      - ip
      when: Packets reach B
  - packet.hop:
      name: x
      to: B
  - net.state:
      name: h
      nodes:
        B: error
      when: so B has nobody
  - packet.drop:
      name: x
      when: or they'd be lost
  - net.state:
      name: h
      nodes:
        B: null
      links:
      - - S
        - B
        - dim
      - - S
        - A
        - tunnel
      when: The real ordering
  - rule:
      text: 'Order matters: move the radio, forward through A, then switch the core.'
      when: Order matters
  - clear:
      when: So let's put
  - spine:
      current: Move
      zone: top
  - keep: {}
