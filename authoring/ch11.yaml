dish: '11.2'
title: Counting to infinity
deck: lec11-convergence.pdf
target_min: 7
concepts:
- Count to Infinity
- Poison Reverse
beats:
- id: question
  stage: question
  pdf: 12
  c:
  - Count to Infinity
  say: Distance vector routers believe the numbers their neighbors tell them. When
    a link gets cheaper, that's wonderful. When a link fails, it's a disaster, and
    the reason is not obvious. Why should good news travel fast, while bad news crawls?
  moves:
  - heading:
      text: 'Lecture 11: counting to infinity'
  - q:
      text: Why does good news travel fast, and bad news crawl?
  - keep: {}
- id: goodnews
  stage: animation
  pdf: 14
  c:
  - Count to Infinity
  say: Start with good news. A link cost drops. The router attached to it sees a better
    distance, tells its neighbor, who sees a better distance too, and tells the next.
    The improvement spreads in a couple of exchanges, and everyone stops. A real,
    better path exists, so every update is true.
  moves:
  - clear: {}
  - net.show:
      name: g
      zone: top
      nodes:
        X:
          k: node
          at:
          - 0
          - 0
          l: X
        Y:
          k: node
          at:
          - 5
          - 0
          l: Y
        Z:
          k: node
          at:
          - 10
          - 0
          l: Z
      links:
      - - X
        - Y
        - c: 1
      - - Y
        - Z
        - c: 1
  - net.state:
      name: g
      nodes:
        Y: now
      when: The router attached
  - net.badge:
      name: g
      node: Y
      text: 1 to X
      side: up
  - msg.send:
      name: g
      a: Y
      b: Z
      text: 1 to X
      when: tells its neighbor
  - net.badge:
      name: g
      node: Z
      text: 2 to X, via Y
      side: up
      when: who sees
  - net.state:
      name: g
      nodes:
        Y: done
        Z: done
      when: A real, better
- id: setup
  stage: state
  pdf: 16
  c:
  - Count to Infinity
  say: The bad news, on this tiny chain. Y reaches X directly, at distance 1. Z reaches
    X through Y, at distance 2. And there is no other route to X in this network at
    all. Now cut the link between X and Y. X is gone. Y knows immediately. What should
    it do? It looks at what its neighbors have advertised, and it sees Z saying, I
    can reach X at distance 2.
  moves:
  - net.state:
      name: g
      nodes:
        Y: null
        Z: null
  - net.walk:
      name: g
      path:
      - Y
      - X
      when: Y reaches X
  - net.walk:
      name: g
      path:
      - Z
      - Y
      - X
      when: Z reaches X
  - net.unwalk:
      name: g
      when: Now cut
  - net.state:
      name: g
      links:
      - - X
        - Y
        - failed
  - table.show:
      name: t
      zone: bottom
      data: $convergence.cti_table
      show: 1
      row_h: 0.44
  - net.state:
      name: g
      nodes:
        Y: now
      when: Y knows
  - msg.send:
      name: g
      a: Z
      b: Y
      text: 2 to X
      when: it sees Z
  - net.badge:
      name: g
      node: Y
      text: X? Z says 2
      side: up
      state: now
- id: trap
  stage: state
  pdf: 17
  c:
  - Count to Infinity
  say: 'The trap. Y has no way of knowing that Z''s path runs through Y itself. A
    bare number hides that. So Y believes it. Z''s 2 plus a link of 1 makes 3, and
    Y now routes to X through Z. Y tells Z the news: I''m at 3. Z depends on Y, so
    Z updates: 3 plus 1 is 4. Z tells Y. Y updates: 5. Then Z: 6.'
  moves:
  - net.state:
      name: g
      nodes:
        Y: null
  - table.reveal:
      name: t
      when: So Y believes
  - net.badge:
      name: g
      node: Y
      text: 3, via Z
      side: up
      state: error
  - net.walk:
      name: g
      path:
      - Y
      - Z
      state: error
      when: Y now routes
  - msg.send:
      name: g
      a: Y
      b: Z
      text: I'm at 3
      when: Y tells Z
      t: 1.1
  - table.reveal:
      name: t
  - net.badge:
      name: g
      node: Z
      text: 4, via Y
      side: up
      state: error
  - msg.send:
      name: g
      a: Z
      b: Y
      text: '4'
      when: Z tells Y
      t: 0.7
  - table.reveal:
      name: t
  - net.badge:
      name: g
      node: Y
      text: 5, via Z
      side: up
      state: error
  - msg.send:
      name: g
      a: Y
      b: Z
      text: '5'
      when: Then Z
      t: 0.6
  - table.reveal:
      name: t
  - net.badge:
      name: g
      node: Z
      text: 6, via Y
      side: up
      state: error
- id: meaning
  stage: rule
  pdf: 17
  c:
  - Count to Infinity
  say: Stop and see what those numbers mean. There is no path to X at all. Yet each
    router is confident. They point at each other, and their traffic bounces between
    them, while the numbers creep up, until they reach whatever the protocol treats
    as infinity. No new links appeared. The routers are slowly unlearning something
    false. This is called count to infinity. It's information feedback, not any physical
    growth in the network. And a cost increase can trigger the same counting, even
    if a real but expensive alternate exists. They just count up until the alternate
    wins.
  moves:
  - net.badge:
      name: g
      node: X
      text: no path at all
      side: down
      state: error
      when: There is no path
  - packet.spawn:
      name: lp
      net: g
      at: Y
      layers:
      - ip
      when: They point
  - packet.hop:
      name: lp
      to:
      - Z
      - Y
      - Z
      - Y
      - Z
      - Y
      t: 5
      when: their traffic
  - net.badge:
      name: g
      node: Y
      text: 7, 9, 11 ...
      side: up
      state: error
      when:
        phrase: until they reach
        frame_offset: 34
  - net.badge:
      name: g
      node: Z
      text: 8, 10, 12 ...
      side: up
      state: error
  - packet.fade:
      name: lp
      when: No new links
  - fx.burst:
      net: g
      between:
      - Y
      - Z
      when: The routers are slowly
  - rule:
      text: 'Count to infinity: a scalar distance hides a circular dependency.'
      when: This is called
  - net.pulse:
      name: g
      path:
      - Y
      - Z
      - Y
      state: error
      when: They just count
- id: rip
  stage: state
  pdf: 19
  c:
  - Count to Infinity
  say: One crude fix is to make infinity small. RIP treats 16 as unreachable, leaving
    1 through 15 as usable metrics. Now the counting stops at 16, soon rather than
    never. But any network wider than 15 hops can't be represented. And the underlying
    problem has not gone anywhere. We only bounded it.
  moves:
  - clear:
      keep:
      - g
  - table.show:
      name: rip
      zone: bottom
      cols:
      - RIP metric
      - Meaning
      rows:
      - - 1 to 15
        - usable path
      - - 16
        - unreachable
      show: 0
  - table.reveal:
      name: rip
      when: RIP treats
  - table.reveal:
      name: rip
  - net.badge:
      name: g
      node: Y
      text: stops at 16
      side: up
      state: done
      when: Now the counting
  - table.mark:
      name: rip
      r: 0
      state: error
      when: But any network
- id: poison
  stage: state
  pdf: 18
  c:
  - Poison Reverse
  say: 'A better fix targets the actual lie. Go back to before the failure. Z''s route
    to X goes through Y. So why would Z ever tell Y that it has a route to X? That
    information is useless to Y, and we''ve just seen that it''s dangerous. Poison
    reverse says: if you route through a neighbor, tell that neighbor your distance
    is infinity. Z keeps its true route, and tells Y infinity. It can still tell its
    other neighbors the truth. So the advertisement is specific to each neighbor.
    It is not a command to delete anything.'
  moves:
  - net.state:
      name: g
      links:
      - - X
        - Y
        - solid
      when: Go back
  - net.badge:
      name: g
      node: Y
      text: 1 to X
      side: up
  - net.unbadge:
      name: g
      node: X
  - net.walk:
      name: g
      path:
      - Z
      - Y
      when: Z's route to X
  - net.badge:
      name: g
      node: Z
      text: "tells Y: \u221E"
      side: up
      state: now
      when: Poison reverse says
  - msg.send:
      name: g
      a: Z
      b: Y
      text: "\u221E"
      kind: error
      when: tell that neighbor
      t: 1.1
  - rule:
      text: If you route through a neighbor, tell that neighbor your distance is infinite.
      when: Z keeps its true
- id: poisoned
  stage: state
  pdf: 18
  c:
  - Poison Reverse
  say: Replay the failure. X and Y lose their link. Y checks its neighbors. Z says
    infinity. So Y knows it has nowhere to go, and it tells Z so. Z's only route was
    through Y, so Z drops to infinity as well. Done, in one quick exchange, with no
    counting.
  moves:
  - clear:
      keep:
      - g
  - net.unwalk:
      name: g
  - net.state:
      name: g
      links:
      - - X
        - Y
        - failed
      when: X and Y lose
  - table.show:
      name: pt
      zone: bottom
      data: $convergence.poison_table
      show: 1
  - table.reveal:
      name: pt
      when: Z says infinity
  - net.badge:
      name: g
      node: Y
      text: "\u221E"
      side: up
      state: done
      when: So Y knows
  - msg.send:
      name: g
      a: Y
      b: Z
      text: "\u221E"
      kind: error
      when: it tells Z
      t: 1.0
  - table.reveal:
      name: pt
      when: Z's only route
  - net.badge:
      name: g
      node: Z
      text: "\u221E"
      side: up
      state: done
- id: slide-good
  stage: state
  pdf: 15
  c:
  - Count to Infinity
  say: See the counting itself with the slide's real numbers, on a slightly bigger
    network. X to Y costs 4, Y to Z costs 1, and X to Z costs 50. Y reaches X directly
    at 4, and Z goes through Y, at 5. Now suppose X to Y gets better, dropping to
    1. Y's distance falls to 1, and it tells Z. Z computes 2. Z tells Y, and Y stays
    at 1. Done, in two exchanges.
  moves:
  - clear: {}
  - net.show:
      name: tri
      zone: left
