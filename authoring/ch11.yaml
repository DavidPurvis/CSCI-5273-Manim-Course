        - $convergence.disagree_solutions.1.2
    when: There are two
- id: gadget
  stage: state
  pdf: 34
  c:
  - Policy Oscillation
  say: Three nodes in a ring. Each prefers the path through its clockwise neighbor,
    and each will otherwise go direct. Try to settle them. If node 1 goes direct,
    node 2 can use its favorite, through node 1, and so node 2 is not direct. Then
    node 3 can't use 320, and goes direct. But then node 1 can use 130, its favorite,
    and is no longer direct. That undoes node 2's choice. And round it goes. An exhaustive
    check of every assignment finds no stable solution at all. No link failed. Policies
    alone keep routes changing, forever. That's policy oscillation.
  moves:
  - clear: {}
  - net.show:
      name: b
      zone: left
      nodes:
        n0:
          k: node
          at:
          - 3
          - 1.2
          l: '0'
        n1:
          k: node
          at:
