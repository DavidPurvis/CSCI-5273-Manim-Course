  stage: changed_example
  pdf: 18
  c:
  - Poison Reverse
  - Count to Infinity
  say: Is the problem solved? Add a third router to the loop. Now Y, Z, and W form
    a triangle, and they all reach X through Y. Z and W are each other's neighbors.
  moves:
  - clear: {}
  - net.show:
      name: t3
      zone: top
      nodes:
        X:
          k: node
          at:
