          - 0
          l: X
        Y:
          k: node
          at:
          - 3
          - 0
          l: Y
        Z:
          k: node
          at:
          - 6
          - 1
          l: Z
        W:
          k: node
          at:
          - 6
          - -1
          l: W
      links:
      - - X
        - Y
        - s: failed
      - - Y
        - Z
      - - Y
        - W
      - - Z
        - W
- id: predict
  stage: prediction
  pdf: 18
  hold: 6
  c:
  - Poison Reverse
  say: Z poisons its route toward Y. But what does Z tell W? Could W now give Y bad
    advice?
  moves:
  - pause:
      text: what does Z tell W? can a longer cycle still count up?
- id: answer
  stage: explanation
  pdf: 18
  c:
  - Poison Reverse
  - Count to Infinity
  say: 'Z tells W the truth: distance 2. It doesn''t route through W, so it has no
    reason to poison. W then thinks it has a path to X through Z, and it can tell
    Y. So a loop of three can still count up. Poison reverse handles the simple two-node
    case, not every cycle. What''s the real issue? The number hides the path. So what
    if routers just sent the path? That''s the fix BGP uses, and we''ll see that even
    this doesn''t make the trouble go away.'
  moves:
  - msg.send:
      name: t3
      a: Z
      b: W
      text: '2'
      when: Z tells W
  - msg.send:
      name: t3
      a: W
      b: Y
      text: '3'
      when: and it can tell Y
  - packet.spawn:
      name: lp
      net: t3
      at: Y
      layers:
      - ip
      when: So a loop
  - packet.hop:
      name: lp
      to:
      - Z
      - W
      - Y
      - Z
      - W
      - Y
      t: 3.5
  - packet.fade:
      name: lp
  - rule:
      text: 'Poison reverse handles two nodes, not larger cycles. Next: send the whole
        path.'
      when: not every cycle
  - clear:
      when: So what if
  - q:
      text: What if routers just sent the path?
  - keep: {}
