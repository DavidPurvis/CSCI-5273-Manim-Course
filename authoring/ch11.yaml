dish: '11.3'
title: BGP that won't settle
deck: lec11-convergence.pdf
target_min: 7.5
concepts:
- BGP Session Liveness
- BGP Path Exploration
- Stable Paths Problem
- Policy Oscillation
beats:
- id: question
  stage: question
  pdf: 25
  c:
  - BGP Path Exploration
  say: Path vector carries the whole path, so a router can spot a loop at once, and
    count to infinity disappears. Does that mean convergence is solved? There are
    two remaining problems. It can be slow in a new way. And even worse, with some
    policies, it may never settle at all.
  moves:
  - heading:
      text: 'Lecture 11: BGP that won''t settle'
  - q:
      text: Paths prevent counting. Does that solve convergence?
- id: liveness
  stage: animation
  pdf: 24
  c:
  - BGP Session Liveness
  say: First, how do BGP neighbors notice that one of them has died? BGP runs over
    a TCP connection, and TCP alone won't tell you that an idle peer has vanished.
    So neighbors send keepalive messages. In the slide's example, a keepalive goes
    every 60 seconds, and the hold timer is 180 seconds. If nothing arrives for that
    long, the session is declared dead. Every route learned over it is then invalid.
    So just detecting one failure may take three minutes.
  moves:
  - clear: {}
  - tl.show:
      name: k
      zone: top
      tracks:
      - Keepalives
      span:
      - 0
      - 300
      ticks:
      - 0
      - 60
      - 120
      - 180
      - 240
      - 300
  - tl.block:
      name: k
      track: Keepalives
      start: 0
      end: 6
      kind: ip
  - tl.block:
      name: k
      track: Keepalives
      start: 60
      end: 66
      kind: ip
  - tl.block:
      name: k
      track: Keepalives
      start: 66
      end: 246
      text: 'silent: 180 s hold timer'
      state: error
      when: If nothing arrives
  - rule:
      text: 'Example timers: keepalive 60 s, hold 180 s. Then every route from that
        peer is invalid.'
- id: explore
  stage: state
  pdf: 27
  c:
  - BGP Path Exploration
  say: 'Suppose destination 0 disappears entirely. Follow AS 2 as the news spreads.
    It''s been using the direct path, 2, 0. That gets withdrawn. But it remembers
    an alternative through AS 1: 2, 1, 0. It looks fine, it''s loop-free, and it''s
    false, since AS 1 simply hasn''t heard yet. Then that''s withdrawn too. So it
    tries 2, 3, 0, which is also stale. Next 2, 1, 3, 0, longer still. Only after
    all of those does it finally have no route. This is path exploration. Each candidate
    seems reasonable locally, and each fails in turn. Every step also causes more
    update messages.'
  moves:
  - clear: {}
  - net.show:
      name: x
      zone: left
      nodes:
        n0:
          k: cloud
          at:
          - 3
          - 0
          l: '0'
        n1:
          k: cloud
          at:
          - 0
          - 2
          l: '1'
        n2:
          k: cloud
          at:
          - 3
          - 4
          l: '2'
        n3:
          k: cloud
          at:
          - 6
          - 2
          l: '3'
      links:
      - - n0
        - n1
      - - n0
        - n2
      - - n0
        - n3
      - - n1
        - n2
      - - n2
        - n3
      - - n1
        - n3
  - table.show:
      name: seq
      zone: right
      cols:
      - AS 2's choice
      rows:
      - - $convergence.exploration.0
      - - $convergence.exploration.1
      - - $convergence.exploration.2
      - - $convergence.exploration.3
      - - no route
      show: 1
  - net.state:
      name: x
      nodes:
        n0: error
      links:
      - - n0
        - n1
        - failed
      - - n0
        - n2
        - failed
      - - n0
        - n3
        - failed
      when: It's been using
  - table.reveal:
      name: seq
      when: But it remembers
  - table.reveal:
      name: seq
      when: So it tries
  - table.reveal:
      name: seq
      when: Next 2, 1, 3
  - table.reveal:
      name: seq
      when: Only after all
- id: exploration-cost
  stage: state
  pdf: 28
  c:
  - BGP Path Exploration
  say: Why doesn't that settle faster? Each router must first hear about the failure
    of what it's using, then choose its next best candidate, and advertise that. Those
    messages are limited by timers, so that routers aren't flooded with updates. So
    each wrong candidate can take a while to be discovered. Also, not every BGP change
    is a hardware failure. Import and export policy changes, resets of sessions, and
    persistent instability all make routes change too.
  moves:
  - clear: {}
  - bullets:
      name: why
      zone: top
      show: 3
      items:
      - Hear about the failure of the path in use
      - Choose and advertise the next candidate
      - Repeat until the news has reached everyone
  - rule:
      text: 'Not all route changes are failures: policy changes and session resets
        count too.'
- id: spp
  stage: rule
  pdf: 30
  c:
  - Stable Paths Problem
  say: The deeper problem. Each network ranks paths by its own policy. Do those independent
    choices always fit together? To study this, there's a clean model called the stable
    paths problem. Each node has a ranked list of permitted paths to destination 0.
    A path is available only if the next hop is actually using exactly the rest of
    that path. A stable assignment gives every node its best available path, all at
    the same time.
  moves:
  - clear: {}
  - net.show:
      name: s
      zone: left
      nodes:
        n0:
          k: node
          at:
          - 3
          - 1.2
          l: '0'
        n1:
          k: node
          at:
          - 0
          - 0
          l: '1'
        n2:
          k: node
          at:
          - 2.6
          - 3.2
          l: '2'
        n3:
          k: node
          at:
          - 5.2
          - 0
          l: '3'
        n4:
          k: node
          at:
          - 5.4
          - 2
          l: '4'
        n5:
          k: node
          at:
          - 5.6
          - 4
          l: '5'
      links:
      - - n1
        - n2
      - - n2
        - n5
      - - n2
        - n4
      - - n2
        - n0
      - - n1
        - n0
      - - n1
        - n3
      - - n0
        - n3
      - - n4
        - n3
  - table.show:
      name: ranks
      zone: right
      cols:
      - Node
      - Most preferred
      - Then
      rows:
      - - 1
        - 130
        - 10
      - - 2
        - 210
        - 20
      - - 3
        - 30
        - ''
      - - 4
        - 420
        - 430
      - - 5
        - 5210
        - ''
  - rule:
      text: A path is available only if the next hop is using exactly its remainder.
- id: solve
  stage: state
  pdf: 31
  c: &id001
  - Stable Paths Problem
  say: Solve the instructor's instance. Node 3 has only one permitted path, 30, so
    it uses it. Node 1 prefers 130, and since 3 uses 30, that's available, so node
    1 uses 130. Node 2 prefers 210, which requires node 1 to use 10. But node 1 uses
    130, so that's unavailable, and node 2 falls back to 20.
  moves:
  - table.mark:
      name: ranks
      r: 2
      state: done
      when: Node 3 has
  - net.badge:
      name: s
      node: n3
      text: '30'
      side: right
      state: done
  - table.mark:
