  stage: rule
  pdf: 17
  c:
  - Count to Infinity
  say: Making infinity small feels like a fix. It isn't. It only bounds the counting,
    and it limits how wide the network can be. The underlying dependency is still
    there.
  moves:
  - trap:
      wrong: A smaller infinity fixes count to infinity
      right: It only bounds the counting, and limits the network's width
