dish: '11.1'
title: When a link fails
deck: lec11-convergence.pdf
target_min: 6
concepts:
- Failure Detection
- Routing Convergence
- Forwarding Blackholes
- Transient Forwarding Loops
beats:
- id: question
  stage: question
  pdf: 4
  c:
  - Failure Detection
  say: A backhoe cuts a fiber between two routers. A moment before, every table was
    correct. A few seconds later, every table will be correct again. So what happens
    to our laptop's packets during those few seconds? The answer shows that correct
    before and correct after does not mean safe in between.
  moves:
  - heading:
      text: 'Lecture 11: when a link fails'
  - spine:
      current: Failure
      zone: top
  - q:
      text: Correct before, correct after. What about in between?
      zone: bottom
- id: laptop
  stage: animation
  pdf: 4
  c:
  - Failure Detection
  say: Picture our laptop's video call, running happily through R1 and R2. The packets
    keep coming every few milliseconds, whether the tables are ready or not. So a
    failure isn't an abstract event. It happens underneath traffic that's already
    moving.
  moves:
  - clear: {}
  - net.show:
      name: lp
      zone: top
      nodes:
        L:
          k: laptop
          at:
          - 0
          - 0
          l: Laptop
        A:
          k: router
          at:
          - 3.4
          - 0
          l: R1
        B:
          k: router
          at:
          - 6.8
          - 0
          l: R2
        W:
          k: server
          at:
          - 10.2
          - 0
          l: Web server
      links:
      - - L
        - A
      - - A
        - B
      - - B
        - W
  - packet.spawn:
      name: p
      net: lp
      at: L
      layers:
      - ip
      when: Picture our
  - packet.hop:
      name: p
      to:
      - A
      - B
      - W
      t: 2.2
  - packet.fade:
      name: p
  - packet.spawn:
      name: q
      net: lp
      at: L
      layers:
      - ip
      when: The packets keep
  - packet.hop:
      name: q
      to:
      - A
      - B
      - W
      t: 2.2
  - packet.fade:
      name: q
  - net.state:
      name: lp
      links:
      - - A
        - B
        - failed
      when: So a failure
  pre_roll: 2.0
- id: causes
  stage: animation
  pdf: 4
  c:
  - Failure Detection
  say: 'First, what kinds of change are we talking about? Some are planned: maintenance
    that shuts down a link, or traffic engineering that changes a weight. Others aren''t:
    a fiber cut, a power failure, or crashing software. Keep this separate from a
    different problem we''ll reach later. A new route to the same location is a routing
    change. A host moving to a new location is mobility. Here, the destination stays
    put, and the network underneath it changes.'
  moves:
  - clear: {}
  - table.show:
      name: ch
      zone: top
      cols:
      - Planned
      - Unplanned
      rows:
      - - maintenance
        - fiber cut
      - - traffic engineering
        - power failure
      - - ''
        - failed software
- id: detect
  stage: animation
  pdf: 5
  c:
  - Failure Detection
  say: First, how does anyone even find out? Sometimes the hardware reports a dead
    link. Often routers exchange periodic hello messages, and declare a neighbor dead
    after a few are missed. That leaves a real tension. A short timer finds failures
    quickly, but it costs more traffic and processing, and it can raise false alarms,
    since a delayed hello looks exactly like a dead neighbor. A long timer is calm,
    and slow.
  moves:
  - clear: {}
  - tl.show:
      name: h
      zone: top
      tracks:
      - Hellos
      span:
      - 0
      - 10
      ticks:
      - 0
      - 2
      - 4
      - 6
      - 8
      - 10
  - tl.block:
      name: h
      track: Hellos
      start: 0
      end: 0.3
      kind: ip
  - tl.block:
      name: h
      track: Hellos
      start: 2
      end: 2.3
      kind: ip
  - tl.block:
      name: h
      track: Hellos
      start: 4
      end: 4.3
      kind: ip
  - tl.block:
      name: h
      track: Hellos
      start: 6
      end: 10
      text: 'missing: declared dead'
      state: error
      when: declare a neighbor
  - table.show:
      name: tm
      zone: bottom
      cols:
      - Timer
      - Gain
      - Cost
      rows:
      - - Short
        - fast detection
        - traffic and false alarms
      - - Long
        - calm and cheap
        - slow detection
    when: That leaves
- id: stages
  stage: state
  pdf: 7
  c:
  - Routing Convergence
  say: Detection is just the start, and it's local. Everybody else must then be told.
    Routing convergence is the whole transition, and it has four stages. Detect the
    change. Spread the news. Compute new routes. Install them in forwarding tables.
    If those take 30, 10, 5, and 15 milliseconds in sequence, the total is 60 milliseconds.
    Real stages can overlap, and each router's clock runs differently. But name the
    stages, before you blame the algorithm.
  moves:
  - clear: {}
  - tl.show:
      name: st
      zone: top
      tracks:
      - Convergence
      span:
      - 0
      - 60
      ticks:
      - 0
      - 30
      - 40
      - 45
      - 60
  - tl.block:
      name: st
      track: Convergence
      start: 0
      end: 30
      text: detect 30
      kind: ip
      when: Detect the change
  - tl.block:
      name: st
      track: Convergence
      start: 30
      end: 40
      text: tell
      kind: eth
      when: Spread the news
  - tl.block:
      name: st
      track: Convergence
      start: 40
      end: 45
      kind: transport
      when: Compute new
  - tl.block:
      name: st
      track: Convergence
      start: 45
      end: 60
      text: install
      kind: label
      when: Install them
  - tex:
      name: tot
      zone: bottom
      tex: 30+10+5+15=60\text{ ms}
      size: 46
- id: blackhole
  stage: animation
  pdf: 8
  c:
  - Forwarding Blackholes
  say: Watch the packets. A forwards traffic for D to B, and B forwards to D. The
    link from B to D fails. B knows, but A hasn't heard. A keeps sending to B, on
    its old and perfectly reasonable route. B has nothing usable, and those packets
    vanish. That's a forwarding blackhole. Note that A has not computed anything wrong.
    It's just working from old information.
  moves:
  - clear: {}
  - net.show: &id001
      name: n
      zone: left
      nodes:
        A:
          k: router
          at:
          - 0
          - 2
          l: A
          lp: left
        B:
          k: router
          at:
          - 4
          - 2
          l: B
          lp: right
        C:
          k: router
          at:
          - 0
          - 0
          l: C
          lp: left
        D:
          k: server
          at:
          - 4
          - 0
          l: D
          lp: right
      links:
      - - A
        - B
        - s: active
      - - B
        - D
        - s: active
      - - A
        - C
      - - C
        - D
  - net.state:
      name: n
      links:
      - - B
        - D
        - failed
      when: The link from B
  - packet.spawn:
      name: a1
      net: n
      at: A
      layers:
      - ip
      when: A keeps sending
  - packet.hop:
      name: a1
      to: B
  - packet.drop:
      name: a1
      when: those packets vanish
  - text:
      name: b
      zone: right
      lines:
      - A's route is old, not miscalculated
      - 'Blackhole: no working continuation'
      when: That's a forwarding
- id: loop
  stage: state
  pdf: 9
  c:
  - Transient Forwarding Loops
  say: B computes a new route for D. It goes back through A, then C, then D. And B
    installs that first, while A still points to B. So look at what happens now. A
    sends the packet to B. B sends it back to A. They bounce it between them. The
    old configuration had no loop. The new configuration has no loop. The mix of the
    two does. This is a transient forwarding loop. It isn't specific to any one protocol,
    and it can happen with link state, whenever routers install their changes at different
    times.
  moves:
  - net.badge:
      name: n
      node: B
      text: 'new: via A'
      side: down
      state: now
      when: And B installs
  - net.badge:
      name: n
      node: A
      text: 'old: via B'
      side: down
      state: error
  - packet.spawn:
      name: a2
      net: n
      at: A
      layers:
      - ip
      when: A sends the packet
  - packet.hop:
      name: a2
      to:
      - B
      - A
      - B
      - A
      t: 2.4
  - text:
      name: b
      zone: right
      lines:
      - 'Old state: no loop'
      - 'New state: no loop'
      - 'Mixed state: loop'
      color: now
      when: The old configuration
- id: consequences
  stage: state
  pdf: 10
  c:
  - Routing Convergence
  - Transient Forwarding Loops
  say: What does IP's TTL do here? It eventually kills the looping packet, but it
    doesn't save it, and until then, the loop eats up link capacity. Other packets
    may arrive out of order when old and new paths have different delays. So an application
    can suffer, even if a perfectly good alternate path exists the whole time.
  moves:
  - packet.drop:
      name: a2
  - rule:
      text: TTL ends a looping packet. It does not recover it, and the loop consumes
        capacity first.
- id: improve
  stage: rule
  pdf: 11
  c:
  - Routing Convergence
  - Failure Detection
  say: 'To improve convergence, work stage by stage. Detect faster. Send control messages
    promptly. Compute incrementally. Install changes efficiently. And keep the principle
    in mind: a faster processor cannot make up for waiting minutes to declare a neighbor
    dead. Find the slowest stage first.'
  moves:
  - clear: {}
  - bullets:
      name: im
      zone: top
      show: 4
      items:
      - Detect faster
      - Propagate control messages promptly
      - Compute incrementally
      - Install forwarding changes efficiently
  - rule:
      text: Improve the slowest stage first.
- id: pitfall
  stage: rule
  pdf: 11
  c:
  - Routing Convergence
  - Failure Detection
  say: 'A tempting thought: both the old tables and the new tables are correct, so
    no harm done. But correct before and after protects nobody in between. Packets
    can vanish or loop during the transition.'
  moves:
  - trap:
      wrong: Correct tables before and after mean no packet loss
      right: During the transition, packets can still vanish or loop
- id: changed
  stage: changed_example
  pdf: 9
  c:
  - Transient Forwarding Loops
  say: Change the install order. Same failure, same routers, but this time A installs
    its new route first, and goes through C directly. Then B installs its route, by
    way of A.
  moves:
  - clear: {}
  - net.show: *id001
  - net.state:
      name: n
      links:
      - - B
        - D
        - failed
      - - A
        - B
        - solid
      - - A
        - C
        - now
      - - C
        - D
        - now
  - net.badge:
      name: n
      node: A
      text: 'new: via C'
      side: up
      state: done
- id: predict
  stage: prediction
  pdf: 9
  hold: 6
  c:
  - Transient Forwarding Loops
  say: With that order, is there a loop? Is there still a blackhole, at any moment?
  moves:
  - pause:
      text: does this install order create a loop or a blackhole?
- id: answer
  stage: explanation
  pdf: 9
  c:
  - Transient Forwarding Loops
  - Forwarding Blackholes
  say: 'No loop forms, because A no longer sends to B. Traffic from A goes straight
    to C and D. Packets that reach B in the gap before it installs can still be lost,
    so B''s own blackhole lasts until it updates. Ordering changes which disruption
    you get. These problems come from timing, and they pass quickly. But one protocol
    family can make things far worse: nobody gets told the truth for a very long time.'
  moves:
  - packet.spawn:
      name: ok
      net: n
      at: A
      layers:
      - ip
  - packet.hop:
      name: ok
      to:
      - C
      - D
  - text:
      name: an
      zone: right
      lines:
      - 'No loop: A avoids B'
      - B may still drop until it installs
  - keep: {}
prediction_contracts:
- prediction_beat: 11.1.predict
  answer_beat: 11.1.answer
  answer_events:
  - 11.1.answer:move:0
  - 11.1.answer:move:1
  - 11.1.answer:move:2
  answer_objects:
  - object: ok
    after: 11.1.answer:move:0
    effect: packet.spawn
    selector: {}
    before_answer: hidden_or_neutral
  - object: ok
    after: 11.1.answer:move:1
    effect: packet.hop
    selector: {}
    before_answer: hidden_or_neutral
  - object: an
    after: 11.1.answer:move:2
    effect: text
    selector: {}
    before_answer: hidden_or_neutral
  review_scope: Inspect the listed answer objects for neutral or hidden state during
    the prediction hold.
