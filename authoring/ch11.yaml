- id: laptop
  stage: rule
  pdf: 34
  c:
  - Policy Oscillation
  say: For our laptop, all of this shows up as a stall or a gap. Its video freezes
    for a moment, and then recovers. The laptop did nothing wrong, and neither did
    its server. The network was changing its mind, or couldn't settle it.
  moves:
  - rule:
      text: To the laptop, this is just a stall. The network was changing its mind.
      when: For our laptop
- id: pitfall
  stage: rule
  pdf: 34
  c:
  - Policy Oscillation
  say: The trap with path exploration. A path with no AS loop can still be stale.
    No loop is a much weaker claim than, this path is still available now.
  moves:
  - trap:
      wrong: No AS loop means the path still works
      right: A loop-free path may already be gone
- id: changed
  stage: changed_example
  pdf: 34
  c:
  - Policy Oscillation
  say: Change one line of policy. Node 3 decides it will no longer prefer the path
    through node 2. It now ranks going direct first, with 320 second.
  moves:
  - table.set:
      name: bg
      r: 2
      c: 1
      v: 30
      state: now
  - table.set:
      name: bg
      r: 2
      c: 2
      v: 320
      state: now
- id: predict
  stage: prediction
  pdf: 34
  hold: 12
  c:
  - Stable Paths Problem
  say: Does that single change produce a stable solution? Work it out starting from
    node 3.
  moves:
  - pause:
      text: is there now a stable solution? start from node 3.
      long: true
- id: answer
  stage: explanation
  pdf: 36
  c:
  - Stable Paths Problem
  - Policy Oscillation
  say: Yes. Node 3 uses 30, and never moves. So node 1's favorite, 130, is always
    available, and node 1 uses it. Node 2 then can't use 210, and so it goes direct,
    on 20. Everyone's happy, and nothing changes. One local preference broke the cycle.
    So the trouble isn't BGP's messages, it's the combination of rankings. Then what
    real-world force keeps the Internet's policies from forming these cycles? The
    answer is money. Let us see how BGP really works, and how business relationships
    shape it.
  moves:
  - net.badge:
      name: b
      node: n3
      text: '30'
      side: down
      state: done
  - net.badge:
      name: b
      node: n1
      text: '130'
      side: down
      state: done
  - net.badge:
      name: b
      node: n2
      text: '20'
      side: up
      state: done
  - rule:
      text: 'Stability depends on how rankings combine. Next: what shapes real rankings?'
      when: So the trouble
  - keep: {}
