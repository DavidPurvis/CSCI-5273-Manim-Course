- id: slide-bad
  stage: state
  pdf: 17
  c: &id001
  - Count to Infinity
  say: Make it worse, raising X to Y from 4 to 60. Y compares a direct cost of 60
    with Z's old claim of 5, through a link of 1, for a total of 6. It picks 6, through
    Z, not knowing that Z's 5 ran through Y. Z hears 6, and computes 7. Y hears 7,
    and computes 8.
  moves:
  - net.cost:
      name: tri
      a: Y
      b: X
      cost: 60
      when: raising X to Y
