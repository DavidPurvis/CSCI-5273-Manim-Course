      state: done
      when: node 2 falls back
- id: solve-2
  stage: state
  pdf: 31
  c: *id001
  say: Node 4 prefers 420, and node 2 does use 20, so 420 works. Node 5 allows only
    5210. That needs node 2 on 210, which it isn't. So node 5 has no path, even though
    it's physically connected to node 2. The slide asks two questions. Will node 1
    use a direct path? False. Does node 5 have a path? False.
  moves:
  - table.mark:
      name: ranks
      r: 3
      state: done
      when: Node 4 prefers
  - net.badge:
