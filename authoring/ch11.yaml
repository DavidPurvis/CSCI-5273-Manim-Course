      side: right
      state: error
      when: So node 5
- id: multi
  stage: state
  pdf: 32
  c:
  - Stable Paths Problem
  - Policy Oscillation
  say: That instance has exactly one solution. Others don't. Take two nodes, each
    preferring to reach the destination through the other. Node 1 likes 120 best,
    and node 2 likes 210 best. There are two stable outcomes. Node 1 goes through
    node 2, while 2 goes direct. Or the reverse. Which one you get depends on who
    speaks first. Same policies, same links, different result.
  moves:
  - clear: {}
  - net.show:
