        - $convergence.bad_news_start.1.Z
      - - Z updates
        - $convergence.bad_news_start.2.Y
        - $convergence.bad_news_start.2.Z
      - - Finally
        - $convergence.bad_news_final.final_y
        - $convergence.bad_news_final.final_z
      show: 1
      size: 28
  - table.reveal:
