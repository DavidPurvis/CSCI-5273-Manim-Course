  pdf: 34
  c:
  - Customer-Provider Relationships
  say: Networks are businesses. Carrying traffic costs money, and some of it pays
    and some doesn't. If you ran a network, whose traffic would you carry for free?
    Whose routes would you repeat? Those two business questions end up explaining
    most of Internet routing.
  moves:
