- id: hot
  stage: state
  pdf: 25
  c:
  - Hot-Potato Routing
  say: 'That third step has a nickname: hot-potato routing. When outside attributes
    tie, hand the traffic off at the nearest exit, and spend as little of your own
    network as possible. Picture a network with exits on the west and east coasts.
    A router with internal costs 4 and 9 picks west. A router on the other side, with
    costs 12 and 3, picks east. Each one minimizes its own carrying cost. And so the
    return path, chosen by a different network with its own hot potatoes, may take
    a different route. Internet paths are often asymmetric for just this reason.'
  moves:
  - clear: {}
  - net.show:
      name: h
      zone: top
      nodes:
