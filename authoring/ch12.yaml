- id: answer
  stage: explanation
  pdf: 41
  c:
  - BGP Export Policy
  - Customer-Provider Relationships
  - Peering
  say: 'P''s route goes only to customer C. Telling U would have A carrying traffic
    between its provider and its peer. C''s route goes to everyone: U, P, and C itself
    has it already. That''s exactly the reachability A is being paid to spread. So
    far, every packet has had one destination. But what if one address should mean
    several servers? Or what if a thousand receivers all want the same stream? Our
    next chapter changes who a destination is.'
  moves:
  - table.show:
      name: an
      zone: right
      cols:
      - Route from
      - Told to
      rows: &id002
      - - Peer P
        - customer C only
      - - Customer C
        - provider U and peer P
      show: 0
  - msg.send:
      name: a
      a: A
      b: C
      text: P's route
      when: P's route goes
  - table.reveal:
      name: an
  - net.state:
