      - - A
        - U
        - blocked
      when: Telling U
  - net.state:
      name: a
      links:
      - - A
        - U
        - up
      when: C's route goes
  - msg.send:
      name: a
      a: A
      b: U
      text: C's route
      t: 1.1
  - msg.send:
      name: a
      a: A
      b: P
      text: C's route
      t: 1.1
  - table.reveal:
      name: an
  - clear:
      when: So far, every
  - q:
