dish: '12.1'
title: What BGP carries
deck: lec12-bgp.pdf
target_min: 5.5
concepts:
- Autonomous Systems
- BGP
- AS Path
beats:
- id: question
  stage: question
  pdf: 3
  c:
  - Autonomous Systems
  - BGP
  say: Our laptop's packet to the web server has so far crossed two friendly routers.
    On the real Internet, it would cross networks owned by companies that compete
    with each other, each one keeping its internal design private, and each one with
    its own idea of what a good route means. How can those rivals still cooperate
    well enough to deliver a packet? There's exactly one protocol doing this job across
    the whole planet, and we need to see what it actually says.
  moves:
  - heading:
      text: 'Lecture 12: what BGP carries'
  - spine:
      current: Policy
      zone: top
  - q:
      text: How do rival networks cooperate to deliver one packet?
      zone: bottom
- id: laptop
  stage: animation
  pdf: 3
  c:
  - Autonomous Systems
  - BGP
  say: Our laptop's server sits in a different network from the laptop, run by a different
    company. Everything we've built so far works inside one organization. So who tells
    R2's network that the server's prefix even exists, and why would they agree to
    carry it?
  moves:
  - clear: {}
  - net.show:
      name: lp
      zone: top
      nodes:
        L:
          k: laptop
          at:
          - 0
          - 0
          l: Laptop
        A:
          k: router
          at:
          - 3.4
          - 0
          l: R1
        B:
          k: router
          at:
          - 6.8
          - 0
          l: R2
        W:
          k: server
          at:
          - 10.2
          - 0
          l: Web server
      links:
      - - L
        - A
      - - A
        - B
      - - B
        - W
  - net.state:
      name: lp
      nodes:
        W: now
      when: Our laptop's server
  - net.state:
      name: lp
      nodes:
        W: null
        B: now
      when: So who tells
  pre_roll: 2.0
- id: history
  stage: animation
  pdf: 3
  c:
  - BGP
  say: A little context. The Internet's interdomain routing protocol is BGP, and it's
    been in use, in revised versions, since the early days of the commercial Internet.
    It's a path-vector protocol, the very idea from chapter 6. Now we can fill in
    how it really works.
  moves:
  - clear: {}
  - text:
      name: hist
      zone: top
      lines:
      - 'BGP: the Internet''s interdomain routing protocol'
      - A path-vector protocol, as in chapter 6
- id: as
  stage: animation
  pdf: 4
  c:
  - Autonomous Systems
  say: The unit of cooperation is the autonomous system, or AS. That's a set of networks
    under one routing administration, identified by a number. A university, an Internet
    provider, or a content company can each be an AS. Inside, it may run many routers,
    using OSPF or IS-IS, and that's nobody else's business. From the outside, we draw
    it as a single cloud. This is an abstraction with a price, which we'll get to
    in a moment.
  moves:
  - clear: {}
  - net.show:
      name: w
      zone: top
      nodes:
        A:
          k: cloud
          at:
          - 0
          - 0
          l: AS 100
        B:
          k: cloud
          at:
          - 4
          - 0
          l: AS 200
        C:
          k: cloud
          at:
          - 8
          - 0
          l: AS 300
      links:
      - - A
        - B
      - - B
        - C
  - text:
      name: as
      zone: bottom
      lines:
      - One routing administration, one AS number
      - 'Internals stay private: outsiders see a cloud'
      when: Inside, it may
- id: session
  stage: animation
  pdf: 5
  c:
  - BGP
  say: 'BGP, the Border Gateway Protocol, is what those clouds speak to each other.
    Two routers open a TCP connection on port 179, called a session. First they exchange
    all their active routes. After that they send only changes: announcements of new
    routes, and withdrawals of old ones. That makes it an incremental protocol. It''s
    also prefix based, so what it advertises is reachability to a block of addresses,
    like 203.0.113.0/24, not to individual machines.'
  moves:
  - clear: {}
  - seq.show:
      name: s
      zone: left
      lanes:
      - Router X
      - Router Y
      steps: 4
  - seq.msg:
      name: s
      a: Router X
      b: Router Y
      text: TCP port 179
      kind: transport
      when: Two routers open
  - seq.msg:
      name: s
      a: Router X
      b: Router Y
      text: all active routes
      kind: ip
      when: First they exchange
  - seq.msg:
      name: s
      a: Router Y
      b: Router X
      text: announce
      kind: ip
      when: announcements of
  - seq.msg:
      name: s
      a: Router Y
      b: Router X
      text: withdraw
      kind: ip
      state: error
      when: withdrawals of
  - text:
      name: t
      zone: right
      lines:
      - 'Reachability is per prefix:'
      - 203.0.113.0/24
      when: It's also prefix
- id: route
  stage: state
  pdf: 7
  c:
  - AS Path
  - BGP
  say: What exactly is a BGP route? It's a prefix, plus attributes. Two matter most
    right now. AS PATH is the list of autonomous systems the route has passed through.
    NEXT HOP says which IP address to send toward. Watch how the path grows. AS 300
    owns the prefix, and it tells AS 200 the path is just 300. AS 200 adds itself,
    and tells AS 100 that the path is 200, 300.
  moves:
  - clear: {}
  - net.show:
      name: w
      zone: top
      nodes:
        A:
          k: cloud
          at:
          - 0
          - 0
          l: AS 100
        B:
          k: cloud
          at:
          - 4
          - 0
          l: AS 200
        C:
          k: cloud
          at:
          - 8
          - 0
          l: AS 300
      links:
      - - A
        - B
      - - B
        - C
  - table.show:
      name: r
      zone: bottom
      cols:
      - Attribute
      - Value at AS 100
      rows:
      - - Prefix
        - 203.0.113.0/24
      - - AS_PATH
        - 200, 300
      - - NEXT_HOP
        - AS 200's border router
  - net.badge:
      name: w
      node: B
      text: 'path: 300'
      side: up
      when: AS 300 owns
  - net.badge:
      name: w
      node: A
      text: 'path: 200, 300'
      side: up
      when: AS 200 adds
- id: loopcheck
  stage: rule
  pdf: 8
  c:
  - AS Path
  say: Inside that list is our loop check from before. A receiving AS looks for its
    own number, and if it's there, the route is rejected. That handles one kind of
    consistency. We've already seen that it doesn't prevent path exploration or policy
    oscillation.
  moves:
  - rule:
      text: See your own AS number in the path? Reject the route.
- id: abstraction
  stage: state
  pdf: 10
  c:
  - AS Path
  - Autonomous Systems
  say: The price of the abstraction. Is a shorter AS path a shorter route? Not necessarily.
    Here are two options. One crosses 2 ASes, but each contains a long chain of routers.
    The other crosses 3 ASes, each with only one or two routers. Measured in router
    hops, the 3 AS path is the shorter of the two. And it says nothing at all about
    delay. AS path length counts organizations, not distance.
  moves:
  - clear: {}
  - table.show:
      name: cmp
      zone: top
      cols:
      - Path
      - AS hops
      - Router hops
      rows:
      - - Via two big clouds
        - 2
        - 9
      - - Via three small clouds
        - 3
        - 5
  - rule:
      text: AS path length counts organizations, not routers and not delay.
- id: pitfall
  stage: rule
  pdf: 10
  c:
  - AS Path
  - Autonomous Systems
  say: Don't read too much into AS path length. It counts networks, not routers. It
    says nothing about latency or capacity, and prepending can make it artificial.
  moves:
  - trap:
      wrong: A shorter AS path means fewer routers or lower delay
      right: AS length counts networks, not routers, latency, or capacity
- id: changed
  stage: changed_example
  pdf: 8
  c:
  - AS Path
  say: You try. AS 200 gets an offer of 300, 500. It passes that along to AS 100,
    and AS 500 is also a neighbor of AS 100. Suppose AS 100 then re-advertises its
    path to AS 500.
  moves:
  - text:
      name: q
      zone: bottom
      lines:
      - 'AS 200 received: 300, 500'
      - AS 100 will advertise to AS 500
- id: predict
  stage: prediction
  pdf: 8
  hold: 6
  c:
  - AS Path
  say: What is the path list when it reaches AS 500? And what will AS 500 do with
    it?
  moves:
  - pause:
      text: what path does AS 500 receive, and what does it do?
- id: answer
  stage: explanation
  pdf: 8
  c:
  - AS Path
  - BGP
  say: 'AS 500 receives 100, 200, 300, 500. It sees its own number at the end, and
    it rejects the route. Notice one thing we still haven''t said: when AS 100 has
    several acceptable routes, how does it pick? And who decides which neighbors hear
    about the choice? That isn''t physics, and it isn''t shortest paths. It''s policy.'
  moves:
  - text:
      name: q
      zone: bottom
      lines:
      - 'AS 500 receives: 100, 200, 300, 500'
      - It sees 500 and rejects the route
  - rule:
      text: 'Next: how does an AS choose, and whom does it tell?'
  - keep: {}
prediction_contracts:
- prediction_beat: 12.1.predict
  answer_beat: 12.1.answer
  answer_events:
  - 12.1.answer:move:0
  - 12.1.answer:move:1
  answer_objects:
  - object: q
    after: 12.1.answer:move:0
    effect: text
    selector: {}
    before_answer: hidden_or_neutral
  - object: _rule
    after: 12.1.answer:move:1
    effect: rule
    selector: {}
    before_answer: hidden_or_neutral
  review_scope: Inspect the listed answer objects for neutral or hidden state during
    the prediction hold.
