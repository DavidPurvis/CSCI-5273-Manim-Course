- id: gao-2
  stage: rule
  pdf: 39
  c: *id001
  say: Its cycle needs each network to prefer a route through its neighbor, around
    a ring. Under these rules, that ring of preferences can't form. Those are sufficient
    conditions in the model. They aren't a claim that every BGP deployment follows
    them, or that every stable network must. Still, it's striking. No one coordinates
    globally. Each business pursues its own interest, and the system tends to settle.
  moves:
