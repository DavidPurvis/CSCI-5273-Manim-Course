  stage: state
  pdf: 36
  c:
  - Customer-Provider Relationships
  - Autonomous Systems
  say: Those contracts stack up into a structure. At the top are Tier 1 providers,
    with no upstream provider at all, connected to each other as peers. Below them
    are other providers, which sell transit to customers, but must buy it from someone.
    At the bottom are stub ASes, which provide no transit, and those are the vast
    majority. And this graph has a key property. It's directed and acyclic. If u is
    a customer of v, and v is a customer of w, then w isn't a customer of u. Remember
    that when we come to stability.
