  - keep: {}
- id: rel
  stage: animation
  pdf: 35
  c:
  - Customer-Provider Relationships
  - Peering
  say: There are two main relationships. In a customer-provider link, the customer
    pays the provider for connectivity to the rest of the Internet. We draw the arrow
    pointing from customer up to provider. In peering, two networks exchange traffic,
    typically without payment, but only for themselves and their customers. A peer
    isn't offering you transit to the world. It's only offering you what's below it.
  moves:
