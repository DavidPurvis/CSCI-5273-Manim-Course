- id: decide
  stage: state
  pdf: 26
  c:
  - Local Preference
  say: 'Try three routes for one prefix. A has local preference 140, length 4, and
    exit cost 50. B has 100, length 2, and cost 5. C has 100, length 2, and cost 1.
    With all three available, A wins immediately on preference, despite being the
    worst by every other number. Withdraw A. B and C tie on preference, and tie on
    length, so internal cost decides: C wins. Now shorten B''s path to length 1. B
    beats C at step two, and its higher exit cost never gets compared.'
