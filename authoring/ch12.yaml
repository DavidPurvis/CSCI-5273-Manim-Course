dish: '12.2'
title: Import and export
deck: lec12-bgp.pdf
target_min: 5.5
concepts:
- BGP Import Policy
- BGP Export Policy
- Local Preference
- AS Path Prepending
beats:
- id: question
  stage: question
  pdf: 12
  c:
  - BGP Import Policy
  - BGP Export Policy
  say: A neighbor hands you a route. Do you have to believe it? Do you have to use
    it? If you use it, must you tell everyone else? With BGP, the answer to all three
    questions is no. Those are three separate decisions, and getting them apart is
    the key to the whole protocol.
  moves:
  - heading:
      text: 'Lecture 12: import and export'
  - q:
      text: Must you believe, use, or repeat a route you're given?
- id: pipeline
  stage: animation
  pdf: 13
  c:
  - BGP Import Policy
  - BGP Export Policy
  say: The pipeline in every BGP router. Routes arrive from neighbors. Import policy
    filters them, and may change their attributes. Best-route selection picks one
    route per prefix for use. That route goes into forwarding. Then export policy
    decides, separately for each neighbor, what to advertise. Because the stages are
    separate, a route rejected at import never becomes a candidate. A route suppressed
    at export can still be the one you use yourself.
  moves:
  - clear: {}
  - net.show:
      name: p
      zone: top
      nodes:
        a:
          k: box
          at:
          - 0
          - 0
          l: Received
        b:
          k: box
          at:
          - 3.2
          - 0
          l: Import
        c:
          k: box
          at:
          - 6.4
          - 0
          l: Select best
        d:
          k: box
          at:
          - 9.8
          - 1
          l: Forwarding
        e:
          k: box
          at:
          - 9.8
          - -1
          l: Export
      links:
      - - a
        - b
      - - b
        - c
      - - c
        - d
      - - c
        - e
  - packet.spawn:
      name: r
      net: p
      at: a
      layers:
      - label
      when: Routes arrive
  - packet.hop:
      name: r
      to: b
      when: Import policy
  - packet.hop:
      name: r
      to: c
      when: Best-route selection
  - packet.flood:
      name: r
      to:
      - d
      - e
      when: That route goes
  - rule:
      text: Import, selection, and export are three separate decisions.
      when: Because the stages
- id: import
  stage: state
  pdf: 15
  c:
  - BGP Import Policy
  say: Import first. Why would you ever reject a route? Say your customer owns one
    prefix, and suddenly announces a route to a big video site. That's either a configuration
    mistake, or an attack. Believing it would pull the world's traffic into your customer's
    network. So on a session to a customer, a network commonly accepts only the prefixes
    that customer actually holds. An advertisement is data to evaluate, not an order.
  moves:
  - clear:
      keep:
      - _rule
  - table.show:
      name: f
      zone: top
      cols:
      - Customer announces
      - Holds it?
      - Import
      rows:
      - - Its own 203.0.113.0/24
        - 'yes'
        - accept
      - - A video site's prefix
        - 'no'
        - reject
      show: 0
  - table.reveal:
      name: f
      when: Say your customer
  - table.reveal:
      name: f
      when: suddenly announces
  - table.mark:
      name: f
      r: 1
      state: error
      when: Believing it
  - table.mark:
      name: f
      r: 0
      state: done
      when: So on a session
  - rule:
      text: An advertisement is data to evaluate, not an order.
      when: An advertisement
- id: lp
  stage: state
  pdf: 14
  c:
  - Local Preference
  say: Import can also attach a value called local preference. It's a number used
    only inside your own AS, and higher is better. It's checked before anything else,
    so it directly states your own ranking. For example, you might set 100 on routes
    from a customer, and 90 on routes from a peer, because customers pay you, and
    carrying traffic to them earns money. Compare. A customer route with local preference
    100 and an AS path of 4, against a peer route with local preference 90 and an
    AS path of 2. The customer route wins. Length is never even looked at.
  moves:
  - sieve.show:
      name: c
      zone: bottom
      rungs:
      - Local preference
      - AS path length
      routes:
      - name: Customer
        vals:
        - 100
        - 4
      - name: Peer
        vals:
        - 90
        - 2
      when: For example
  - sieve.step:
      name: c
      rung: 0
      keep:
      - Customer
      when: A customer route with
  - sieve.win:
      name: c
      route: Customer
      unused:
      - 1
      when: The customer route wins
- id: export
  stage: state
  pdf: 16
  c:
  - BGP Export Policy
  say: 'The other end of the pipeline. Export policy decides what each neighbor gets
    to hear. Why not tell everyone everything? Because telling a neighbor about a
    route is an offer: send your traffic through me, and I''ll carry it. Advertising
    a route is promising to do work. So a network can use a route itself, while deliberately
    keeping it from a neighbor. Using a route and offering transit are different acts.'
  moves:
  - clear: {}
  - net.show:
      name: e
      zone: top
      nodes:
        X:
          k: cloud
          at:
          - 4
          - 0
          l: Our AS
        A:
          k: cloud
          at:
          - 0
          - 0
          l: Neighbor A
        B:
          k: cloud
          at:
          - 8
          - 0
          l: Neighbor B
      links:
      - - A
        - X
      - - X
        - B
        - s: blocked
  - msg.send:
      name: e
      a: X
      b: A
      text: route offer
      when: Export policy
  - msg.send:
      name: e
      a: X
      b: A
      text: send through me
      when: Because telling
  - net.state:
      name: e
      nodes:
        X: now
      when: Advertising a route
  - rule:
      text: An advertisement is an offer to carry traffic. Using a route is not offering
        it.
  - net.state:
      name: e
      nodes:
        B: candidate
      when: So a network
- id: prepend
  stage: state
  pdf: 18
  c:
  - AS Path Prepending
  say: Export can also change how a route looks. Suppose you have two links to the
    Internet, and want incoming traffic on just one of them. You can't control anybody
    else's decision. But you can make one option look worse. AS path prepending repeats
    your own number. Instead of announcing 300, you announce 300, 300, 300 over the
    backup link. Remote networks comparing path lengths will tend to choose the other
    link. Tend to, because prepending can't force anything. A remote network's local
    preference is checked first, and it could still ignore you.
  moves:
  - fade:
      names: _rule
  - net.state:
      name: e
      nodes:
        X: null
        B: null
  - net.badge:
      name: e
      node: A
      text: Primary
      side: down
      when: Suppose you have
  - net.badge:
      name: e
      node: B
      text: Backup
      side: down
  - table.show:
      name: pp
      zone: bottom
      cols:
      - Link
      - Announced path
      - Apparent length
      rows:
      - - Primary
        - '300'
        - 1
      - - Backup
        - 300, 300, 300
        - 3
      show: 0
      when: AS path prepending
  - table.reveal:
      name: pp
      when: Instead of announcing
  - msg.send:
      name: e
      a: X
      b: A
      text: '300'
  - table.reveal:
      name: pp
  - msg.send:
      name: e
      a: X
      b: B
      text: 300, 300, 300
      when: over the backup
  - net.state:
      name: e
      links:
      - - A
        - X
        - active
      when: Remote networks
  - net.state:
      name: e
      nodes:
        B: now
      when: A remote network's
- id: rule
  stage: rule
  pdf: 18
  c:
  - Local Preference
  - AS Path Prepending
  say: Keep these two tools straight. Local preference ranks routes within your own
    AS, and it controls your outgoing traffic. Prepending changes what others see,
    so it only influences your incoming traffic. One is a decision. The other is a
    suggestion.
  moves:
  - clear: {}
  - bullets:
      name: two
      zone: top
      show: 0
      items:
      - 'Local preference: your outgoing traffic'
      - 'Prepending: your incoming traffic'
  - reveal:
      name: two
      when: Local preference ranks
  - reveal:
      name: two
      when: Prepending changes
  - rule:
      text: Local preference decides your outgoing traffic. Prepending suggests your
        incoming traffic.
      when: One is a decision
- id: config
  stage: rule
  pdf: 19
  c:
  - BGP Export Policy
  - BGP Import Policy
  say: Where do all these policies live? Administrators write them, per neighbor,
    in router configuration. That's a lot of manual work, spread over many routers
    and many people, and mistakes do happen. A configuration error can be visible
    across the entire Internet.
  moves:
  - fade:
      names: two
  - bullets:
      name: cfg
      zone: top
      show: 0
      items:
      - Policies are written per neighbor, by people
      - A mistake can be visible everywhere
  - reveal:
      name: cfg
      when: Administrators write
  - reveal:
      name: cfg
      when: A configuration error
- id: pitfall
  stage: rule
  pdf: 19
  c:
  - BGP Export Policy
  - BGP Import Policy
  say: A common mistake is to weigh these numbers against each other. There's no trade
    between preference and path length. Preference is compared first, and length matters
    only if preference ties.
  moves:
  - trap:
      wrong: Trade one unit of preference for one AS hop
      right: 'Compare in order: preference first, length only on a tie'
- id: changed
  stage: changed_example
  pdf: 14
  c:
  - Local Preference
  say: A situation. Network A prepends heavily on its link to provider P, hoping traffic
    will arrive by way of provider Q instead. But a far-off network, Z, assigns a
    high local preference to routes learned through P.
  moves:
  - clear: {}
  - net.show:
      name: z
      zone: top
      nodes:
        A:
          k: cloud
          at:
          - 0
          - 0.8
          l: A
        P:
          k: cloud
          at:
          - 4
          - 1.6
          l: P
        Q:
          k: cloud
          at:
          - 4
          - 0
          l: Q
        Z:
          k: cloud
          at:
          - 8
          - 0.8
          l: Z
      links:
      - - A
        - P
        - s: dim
      - - A
        - Q
      - - P
        - Z
      - - Q
        - Z
  - net.state:
      name: z
      nodes:
        A: now
      when: Network A prepends
  - net.badge:
      name: z
      node: Z
      text: high preference for P
      side: down
      state: now
      when: But a far-off
- id: predict
  stage: prediction
  pdf: 18
  hold: 6
  c:
  - AS Path Prepending
  say: Which way does Z's traffic arrive at A? And did the prepending do anything
    at all?
  moves:
  - pause:
      text: which way does Z's traffic reach A?
- id: answer
  stage: explanation
  pdf: 18
  c:
  - AS Path Prepending
  - Local Preference
  say: It arrives through P, the path A was trying to discourage, because Z compares
    local preference first, and never reaches the length comparison. Prepending may
    still influence others who have tied preferences. So that's the outside view of
    an AS. But an AS isn't really one node. It's a set of routers with their own geography.
    How do they agree on what to do?
  moves:
  - net.walk:
      name: z
      path:
      - Z
      - P
      - A
      when: It arrives through
  - rule:
      text: Z's local preference is compared before A's prepended length.
      when: because Z compares
  - net.state:
      name: z
      nodes:
        Q: candidate
      when: Prepending may
  - clear:
      when: So that's the outside
  - q:
      text: An AS isn't one node. How do its routers agree?
  - keep: {}
