      when: It can use
  - table.mark:
      name: d
      r: 1
      state: now
  - table.mark:
      name: d
      r: 0
      state: done
      when: Any longer prefix
- id: pitfall
  stage: rule
  pdf: 30
  c:
  - Default Routes
  say: The classic confusion. A BGP next hop isn't necessarily the neighbor you hand
    the frame to. It can be several routers away, so it has to be resolved through
    internal routing.
  moves:
  - trap:
      wrong: The BGP next hop is always the next router
      right: 'It may be several hops away: resolve it first'
- id: changed
  stage: changed_example
  pdf: 25
  c:
  - Hot-Potato Routing
  say: Change the costs. Internal maintenance raises router R's cost to the west exit
    from 4 to 11. Its east cost stays at 9. Nothing outside the AS has changed.
  moves:
  - net.cost:
      name: h
      a: R
      b: W
      cost: 11
      when: Internal maintenance
  - net.state:
      name: h
      nodes:
        R: now
- id: predict
  stage: prediction
  pdf: 25
  hold: 6
  c:
  - Hot-Potato Routing
  say: Does R's exit change? And does some neighbor network now see traffic it wasn't
    seeing before?
  moves:
  - pause:
      text: does R's exit change? who outside notices?
- id: answer
  stage: explanation
  pdf: 25
  c:
  - Hot-Potato Routing
  - BGP Next-Hop Resolution
  say: Yes. R now prefers east, at 9. Its traffic moves to a different exit, and possibly
    to a different neighbor network. An internal change shifted traffic outside the
    AS. That's the coupling between BGP and the internal protocol. We've now covered
    how the decision works. But why do networks set these preferences in the first
    place? Because each link between two networks has a contract, and someone pays.
  moves:
  - net.state:
      name: h
      links:
      - - R
        - W
        - dim
      - - R
        - E
        - tree
      nodes:
        R: done
      when: R now prefers
  - net.pulse:
      name: h
      path:
      - R
      - E
      when: Its traffic moves
  - rule:
      text: An internal cost change can move traffic to a different neighbor.
      when: An internal change
  - keep: {}
