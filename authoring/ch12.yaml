      nodes:
        C: null
        Q: now
      when: A peer isn't
  - rule:
      text: Customer pays provider. Peers exchange only their own and their customers'
        traffic.
- id: export
  stage: rule
  pdf: 41
  c:
  - Customer-Provider Relationships
  - Peering
  - BGP Export Policy
  say: From these contracts comes one question that decides every export. Would this
    make me carry traffic between two networks, when neither is my customer? If a
    route came from a customer, or it's my own, then I tell everyone, because traffic
    toward it earns me money. If it came from a peer or a provider, I tell only my
    customers. Telling a provider about my peer's route would invite my provider to
    send traffic through me, to my peer, for free, while I pay for it. So read the
    table. Own and customer routes go everywhere. Peer and provider routes go only
    to customers.
  moves:
  - clear: {}
  - table.show:
      name: ex
      zone: top
      data: $bgp.export
      show: 0
  - rule:
      text: Would this make me carry traffic between two non-customers? Then don't
        advertise it.
