dish: '12.3'
title: Inside an AS
deck: lec12-bgp.pdf
target_min: 6
concepts:
- eBGP
- iBGP
- BGP Next-Hop Resolution
- Hot-Potato Routing
- Default Routes
beats:
- id: question
  stage: question
  pdf: 21
  c:
  - eBGP
  - iBGP
  say: We've been drawing each AS as a dot. But a large provider has hundreds of routers
    across a continent, and it may hear about the same destination at several different
    border routers. How do all its internal routers learn about that, and how does
    each one pick an exit?
  moves:
  - heading:
      text: 'Lecture 12: inside an AS'
  - q:
      text: An AS is not one node. How do its routers pick an exit?
- id: ibgp
  stage: animation
  pdf: 22
  c:
  - eBGP
  - iBGP
  say: A BGP session between different ASes is called eBGP, for external. A session
    between routers within the same AS is iBGP, for internal. Here's the flow. Border
    router R1 learns a route over eBGP. It passes this along to R2 and R3 over iBGP.
    Now all of them know the route. Note that internal routers don't add their AS
    number again as the update moves around inside.
  moves:
  - clear: {}
  - net.show:
      name: i
      zone: full
      nodes:
        X:
          k: cloud
          at:
          - 0
          - 1
          l: AS 300
        R1:
          k: router
          at:
          - 3.5
          - 1
          l: R1
        R2:
