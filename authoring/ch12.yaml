- id: igp
  stage: state
  pdf: 23
  c:
  - iBGP
  say: And iBGP does not replace the internal routing protocol. It says that a destination
    is reachable through a certain exit. But it doesn't say how to get across your
    own network to that exit. That's still the job of OSPF or IS-IS. BGP and the IGP
    solve two halves of one problem.
  moves:
  - net.state:
      name: i
      nodes:
        R2: now
      when: It says that
  - net.state:
      name: i
      nodes:
        R1: done
  - net.walk:
      name: i
      path:
      - R2
      - R3
      - R1
      when: how to get across
  - rule:
      text: BGP names the exit. The internal protocol finds the way to that exit.
      when: BGP and the IGP
- id: nexthop
  stage: state
  pdf: 29
  c:
  - BGP Next-Hop Resolution
  say: 'How those halves are joined. BGP says: 203.0.113.0/24 has next hop 192.0.2.9.
    But that router may be several hops away. So the router looks up 192.0.2.9 in
    its internal routes, and finds it goes through neighbor 198.51.100.2 on port 3.
    It combines the two, and installs: 203.0.113.0/24 goes through 198.51.100.2 on
    port 3. A BGP next hop isn''t necessarily a directly connected neighbor. It has
    to be resolved first.'
  moves:
  - clear: {}
  - table.show:
      name: bg
      zone: top
      cols:
      - Table
      - Key
      - Gives
      rows:
      - - BGP
        - 203.0.113.0/24
        - next hop 192.0.2.9
      - - Internal
        - 192.0.2.9
        - 198.51.100.2, port 3
      - - Forwarding
        - 203.0.113.0/24
        - 198.51.100.2, port 3
      show: 0
  - table.reveal:
      name: bg
      when: BGP says
  - table.reveal:
