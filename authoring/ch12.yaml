      when: So the router
  - table.reveal:
      name: bg
      when: It combines
  - table.mark:
      name: bg
      r: 2
      state: done
  - rule:
      text: Resolve the BGP next hop through internal routing before forwarding.
      when: A BGP next hop
- id: order
  stage: rule
  pdf: 24
  c:
  - Local Preference
  - Hot-Potato Routing
  say: Now the decision process can be stated in full, in the lecture's simplified
    order. Highest local preference. Then shortest AS path. Then lowest internal cost
    to the exit. Then a tie break. Compare in order, and stop as soon as one route
    remains. These are not added into a score. There's no formula that combines them.
