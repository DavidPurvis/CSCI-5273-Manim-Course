  - rule:
      text: 'Hot potato: when earlier attributes tie, use the nearest exit. Paths
        may be asymmetric.'
      when: Internet paths
- id: default
  stage: state
  pdf: 30
  c:
  - Default Routes
  say: 'Does every router need all those routes? No. A customer with a single provider
    has only one way out. It can use a default route: a slash 0, matching everything,
    pointing at the provider. Any longer prefix beats it. So a stub network, or an
    internal router at the edge, can hold a very small table. Full tables belong where
    real choices exist, not everywhere.'
  moves:
  - table.show:
      name: d
      zone: bottom
      cols:
      - Prefix
      - Next hop
      rows:
      - - 192.0.2.0/24
        - local
      - - 0.0.0.0/0
        - provider
      show: 1
      when: A customer with
  - table.reveal:
