dish: '7.1'
title: What the network promises
deck: lec07-network1.pdf
target_min: 6
concepts:
- Packet Switching
- Circuit Switching
- Statistical Multiplexing
- Best-Effort Service
- Network Planes
- Software-Defined Networking
- QoS Service Models
- ATM Constant Bit Rate
- ATM Available Bit Rate
- Integrated Services
- Differentiated Services
beats:
- id: question
  stage: question
  pdf: 4
  c:
  - Packet Switching
  say: 'Our laptop''s frame has reached the edge of its LAN. Beyond that lie thousands
    of networks, built by different owners, from different hardware. What should the
    network as a whole promise to deliver? A guaranteed rate? Guaranteed order? Or
    almost nothing at all? The surprising answer that built the Internet is: almost
    nothing.'
  moves:
  - heading:
      text: 'Lecture 7: what the network promises'
  - spine:
      current: IP
      zone: top
  - q:
      text: What should a network of networks actually promise?
      zone: bottom
- id: circuit
  stage: animation
  pdf: 8
  c:
  - Circuit Switching
  say: 'One design comes from the telephone network: circuit switching. Before any
    data moves, set up a path, and reserve capacity at each hop. Once it is established,
    the bandwidth is yours. Quality is predictable. But if you pause, nobody else
    may use your reserved share, and every switch has to remember your call.'
  moves:
  - clear: {}
  - tl.show:
      name: link
      zone: top
      tracks:
      - Circuit
      - Packet
      span:
      - 0
      - 12
  - tl.block:
      name: link
      track: Circuit
      start: 0
      end: 1
      text: setup
      kind: data
  - tl.block:
      name: link
      track: Circuit
      start: 1
      end: 3
      text: A
      kind: ip
  - tl.block:
      name: link
      track: Circuit
      start: 3
      end: 6
      text: idle, reserved
      state: idle
      when: But if you pause
  - tl.block:
      name: link
      track: Circuit
      start: 6
      end: 8
      text: A
      kind: ip
- id: circuit-more
  stage: state
  pdf: 8
  c:
  - Circuit Switching
  say: Put numbers on the waste. A 1 megabit per second circuit reserved for ten seconds
    allocates up to 10 megabits. If the application sends only 2, the rest of that
    opportunity can't necessarily be used by anyone else.
  moves:
  - tex:
      name: wa
      zone: bottom
      tex: 1\ \text{Mb/s}\times 10\ \text{s}=10\ \text{Mb reserved, 2 Mb used}
      size: 42
      when: A 1 megabit
- id: packet
  stage: animation
  pdf: 4
  c:
  - Packet Switching
  say: The other design is packet switching. Chop data into packets. Give each one
    its own destination address, and let each hop forward it when capacity becomes
    available. No setup, and no reservation. No router has to remember that you exist.
  moves:
  - tl.block:
      name: link
      track: Packet
      start: 0
      end: 1.4
      text: A
      kind: ip
  - tl.block:
      name: link
      track: Packet
      start: 1.4
      end: 2.6
      text: B
      kind: eth
  - tl.block:
      name: link
      track: Packet
      start: 2.6
      end: 4
      text: A
      kind: ip
  - tl.block:
      name: link
      track: Packet
      start: 4
      end: 7
      text: B
      kind: eth
  - tl.block:
      name: link
      track: Packet
      start: 7
      end: 8
      text: A
      kind: ip
- id: statmux
  stage: state
  pdf: 5
  c:
  - Statistical Multiplexing
  say: Why does this suit computers? Their traffic is bursty. A web page arrives in
    a rush, and then the link goes silent. Sharing capacity according to actual arrivals
    is called statistical multiplexing, and it lets many bursty users share a link
    that could never hold all their peaks. The price comes when bursts overlap. If
    8 megabits per second arrive at a 4 megabit link for 10 milliseconds, a backlog
    of 5,000 bytes builds in a queue.
  moves:
  - queue.show:
      name: q1
      zone: left_bottom
      items:
      - A
      - B
      - A
      - B
      kind: ip
      title: Queue during a burst
  - tex:
      name: bl
      zone: right_bottom
      tex: (8-4)\,\text{Mb/s}\times 10\,\text{ms}=5000\text{ bytes}
      size: 38
      when: If 8 megabits
- id: best
  stage: state
  pdf: 6
  c:
  - Best-Effort Service
  say: IP makes a modest deal called best-effort service. It will try. It may lose
    your packet, reorder it, delay it, or even duplicate it, and none of that breaks
    the contract. That sounds terrible, until you see what it buys. A network that
    promises so little can run over nearly any link, and needs no per-flow memory
    inside. Reliability can then be added at the end machines, by the programs that
    actually need it.
  moves:
  - clear: {}
  - bullets:
      name: be
      zone: left
      show: 0
      items:
      - May lose packets
      - May reorder packets
      - May delay packets
  - reveal:
      name: be
      n: 3
      when: It may lose
  - text:
      name: buys
      zone: right
      lines:
      - 'Buys simplicity:'
      - runs over nearly any link
      - no per-flow memory inside
      - end machines add reliability
      when: That sounds terrible
- id: services
  stage: state
  pdf: 14
  c:
  - QoS Service Models
  - ATM Constant Bit Rate
  - ATM Available Bit Rate
  - Integrated Services
  - Differentiated Services
  say: Best effort is not the only possible deal. A QoS service model is a list of
    promises about bandwidth, loss, order, and timing. ATM's constant bit rate service
    reserves a fixed rate, with order and timing protected. ATM's available bit rate
    promises only a minimum rate. Integrated Services aims at explicit guarantees
    per flow. Differentiated Services treats classes of packets differently, without
    per-flow guarantees. Keep these promises separate. A minimum rate is not a delay
    bound, and priority is not an end to end guarantee.
  moves:
  - clear: {}
  - table.show:
      name: svc
      zone: full
      cols:
      - Service
      - Promise
      rows:
      - - Internet best effort
        - none
      - - ATM constant bit rate
        - fixed reserved rate
      - - ATM available bit rate
        - minimum rate
      - - Integrated Services
        - per-flow guarantees
      - - Differentiated Services
        - class-based treatment
      show: 1
  - table.reveal:
      name: svc
      when: ATM's constant
  - table.reveal:
      name: svc
      when: ATM's available
  - table.reveal:
      name: svc
      when: Integrated Services aims
  - table.reveal:
      name: svc
      when: Differentiated Services treats
- id: planes
  stage: animation
  pdf: 9
  c:
  - Network Planes
  say: If routers remember nothing about flows, what do they keep? A forwarding table.
    And that exposes the most useful split in this course. The data plane handles
    every packet, using the installed table, in nanoseconds. The control plane exchanges
    information, and decides what belongs in that table, over seconds. The management
    plane is where people configure intent. Say an operator changes a link weight.
    A protocol recomputes. The router installs a new entry. Later packets follow it.
    Those are separate events, and that separation will matter when failures strike.
  moves:
  - clear: {}
  - stack.show:
      name: pl
      zone: left
      width: 6
      layers:
      - t: 'Management: people set intent'
        k: data
      - t: 'Control: decide the table'
        k: transport
      - t: 'Data: forward every packet'
        k: ip
  - stack.mark:
      name: pl
      layer: 2
      when: The data plane
  - stack.mark:
      name: pl
      layer: 2
      state: null
      when: The control plane
  - stack.mark:
      name: pl
      layer: 1
  - stack.mark:
      name: pl
      layer: 1
      state: null
      when: The management plane
  - stack.mark:
      name: pl
      layer: 0
  - bullets:
      name: ev
      zone: right
      show: 4
      items:
      - Operator changes a weight
      - Protocol recomputes
      - Router installs an entry
      - Later packets follow it
      when: Say an operator
- id: rule
  stage: rule
  pdf: 13
  c:
  - Software-Defined Networking
  - Network Planes
  say: Traditionally, each router runs its own control software, and they cooperate.
    Software-defined networking moves that logic into a controller, which programs
    the forwarding devices. Does every packet then have to visit the controller? No.
    The controller installs rules, and the device applies them locally. Either way,
    the rule stays the same. Control decides. Data executes.
  moves:
  - clear: {}
  - net.show:
      name: sdn
      zone: top
      nodes:
        C:
          k: box
          at:
          - 5
          - 1
          l: Controller
        A:
          k: switch
          at:
          - 1
          - 0
          l: Switch 1
        B:
          k: switch
          at:
          - 5
          - 0
          l: Switch 2
        D:
          k: switch
          at:
          - 9
          - 0
          l: Switch 3
      links:
      - - C
        - A
        - s: control
      - - C
        - B
        - s: control
      - - C
        - D
        - s: control
      - - A
        - B
      - - B
        - D
  - packet.spawn:
      name: dp
      net: sdn
      at: A
      layers:
      - ip
      when: Does every packet
  - packet.hop:
      name: dp
      to:
      - B
      - D
      when: The controller installs
  - rule:
      text: Control decides what goes in the table. Data executes the table.
- id: pitfall
  stage: rule
  pdf: 13
  c:
  - Software-Defined Networking
  - Network Planes
  say: 'An easy mistake: if average load is below capacity, nothing should ever wait.
    But traffic comes in bursts, so queues still build for short moments.'
  moves:
  - trap:
      wrong: Average load below capacity means no queues
      right: Bursts still queue, even when the average fits
- id: changed
  stage: changed_example
  pdf: 15
  c:
  - Best-Effort Service
  say: Test yourself on the contract. A packet has a valid address. Its checksum is
    perfect, and a route exists. It still never arrives.
  moves:
  - clear: {}
  - q:
      text: Valid address, good checksum, a route exists. It never arrives.
      zone: top
- id: predict
  stage: prediction
  pdf: 15
  hold: 6
  c:
  - Best-Effort Service
  say: Did the network break its promise? Name two ways this could happen.
  moves:
  - pause:
      text: was the contract broken? how could this happen?
- id: answer
  stage: explanation
  pdf: 15
  c:
  - Best-Effort Service
  say: No promise was broken. A full queue may drop it. Its TTL may expire. A failure
    or a policy may stop it. Best effort means exactly that. So what does the network
    truly require from each packet? An address that can guide it across thousands
    of networks, without each router knowing every host. That is our next problem.
  moves:
  - bullets:
      name: why
      zone: bottom
      show: 3
      items:
      - A full queue drops it
      - Its TTL expires
      - A failure or policy stops it
  - rule:
      text: 'No promise was broken. Next: addresses that scale.'
  - keep: {}
prediction_contracts:
- prediction_beat: 7.1.predict
  answer_beat: 7.1.answer
  answer_events:
  - 7.1.answer:move:0
  - 7.1.answer:move:1
  answer_objects:
  - object: why
    after: 7.1.answer:move:0
    effect: bullets
    selector: {}
    before_answer: hidden_or_neutral
  - object: _rule
    after: 7.1.answer:move:1
    effect: rule
    selector: {}
    before_answer: hidden_or_neutral
  review_scope: Inspect the listed answer objects for neutral or hidden state during
    the prediction hold.
