dish: '7.3'
title: The IPv4 header
deck: lec07-network1.pdf
target_min: 4.5
concepts:
- IPv4 Header
- IPv4 Header Checksum
- IP TTL and Traceroute
beats:
- id: question
  stage: question
  pdf: 33
  c:
  - IPv4 Header
  say: What does a router actually need to read? The IPv4 header has only about a
    dozen fields, and each exists to solve one bounded problem. Read them by purpose
    and by unit, because the units are where the traps are.
  moves:
  - heading:
      text: 'Lecture 7: the IPv4 header'
  - q:
      text: What does a router actually need to read?
- id: fields
  stage: animation
  pdf: 33
  c:
  - IPv4 Header
  say: The header. Version says 4. IHL, the header length, counts 32 bit words, not
    bytes. So a value of 5 means 20 bytes. A packet with IHL 6 and total length 1024
    therefore has 24 header bytes, and 1000 bytes of payload.
  moves:
  - clear: {}
  - fields.show:
      name: h
      zone: top
      unit: 0.38
      rows:
      - - - Version
          - 4
        - - IHL
          - 4
        - - Type of service
          - 8
        - - Total length
          - 16
      - - - Identification
          - 16
        - - Flags
          - 3
        - - Fragment offset
          - 13
      - - - TTL
          - 8
        - - Protocol
          - 8
        - - Header checksum
          - 16
      - - - Source address
          - 32
      - - - Destination address
          - 32
  - fields.mark:
      name: h
      label: IHL
      when: IHL, the header
  - tex:
      name: ihl
      zone: bottom
      tex: \text{IHL}=6:\ 6\times 4=24\text{ header bytes},\quad 1024-24=1000\text{
        payload bytes}
      size: 36
      when: A packet with
- id: length
  stage: state
  pdf: 35
  c:
  - IPv4 Header
  clar:
  - ipv4-max
  say: Total length counts the whole datagram in bytes, and it is a 16 bit field.
    So the largest value is 2 to the 16th, minus one, which is 65,535 bytes. The slide
    prints 63,535. That is a typo, and the arithmetic settles it.
  moves:
  - fields.mark:
      name: h
      label: IHL
      state: null
  - fields.mark:
      name: h
      label: Total length
  - card:
      kind: correction
      text: Slide says 63,535. A 16-bit field holds up to 65,535 bytes.
      zone: bottom
      when: The slide prints
- id: protocol
  stage: state
  pdf: 39
  c:
  - IPv4 Header
  say: The protocol field names what comes next, such as TCP, 6, or UDP, 17. It is
    not a port number. Follow the chain of hand-offs. Ethernet's type says this payload
    is IPv4. IPv4's protocol says this payload is UDP. UDP's destination port selects
    the program.
  moves:
  - fields.mark:
      name: h
      label: Total length
      state: null
  - fields.mark:
      name: h
      label: Protocol
  - stack.show:
      name: chain
      zone: bottom
      width: 8
      layers:
      - t: 'Ethernet type: this payload is IPv4'
        k: eth
      - t: 'IPv4 protocol: this payload is UDP'
        k: ip
      - t: 'UDP port: this program'
        k: transport
- id: ttl
  stage: animation
  pdf: 38
  c:
  - IP TTL and Traceroute
  say: TTL limits the damage from routing loops. Every router lowers it by one, and
    at zero the packet dies, and the router normally sends back an ICMP time exceeded
    message. A clever tool turns this into a map. Traceroute sends a probe with TTL
    1. The first router replies. Then TTL 2, and the second router replies. Each reply
    reveals one more hop. A missing reply may just mean a router declines to answer.
  moves:
  - clear: {}
  - net.show:
      name: tr
      zone: top
      nodes:
        L:
          k: laptop
          at:
          - 0
          - 0
          l: Laptop
        R1:
          k: router
          at:
          - 3.5
          - 0
          l: R1
        R2:
          k: router
          at:
          - 7
          - 0
          l: R2
        W:
          k: server
          at:
          - 10.5
          - 0
          l: Server
      links:
      - - L
        - R1
      - - R1
        - R2
      - - R2
        - W
  - packet.spawn:
      name: p1
      net: tr
      at: L
      layers:
      - ip
      when: Traceroute sends
  - packet.hop:
      name: p1
      to: R1
  - packet.drop:
      name: p1
  - table.show:
      name: tt
      zone: bottom
      cols:
      - Probe TTL
      - Reply from
      rows:
      - - 1
        - R1
      - - 2
        - R2
      - - 3
        - Server
      show: 1
  - packet.spawn:
      name: p2
      net: tr
      at: L
      layers:
      - ip
      when: Then TTL 2
  - packet.hop:
      name: p2
      to:
      - R1
      - R2
  - packet.drop:
      name: p2
  - table.reveal:
      name: tt
- id: checksum
  stage: state
  pdf: 41
  c:
  - IPv4 Header Checksum
  say: One more field is linked to TTL. The header checksum is a one's complement
    sum over the header only. It does not cover the payload, it does not authenticate
    anybody, and it cannot repair errors. And here is the consequence. Each router
    lowers the TTL, which changes the header. So each router must also update the
    checksum. With TTL 64, our example header's checksum works out to one value. With
    TTL 63, it is a different one.
  moves:
  - table.show:
      name: ck
      zone: bottom
      cols:
      - TTL
      - Header checksum
      rows:
      - - $ipv4.checksum_ttl64.ttl
        - $ipv4.checksum_ttl64.checksum
      - - $ipv4.checksum_ttl63.ttl
        - $ipv4.checksum_ttl63.checksum
    when: With TTL 64
- id: rule
  stage: rule
  pdf: 42
  c:
  - IPv4 Header
  say: Read each field with its unit. IHL is in 32 bit words. Total length is in bytes.
    Fragment offset is in 8 byte units. TTL is in router hops. Mixing these up is
    how most header questions are lost.
  moves:
  - clear: {}
  - table.show:
      name: units
      zone: full
      cols:
      - Field
      - Unit
      rows:
      - - IHL
        - 32-bit words
      - - Total length
        - bytes
      - - Fragment offset
        - 8-byte units
      - - TTL
        - router hops
  - rule:
      text: Every field has a unit. Read the unit first.
- id: pitfall
  stage: rule
  pdf: 42
  c:
  - IPv4 Header
  say: A common overclaim. The IPv4 checksum doesn't protect the payload, doesn't
    correct anything, and doesn't authenticate a sender. It only detects errors in
    the header.
  moves:
  - trap:
      wrong: The IP checksum protects the whole packet
      right: It covers the header only, and it can't correct errors
- id: changed
  stage: changed_example
  pdf: 38
  c:
  - IP TTL and Traceroute
  say: A new situation. A forwarding loop forms between R1 and R2, and a packet enters
    it with TTL 64. Meanwhile a DNS answer has a TTL of 300, and our switch table
    has a timer too.
  moves:
  - clear: {}
  - net.show:
      name: lp
      zone: top
      nodes:
        R1:
          k: router
          at:
          - 0
          - 0
          l: R1
        R2:
          k: router
          at:
          - 6
          - 0
          l: R2
      links:
      - - R1
        - R2
        - s: failed
  - packet.spawn:
      name: c
      net: lp
      at: R1
      layers:
      - ip
  - packet.hop:
      name: c
      to:
      - R2
      - R1
      - R2
- id: predict
  stage: prediction
  pdf: 38
  hold: 6
  c:
  - IP TTL and Traceroute
  say: Does TTL rescue this packet? And do those three things called TTL all count
    the same thing?
  moves:
  - pause:
      text: does TTL rescue it? what does each TTL count?
- id: answer
  stage: explanation
  pdf: 38
  c:
  - IP TTL and Traceroute
  say: TTL does not rescue it. It only ends it, after using up link capacity, so the
    damage is bounded rather than prevented. And the three are different. IP's TTL
    counts router hops. A DNS TTL counts seconds of cache life. A switch table timer
    ages an entry locally. Same acronym, different arithmetic. One field group remains,
    those fragmentation fields, so let us use them.
  moves:
  - packet.drop:
      name: c
  - table.show:
      name: ttls
      zone: bottom
      cols:
      - Name
      - Counts
      rows: &id001
      - - IP TTL
        - router hops
      - - DNS TTL
        - seconds of cache
      - - Switch timer
        - seconds of aging
  - keep: {}
prediction_contracts:
- prediction_beat: 7.3.predict
  answer_beat: 7.3.answer
  answer_events:
  - 7.3.answer:move:0
  - 7.3.answer:move:1
  answer_objects:
  - object: c
    after: 7.3.answer:move:0
    effect: packet.drop
    selector: {}
    before_answer: hidden_or_neutral
  - object: ttls
    after: 7.3.answer:move:1
    effect: table.show
    selector:
      rows: *id001
    before_answer: hidden_or_neutral
  review_scope: Inspect the listed answer objects for neutral or hidden state during
    the prediction hold.
