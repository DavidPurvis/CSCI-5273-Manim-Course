dish: '7.2'
title: Addresses and prefixes
deck: lec07-network1.pdf
target_min: 6.5
concepts:
- IPv4 Addresses
- Classful Addressing
- CIDR and Aggregation
- Subnet Masks
- Network and Broadcast Addresses
beats:
- id: question
  stage: question
  pdf: 17
  c:
  - IPv4 Addresses
  say: A switch can keep one table entry per machine, because a LAN is small. The
    Internet holds billions of interfaces. If every router needed an entry for every
    one, no router could cope. So how can a router in another country forward a packet
    toward your laptop without ever having heard of it?
  moves:
  - heading:
      text: 'Lecture 7: addresses and prefixes'
  - q:
      text: How can a router forward toward a machine it has never heard of?
  - keep: {}
- id: address
  stage: animation
  pdf: 17
  c:
  - IPv4 Addresses
  say: An IPv4 address is simply a 32 bit number, written as four decimal bytes. Here
    is our example, 10.10.1.97. It identifies an interface, not a computer, so a router
    with three links has three addresses. And unlike a MAC address, this one has structure.
  moves:
  - clear: {}
  - bits.show:
      name: a
      zone: top
      rows:
      - label: Address 10.10.1.97
        value: $ipv4.decode_97.address
  - bits.mark:
      name: a
      row: 0
      start: 0
      end: 8
      when: four decimal bytes
  - bits.mark:
      name: a
      row: 0
      start: 24
      end: 32
      when: Here is our
  - bits.mark:
      name: a
      row: 0
      start: 0
      end: 32
      state: null
      when: It identifies
- id: prefix
  stage: state
  pdf: 21
  c:
  - CIDR and Aggregation
  say: The structure is this. The leading bits name a network, and the trailing bits
    name a host within that network. The boundary is written after a slash. In 10.10.1.97/23,
    the first 23 bits are the network part, leaving 9 bits for hosts. A router far
    away only needs to know which way to send that whole block. Every host inside
    is covered by one entry. That is how the Internet scales.
  moves:
  - bits.mark:
      name: a
      row: 0
      start: 0
      end: 23
      when: The leading bits
  - bits.mark:
      name: a
      row: 0
      start: 23
      end: 32
      state: candidate
      when: the trailing bits
  - bits.draw_mask:
      name: a
      prefix: 23
      when: In 10.10.1.97/23
  - bits.mark:
      name: a
      row: 0
      start: 0
      end: 23
      when: the first 23
  - bits.mark:
      name: a
      row: 0
      start: 23
      end: 32
      state: candidate
      when: leaving 9
  - rule:
      text: 'Prefix: the network part. The rest: the host part. One entry covers the
        whole block.'
      when: A router far away
- id: classful
  stage: animation
  pdf: 27
  c:
  - Classful Addressing
  say: 'Originally that boundary was forced. Classful addressing offered only three
    unicast sizes: slash 8, slash 16, and slash 24. An organization needing 300 addresses
    was too big for a slash 24, so it received a slash 16, with 65 thousand addresses,
    and wasted nearly all of them.'
  moves:
  - bits.mark:
      name: a
      row: 0
      start: 0
      end: 32
      state: null
  - table.show:
      name: cl
      zone: bottom
      cols:
      - Class
      - Prefix
      - Addresses
      rows:
      - - A
        - /8
        - 16,777,216
      - - B
        - /16
        - 65,536
      - - C
        - /24
        - '256'
      show: 0
      when: only three unicast
  - table.reveal:
      name: cl
      t: 0.4
  - table.reveal:
      name: cl
      t: 0.4
  - table.reveal:
      name: cl
      t: 0.4
  - table.mark:
      name: cl
      r: 2
      state: error
      when: was too big
  - table.mark:
      name: cl
      r: 1
      state: now
      when: so it received
- id: classful-more
  stage: state
  pdf: 27
  c:
  - Classful Addressing
  say: The class was even written into the address's first bits. An initial zero meant
    class A, one zero meant class B, and one one zero meant class C. Class D, beginning
    one one one zero, is multicast. Today the prefix is stated explicitly, so a first
    byte no longer implies a mask.
  moves:
  - table.show:
      name: cl
      zone: bottom
      cols:
      - Class
      - Starts with
      - Use
      rows:
      - - A
        - '0'
        - /8
      - - B
        - '10'
        - /16
      - - C
        - '110'
        - /24
      - - D
        - '1110'
        - multicast
      show: 0
  - table.reveal:
      name: cl
      when: An initial zero
  - table.reveal:
      name: cl
      when: one zero meant class B
  - table.reveal:
      name: cl
      when: one one zero meant
  - table.reveal:
      name: cl
      when: Class D
- id: cidr
  stage: state
  pdf: 29
  c:
  - CIDR and Aggregation
  say: CIDR, classless inter-domain routing, lets the boundary fall anywhere. Now
    the 300 address organization takes a slash 23, with 512 addresses. Each bit you
    add to the prefix halves the block. A slash 24 has 2 to the 8th, which is 256.
    A slash 23 has twice that. CIDR also allows aggregation. Two halves of one slash
    24 can be announced as that single slash 24. But two ranges that merely look close
    may not combine, because a block must be aligned on its own size.
  moves:
  - table.flash:
      name: cl
      rows:
      - 1
      - 2
      state: null
  - tex:
      name: size
      zone: bottom
      tex: \text{addresses} = 2^{\,32-p}\qquad /24 \to 256\qquad /23 \to 512
      size: 42
      when: Each bit you
  - rule:
      text: Aggregation needs aligned, adjacent blocks with the same reachability.
      when: CIDR also allows
- id: allocation
  stage: state
  pdf: 30
  c:
  - CIDR and Aggregation
  say: Who hands out these blocks? Allocation is hierarchical too. ICANN allocates
    to regional registries. Those allocate to Internet providers and large institutions,
    who pass smaller blocks on to their customers. So 12.0.0.0/8 might contain 12.3.0.0/16,
    which contains 12.3.1.0/24. A provider can then announce one short prefix for
    all of its customers together. The address hierarchy mirrors the business hierarchy,
    and it's what keeps routing tables manageable. Compare that to a switch, whose
    table lists individual machines.
  moves:
  - clear: {}
  - net.show:
      name: alloc
      zone: top
      nodes:
        I:
          k: box
          at:
          - 0
          - 0
          l: ICANN
        R:
          k: box
          at:
          - 3.4
          - 0
          l: Regional registry
        P:
          k: box
          at:
          - 7.4
          - 0
          l: 'Provider: /16'
        C:
          k: box
          at:
          - 11
          - 0
          l: 'Customer: /24'
      links:
      - - I
        - R
      - - R
        - P
      - - P
        - C
  - net.pulse:
      name: alloc
      path:
      - I
      - R
      when: ICANN allocates
  - net.pulse:
      name: alloc
      path:
      - R
      - P
      when: Those allocate
  - net.pulse:
      name: alloc
      path:
      - P
      - C
      when: who pass smaller
  - bullets:
      name: nest
      zone: bottom
      show: 0
      items:
      - 12.0.0.0/8
      - 12.3.0.0/16
      - 12.3.1.0/24
  - reveal:
      name: nest
      when: So 12.0.0.0/8
  - reveal:
      name: nest
      when: 12.3.0.0/16
      t: 0.5
  - reveal:
      name: nest
      when: 12.3.1.0/24
      t: 0.5
  - rule:
      text: One short prefix can cover every customer of a provider. That keeps tables
        small.
      when: A provider can
- id: mask
  stage: state
  pdf: 23
  c:
  - Subnet Masks
  say: To compute with a prefix, write it as a subnet mask. That is 32 bits with ones
    over the network part, and zeros over the host part. A slash 23 is 255.255.254.0.
    Now apply it. A bitwise AND of address and mask keeps the network bits, and clears
    the host bits. The result is the network address, 10.10.0.0. Notice what happened
    in the third byte. The 1 was cleared, because that last bit belongs to the host
    part.
  moves:
  - clear: {}
  - bits.show:
      name: d
      zone: full
      rows:
      - label: Address 10.10.1.97
        value: $ipv4.decode_97.address
      - label: Mask 255.255.254.0
        value: $ipv4.decode_97.mask
      reserve: 4
  - bits.draw_mask:
      name: d
      prefix: 23
      when: A slash 23
  - bits.scan:
      name: d
      label: AND gives network 10.10.0.0
      value: $ipv4.decode_97.network
      when: A bitwise AND
  - bits.mark:
      name: d
      row: 2
      start: 23
      end: 24
      when: Notice what happened
- id: broadcast
  stage: state
  pdf: 23
  c:
  - Network and Broadcast Addresses
  say: Do the opposite. Set every host bit to one, and you get the broadcast address
    of this subnet, 10.10.1.255. The all zeros and all ones host patterns are reserved.
    So this block has 512 addresses in total, and 510 usable ones, from 10.10.0.1
    through 10.10.1.254.
  moves:
  - bits.mark:
      name: d
      row: 2
      start: 23
      end: 24
      state: null
  - bits.scan:
      name: d
      label: 'Host bits all one: broadcast 10.10.1.255'
      value: $ipv4.decode_97.broadcast
      when: Set every host
  - rule:
      text: "Network: host bits zero. Broadcast: host bits one. Usable: 2^h \u2212\
        \ 2."
      when: So this block
- id: rule
  stage: rule
  pdf: 23
  c:
  - Subnet Masks
  - Network and Broadcast Addresses
  say: That subtraction of two applies to ordinary subnets. A slash 31 point to point
    link and a slash 32 host route need their own interpretation, so do not apply
    it blindly. The real rule is this. An address alone tells you nothing about its
    subnet. You need the mask.
  moves:
  - rule:
      text: A /31 link and a /32 host route need their own interpretation.
      when: A slash 31
  - bits.mark:
      name: d
      row: 1
      start: 0
      end: 23
      when: An address alone
  - rule:
      text: An address alone says nothing about its subnet. You need the mask.
- id: pitfall
  stage: rule
  pdf: 23
  c:
  - Subnet Masks
  - Network and Broadcast Addresses
  say: A tempting shortcut is to compare the first three bytes of two addresses. That
    only works for a slash 24. For any other prefix, apply the actual mask.
  moves:
  - trap:
      wrong: Compare the first three bytes to find the subnet
      right: Only a /24 works that way. Always apply the actual mask.
- id: changed
  stage: changed_example
  pdf: 24
  c:
  - Network and Broadcast Addresses
  say: A trap on purpose. In this same slash 23, consider the address 10.10.0.255.
    It ends in 255.
  moves:
  - clear: {}
  - bits.show:
      name: t
      zone: top
      rows:
      - label: 10.10.0.255
        value: 10.10.0.255
      - label: Mask 255.255.254.0
        value: 255.255.254.0
  - bits.draw_mask:
      name: t
      prefix: 23
- id: predict
  stage: prediction
  pdf: 24
  hold: 12
  c:
  - Network and Broadcast Addresses
  say: Is it a broadcast address? Look at the host bits, not at the decimal number.
  moves:
  - pause:
      text: is 10.10.0.255 a broadcast address in this /23?
      long: true
- id: answer
  stage: explanation
  pdf: 24
  c:
  - Network and Broadcast Addresses
  - Subnet Masks
  say: No. Its host part is 0 11111111, and that first zero means the bits are not
    all ones. It is an ordinary host address, sitting in the middle of the block.
    The ending 255 only signals broadcast when the mask says the last byte alone is
    the host part. So the numbers are only half of the picture, and the other half
    is the header that carries them. Let us open that up.
  moves:
  - bits.mark:
      name: t
      row: 0
      start: 23
      end: 32
      state: candidate
      when: Its host part
  - bits.mark:
      name: t
      row: 0
      start: 23
      end: 24
      state: error
      when: that first zero
  - text:
      name: ans
      zone: bottom
      lines:
      - 'Host part: 0 11111111, not all ones'
      - So it is an ordinary host address
      when: It is an ordinary
  - rule:
      text: 255 only means broadcast when the mask says so.
      when: The ending 255
  - keep: {}
