dish: '7.4'
title: Fragmentation
deck: lec07-network1.pdf
target_min: 4.5
concepts:
- IPv4 Fragmentation
beats:
- id: question
  stage: question
  pdf: 35
  c:
  - IPv4 Fragmentation
  say: IP runs over any link, and links limit how big a packet they will carry. That
    limit is the MTU. What happens when a 4,000 byte datagram reaches a link with
    an MTU of only 1,500 bytes?
  moves:
  - heading:
      text: 'Lecture 7: fragmentation'
  - q:
      text: A 4000-byte datagram meets a 1500-byte link. Now what?
  - keep: {}
- id: idea
  stage: animation
  pdf: 36
  c:
  - IPv4 Fragmentation
  say: If fragmentation is allowed, the router splits it into smaller datagrams. Each
    fragment gets its own full IP header, so each travels independently. They all
    keep the original's identification number, so the destination can tell which ones
    belong together. Reassembly normally happens only at the destination.
  moves:
  - clear: {}
  - net.show:
      name: f
      zone: top
      nodes:
        A:
          k: host
          at:
          - 0
          - 0
          l: Source
        R:
          k: router
          at:
          - 4
          - 0
          l: Router
        B:
          k: host
          at:
          - 8
          - 0
          l: Destination
      links:
      - - A
        - R
        - c: MTU 4000
      - - R
        - B
        - c: MTU 1500
  - packet.spawn:
      name: big
      net: f
      at: A
      layers:
      - ip
  - packet.hop:
      name: big
      to: R
  - packet.flood:
      name: big
      to:
      - B
      when: Each fragment
- id: payload
  stage: state
  pdf: 37
  c:
  - IPv4 Fragmentation
  say: The arithmetic, carefully. Total length is 4,000, and 20 bytes of that is header.
    So the data to carry is 3,980 bytes. Each fragment on the small link can hold
    1,500 minus 20, which is 1,480 bytes of data. And nonfinal fragments must carry
    a multiple of 8 bytes, because the offset field counts in 8 byte units. 1,480
    divides evenly by 8. So 1,480 it is.
  moves:
  - bar.show:
      name: b
      zone: full
      total: 4000
      header: 20
      rows: 3
  - bar.cut:
      name: b
      at: 1480
      when: Each fragment on
  - bar.ruler:
      name: b
      when: And nonfinal
  - bar.zoom:
      name: b
      at: 1480
      when: 1,480 divides
- id: table
  stage: state
  pdf: 37
  c:
  - IPv4 Fragmentation
  say: The first fragment carries bytes 0 through 1,479, offset 0, more fragments
    flag set. The second carries the next 1,480. Its offset is 1,480 divided by 8,
    which is 185. The flag is still set. The third carries what remains, 1,020 bytes.
    Its offset is 2,960 divided by 8, which is 370, and its more fragments flag is
    0, marking the end.
  moves:
  - bar.slice:
      name: b
      i: 0
      frag: $ipv4.frag_4000.0
      when: The first fragment
  - bar.slice:
      name: b
      i: 1
      frag: $ipv4.frag_4000.1
      when: The second carries
  - bar.slice:
      name: b
      i: 2
      frag: $ipv4.frag_4000.2
      when: The third carries
- id: check
  stage: state
  pdf: 37
  c:
  - IPv4 Fragmentation
  say: Check it. The payloads sum to 3,980, which is the original data, restored exactly.
    But the total bytes sent are 4,040, not 4,000, because there are now three headers
    instead of one. Fragmentation costs overhead, and if any one fragment is lost,
    the whole datagram is lost.
  moves:
  - bar.join:
      name: b
      when: The payloads sum
  - bar.note:
      name: b
      tex: 1480+1480+1020=3980
      side: left
  - bar.note:
      name: b
      tex: 1500+1500+1040=4040
      side: right
      when: But the total
  - bar.mark:
      name: b
      what: chips
      when: three headers
  - bar.mark:
      name: b
      what: whole
      state: error
      when: the whole datagram
- id: rule
  stage: rule
  pdf: 37
  c:
  - IPv4 Fragmentation
  say: Keep the rule short. Offset is the data position in the original, divided by
    8. It is not the fragment's length, and it does not count headers. Fragmentation
    exists to fit a link, and it has nothing to do with repairing congestion loss.
  moves:
  - bar.mark:
      name: b
      what: whole
      state: done
  - bar.span:
      name: b
      to: 1480
      text: "offset 185 \xD7 8 = 1480"
      when: Offset is the data
  - bar.mark:
      name: b
      what: chips
      state: error
      when: does not count headers
  - rule:
      text: "Offset = position in the original data \xF7 8. Only the last fragment\
        \ has MF = 0."
      when: Fragmentation exists
- id: pitfall
  stage: rule
  pdf: 37
  c:
  - IPv4 Fragmentation
  say: One more trap. A router can't always fragment. If the Don't Fragment flag is
    set, it isn't allowed to. And losing any one fragment loses the whole datagram.
  moves:
  - trap:
      wrong: A router always fragments a packet that's too big
      right: If Don't Fragment is set, the router can't fragment it
- id: changed
  stage: changed_example
  pdf: 37
  c:
  - IPv4 Fragmentation
  say: New numbers. Total length 3,200, header 20, MTU 1,000. This time 1,000 minus
    20 is 980, and 980 is not a multiple of 8.
  moves:
  - clear: {}
  - bar.show:
      name: c
      zone: full
      total: 3200
      header: 20
      rows: 4
  - bar.ruler:
      name: c
  - bar.zoom:
      name: c
      at: 980
      state: error
      when: and 980 is not
- id: predict
  stage: prediction
  pdf: 37
  hold: 12
  c:
  - IPv4 Fragmentation
  say: What is the largest nonfinal payload? How many fragments will there be, and
    what are their offsets?
  moves:
  - pause:
      text: the largest payload, the fragment count, and the offsets?
      long: true
- id: answer
  stage: explanation
  pdf: 37
  c:
  - IPv4 Fragmentation
  say: 'Round 980 down to a multiple of 8, and you get 976. The data is 3,180 bytes,
    giving payloads of 976, 976, 976, and a final 252. The offsets go up in steps
    of 122: 0, 122, 244, 366. Those four unused bytes per fragment are the price of
    8 byte alignment. We now know what a packet looks like. Next question: how does
    an organization carve up its address space, and how does a router pick among overlapping
    routes?'
  moves:
  - bar.snap:
      name: c
      at: 976
      when: Round 980
  - bar.slice:
      name: c
      i: 0
      frag: $ipv4.frag_3200.0
      info: false
      t: 0.8
      when: The data is
  - bar.slice:
      name: c
      i: 1
      frag: $ipv4.frag_3200.1
      info: false
      t: 0.8
  - bar.slice:
      name: c
      i: 2
      frag: $ipv4.frag_3200.2
      info: false
      t: 0.8
  - bar.slice:
      name: c
      i: 3
      frag: $ipv4.frag_3200.3
      info: false
      t: 0.8
      when: and a final 252
  - bar.info:
      name: c
      i: 0
      frag: $ipv4.frag_3200.0
      when: The offsets go
  - bar.info:
      name: c
      i: 1
      frag: $ipv4.frag_3200.1
  - bar.info:
      name: c
      i: 2
      frag: $ipv4.frag_3200.2
  - bar.info:
      name: c
      i: 3
      frag: $ipv4.frag_3200.3
      when: '366'
  - rule:
      text: '4 unused bytes per fragment: the price of 8-byte alignment.'
      when: Those four unused
  - clear:
      when: Next question
  - q:
      text: How do you carve up an address space, and pick among overlapping routes?
