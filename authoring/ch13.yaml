beats:
- id: question
  stage: question
  pdf: 40
  c:
  - Reverse Path Forwarding
  say: A router receives a multicast packet. If it floods the packet out every port,
    loops and duplicates will multiply, and we saw how badly that ends on Ethernet.
    How can a router decide whether to accept a packet, without any tree having been
    computed?
  moves:
  - heading:
      text: 'Lecture 13: RPF and PIM'
  - q:
      text: How can a router reject duplicates without a computed tree?
- id: rpf
  stage: animation
  pdf: 40
  c:
  - Reverse Path Forwarding
  say: 'An elegant trick. Look at where the packet came from, and ask: if I were sending
    a packet back to this source, which port would I use? If the packet arrived on
    that port, it probably came along the shortest path. Accept it, and forward it
    out the other ports. If it arrived anywhere else, it''s a duplicate that wandered
    around another branch. Drop it. That''s reverse path forwarding. Say router X
    reaches source S through port 1. A packet from S arriving on port 1 passes. A
    copy arriving on port 3 fails.'
  moves:
  - clear: {}
  - net.show:
      name: r
      zone: top
      nodes:
        S:
          k: server
          at:
          - 0
          - 0.8
          l: Source S
        A:
          k: router
          at:
          - 3.4
          - 1.8
          l: A
        B:
          k: router
          at:
          - 3.4
          - -0.2
          l: B
        X:
          k: router
          at:
          - 7
          - 0.8
          l: X
        Z:
          k: host
          at:
          - 10.4
          - 0.8
          l: Downstream
      links:
      - - S
        - A
      - - S
        - B
      - - A
        - X
        - c: port 1
      - - B
        - X
        - c: port 3
      - - X
        - Z
  - net.walk:
      name: r
      path:
      - X
      - A
      - S
      when: if I were sending
  - net.state:
      name: r
      nodes:
        X: done
      when: If the packet arrived
  - net.state:
      name: r
      nodes:
        X: error
      when: If it arrived anywhere
  - rule:
      text: 'RPF: accept only if it arrived on the port you''d use to reach the source.'
      when: That's reverse
  - net.unwalk:
      name: r
      when: Say router X
  - net.state:
      name: r
      nodes:
        X: null
  - packet.spawn:
      name: g1
      net: r
      at: S
      layers:
      - ip
  - packet.hop:
