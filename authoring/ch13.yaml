      long: true
- id: answer
  stage: explanation
  pdf: 37
  c:
  - Minimum Spanning Trees
  - Prim Algorithm
  - Kruskal Algorithm
  say: 'The MST takes A C at 0 point 5, plus one of the edges of cost 1, for a total
    of 1 point 5. There''s a tie, so either A B or B C works. From A, the shortest
    path tree uses A C and A B. So this time the two objectives can coincide, on one
    of the valid MSTs. They just don''t have to. Real multicast protocols don''t compute
    a global MST. They use something cheaper, already sitting in every router: the
    unicast routing table.'
  moves:
  - net.path:
