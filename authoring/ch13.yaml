      - H
      when: The group address
- id: rule
  stage: rule
  pdf: 50
  c:
  - PIM Sparse Mode
  say: 'There are two axes. Dense mode says: forward by default, and prune. Sparse
    mode says: send nothing until joined. And on any tree, RPF checks the upstream
    direction, while pruning trims the downstream outputs. IGMP tells the last router
    who is interested, and PIM connects the routers.'
  moves:
  - bullets:
      name: ax
      zone: bottom
      show: 0
      items:
      - 'Dense: forward by default, then prune'
      - 'Sparse: send nothing until joined'
