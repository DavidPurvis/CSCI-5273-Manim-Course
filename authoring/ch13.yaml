- id: predict
  stage: prediction
  pdf: 49
  hold: 12
  c:
  - PIM SPT Switchover
  say: What does a switchover save now? And is the RP then a hot spot, or a bargain?
  moves:
  - pause:
      text: what does switching to the source tree save here?
      long: true
- id: answer
  stage: explanation
  pdf: 49
  c:
  - PIM SPT Switchover
  - PIM Rendezvous Point
  say: Nothing at all. 2 plus 3 equals the direct 5. Switching would add state, for
    no shorter path. So the shared tree is not inherently bad. The cost of the detour
    depends on where the RP sits. That finishes our wired story. Packets have reached
    one host, one of many, and all who asked. But now the laptop unplugs from its
    wire, and all those assumptions about who can hear whom begin to fall apart.
  moves:
  - tex:
      name: z
      zone: bottom
      tex: (2+3)-5=0\ \text{saved}
      size: 48
      when: 2 plus 3
  - rule:
      text: 'A detour''s cost depends on where the RP sits. Next: radio.'
      when: The cost of the detour
  - clear:
      when: But now the laptop
  - q:
      text: Unplug the laptop. Who can hear whom now?
  - keep: {}
