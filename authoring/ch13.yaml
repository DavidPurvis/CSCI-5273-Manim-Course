      when: The RP unwraps
  - packet.hop:
      name: rg
      to:
      - DR
      - H
  - packet.fade:
      name: rg
  - net.path:
      name: s
      path:
      - DS
      - RP
      style: tree
      when: Then the RP
- id: register-more
  stage: state
  pdf: 47
  c:
  - PIM Register
  say: Why wrap it at all? The source's router knows only the RP, and the RP hasn't
    built a path back yet. So Register is a bootstrap. The RP can unwrap each packet
    and send it down the shared tree, while native forwarding toward the source is
    being set up. A Register is not a join, and it's not a host's IGMP report.
  moves:
  - net.state:
      name: s
      nodes:
        DS: now
      when: The source's router
  - net.state:
      name: s
      nodes:
        DS: null
        RP: now
      when: So Register
  - net.pulse:
