        RP:
          k: router
          at:
          - 5.8
          - 1.6
          l: RP
          lp: up
        DR:
          k: router
          at:
          - 9
          - 0
          l: Receiver DR
        H:
          k: host
          at:
          - 11.6
          - 0
          l: Receiver
      links:
      - - S
        - DS
      - - DS
        - RP
      - - RP
        - DR
      - - DS
        - DR
        - s: dim
      - - DR
        - H
  - net.state:
      name: s
      nodes:
        RP: now
      when: Everyone agrees
  - msg.send:
      name: s
      a: DR
      b: RP
      text: (*,G) join
      when: A receiver's designated
  - net.path:
      name: s
      path:
      - RP
      - DR
      style: tree
      when: creating a shared
  - net.pulse:
      name: s
      path:
      - RP
      - DR
      - H
      when: Data then flows
  - card:
      kind: clarification
      text: Sparse mode begins with a shared (*,G) tree, then may switch to (S,G).
      zone: bottom
      when: The slide's phrase
- id: register
  stage: state
  pdf: 47
  c:
  - PIM Register
  say: A source appears. Its designated router doesn't know the receivers. It only
    knows the RP. So it wraps the first data packets in a PIM Register message, and
    unicasts those to the RP. That's encapsulation again. The RP unwraps them, and
    sends them down the shared tree. Then the RP can set up native forwarding from
    the source, so that encapsulation is no longer needed.
  moves:
  - packet.spawn:
      name: rg
      net: s
      at: S
      layers:
      - ip
  - packet.hop:
      name: rg
      to: DS
  - packet.wrap:
      name: rg
      kind: tunnel
      when: So it wraps
  - packet.hop:
      name: rg
      to: RP
      when: and unicasts
  - packet.peel:
