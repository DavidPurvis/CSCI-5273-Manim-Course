        pruning trims downstream.
      when: IGMP tells
- id: compare
  stage: rule
  pdf: 50
  c:
  - PIM Sparse Mode
  - PIM Rendezvous Point
  say: Set the two modes side by side. Dense mode starts broad, and shrinks. It needs
    no meeting point, but it pays with periodic flooding, and state in routers that
    have no interest. Sparse mode starts empty, and grows. It needs an RP, and it
    starts with possible detours, but quiet parts of the network never hear about
    the group at all. IP multicast is still best effort throughout, and neither mode
    makes it reliable.
  moves:
  - clear: {}
  - table.show:
      name: dm
      zone: top
      cols:
      - ''
      - Dense
      - Sparse
      rows:
      - - Default
        - forward unless pruned
        - drop unless joined
      - - Starts with
        - flooding
        - joins to the RP
      - - Suits
        - widespread interest
        - rare interest
      show: 0
  - table.reveal:
      name: dm
      when: Dense mode starts
  - table.reveal:
      name: dm
      when: Sparse mode starts
  - table.reveal:
      name: dm
      when: but quiet parts
  - rule:
      text: Multicast stays best effort in both modes.
      when: IP multicast is
- id: laptop
  stage: rule
  pdf: 50
  c:
  - PIM Sparse Mode
  - PIM Rendezvous Point
  say: For our laptop, joining a stream is simple. It sends one IGMP report to its
    local router. Everything else, the joins, the RP, the tree, happens in routers
    it never hears about. And if it stops listening, those branches get pruned away.
  moves:
  - rule:
      text: The laptop sends one IGMP report. Routers do the rest.
      when: For our laptop
- id: pitfall
  stage: rule
  pdf: 50
  c:
  - PIM Sparse Mode
  - PIM Rendezvous Point
  say: 'A group address has no location to route toward. The reverse path check asks
    about the source, or the tree''s root: would I reach it through the port this
    packet came in on?'
  moves:
  - trap:
      wrong: RPF checks the path toward the group
      right: RPF checks the path back toward the source
- id: changed
  stage: changed_example
  pdf: 49
  c:
  - PIM SPT Switchover
  say: Change the geography. Suppose the RP sits right next to the path. Source to
    RP costs 2, RP to receiver costs 3, and the direct path costs 5.
