      when: A Register is
- id: spt
  stage: state
  pdf: 49
  c:
  - PIM SPT Switchover
  say: 'But there''s a problem: the RP might be far out of the way. Say source to
    RP costs 8, RP to receiver costs 7, and the direct path costs only 4. The receiver''s
    router can now join toward the source, using S comma G. Once data arrives on the
    new path, it prunes this source from the RP branch. The cost drops from 15 to
    4, a saving of 11. The group address stays the same. This is called SPT switchover.
    Start with a shared tree for easy discovery, then optimize.'
  moves:
  - fade:
      names: _card
  - net.cost:
      name: s
      a: DS
      b: RP
      cost: 8
      when: source to RP
  - net.cost:
      name: s
      a: RP
      b: DR
      cost: 7
      when: RP to receiver
  - net.cost:
      name: s
      a: DS
      b: DR
      cost: 4
      when: the direct path
  - msg.send:
      name: s
      a: DR
      b: DS
      text: (S,G) join
      when: The receiver's router
  - net.state:
      name: s
      links:
      - - DS
        - DR
        - tree
  - msg.send:
      name: s
      a: DR
      b: RP
      text: prune
      kind: error
      when: it prunes
  - net.state:
      name: s
      links:
      - - DS
        - RP
        - dim
      - - RP
        - DR
        - dim
  - tex:
