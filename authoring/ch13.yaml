      - - S
        - X
        - solid
      - - X
        - L1
        - solid
      - - X
        - L2
        - solid
      when: Flood, then prune
  - net.pulse:
      name: pr
      path:
      - S
      - X
      - L2
  - msg.send:
      name: pr
      a: X
      b: S
      text: prune
      kind: error
      when: Everything is forwarded
      t: 1.1
  - rule:
      text: 'Dense mode: forward unless pruned. Sensible only when most networks are
        interested.'
      when: That's sensible
  - net.pulse:
      name: pr
      path:
      - S
      - X
      - L1
      when: Prunes also expire
- id: sparse
  stage: state
  pdf: 46
  c:
  - PIM Sparse Mode
  - PIM Rendezvous Point
  clar:
  - pim-shared
  say: When receivers are rare, we flip the default. In PIM sparse mode, nothing flows
    until someone asks. Everyone agrees on a meeting point for the group, called the
    rendezvous point, or RP. A receiver's designated router sends a star comma G join
    toward the RP, creating a shared tree. Data then flows only along the branches
    that joined. The slide's phrase, CBT, source based, is shorthand. What actually
    happens is that sparse mode starts with this shared tree.
