- id: prune
  stage: state
  pdf: 41
  c:
  - Truncated Reverse Path Broadcasting
  - Reverse Path Multicasting
  say: RPF alone still sends data everywhere, as a broadcast with no duplicates. Let's
    narrow it. Truncated reverse path broadcasting skips a leaf LAN when IGMP says
    no members exist there. That removes only the last hop. Reverse path multicasting
    goes further. If a router has no local members, and none of its downstream routers
    want the data, it sends a prune upstream. Prunes propagate, so entire uninterested
    subtrees drop out.
  moves:
  - clear: {}
  - net.show:
      name: pr
      zone: top
      nodes:
        S:
          k: router
          at:
          - 5
          - 2
          l: Source side
          lp: up
        X:
          k: router
          at:
          - 2.5
          - 1
          l: X
        Y:
          k: router
          at:
          - 7.5
          - 1
          l: Y
        L1:
          k: host
          at:
          - 1
          - 0
          l: No members
        L2:
          k: host
          at:
          - 4
          - 0
          l: No members
        L3:
          k: host
          at:
          - 7.5
          - 0
          l: Members
      links:
      - - S
        - X
      - - S
        - Y
      - - X
        - L1
      - - X
        - L2
      - - Y
        - L3
  - net.pulse:
      name: pr
      path:
      - S
      - X
      - L1
      when: RPF alone
  - net.state:
      name: pr
      links:
      - - X
        - L1
        - dim
      when: Truncated reverse
  - net.state:
      name: pr
      links:
      - - X
        - L2
        - dim
      when: Reverse path multicasting
  - msg.send:
      name: pr
      a: X
      b: S
      text: prune
      kind: error
      when: it sends a prune
      t: 1.1
  - net.state:
      name: pr
      links:
      - - S
        - X
        - blocked
  - net.state:
