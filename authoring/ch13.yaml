dish: '13.3'
title: Choosing a tree
deck: lec13-multicast.pdf
target_min: 4
concepts:
- Shared Multicast Trees
- Source-Based Multicast Trees
- Minimum Spanning Trees
- Prim Algorithm
- Kruskal Algorithm
- Core-Based Trees
beats:
- id: question
  stage: question
  pdf: 36
  c:
  - Shared Multicast Trees
  - Source-Based Multicast Trees
  say: To deliver to many networks, routers need a tree. But we've already met one
    tree in spanning tree, and another in Dijkstra's. Are they the same? What does
    best even mean for a tree? And should every sender get its own tree, or should
    they all share one?
  moves:
  - heading:
      text: 'Lecture 13: choosing a tree'
  - q:
      text: What does 'best' even mean for a tree?
  - keep: {}
- id: kinds
  stage: animation
  pdf: 36
  c:
  - Shared Multicast Trees
  - Source-Based Multicast Trees
  say: First, a split. A source-based tree is rooted at one sender, so state is kept
    per source and group, written S comma G. A shared tree is used by all senders
    in the group, written star comma G. A shared tree needs less state. Source trees
    can give shorter paths. So we're trading memory against path quality.
  moves:
  - clear: {}
  - table.show:
      name: k
      zone: top
      cols:
      - Tree
      - State
      - Strength
      rows:
      - - Source-based
        - (S,G)
        - shorter paths
      - - Shared
        - (*,G)
        - less state
- id: mst
  stage: state
  pdf: 37
  c:
  - Minimum Spanning Trees
  - Prim Algorithm
  - Kruskal Algorithm
  say: 'Next, objectives. A minimum spanning tree connects all nodes with the smallest
    total edge cost. There are two classic ways to find one. Prim''s algorithm grows
    one tree outward, always adding the cheapest edge that crosses from the tree to
    a node outside. Kruskal''s algorithm sorts all edges, and adds each one unless
    it would create a cycle. Try this triangle: A to B is 1, B to C is 1, and A to
    C is 1 point 5. Both algorithms choose A B and B C, for a total of 2.'
  moves:
  - clear: {}
  - net.show:
      name: t
      zone: left
      nodes:
        A:
          k: node
          at:
          - 0
          - 0
          l: A
        B:
          k: node
          at:
          - 3
          - 2.4
          l: B
        C:
          k: node
          at:
          - 6
          - 0
          l: C
      links:
      - - A
        - B
        - c: 1
      - - B
        - C
        - c: 1
      - - A
        - C
        - c: '1.5'
  - bullets:
      name: pk
      zone: right_top
      show: 0
      items:
      - 'Prim: cheapest edge crossing out of the tree'
      - 'Kruskal: cheapest edge that makes no cycle'
  - reveal:
      name: pk
      when: Prim's algorithm
  - reveal:
      name: pk
      when: Kruskal's algorithm
  - net.path:
      name: t
      path:
      - A
      - B
      - C
      style: tree
      when: Both algorithms
- id: objectives
  stage: rule
  pdf: 37
  c:
  - Minimum Spanning Trees
  clar:
  - tree-objectives
  say: Ask a different question. What's the shortest way from A to C? It's the direct
    edge, at 1 point 5, which isn't even in that tree. Dijkstra's tree from A would
    use it. So three things share the word tree. STP makes layer 2 forwarding loop-free.
    An MST minimizes total edge cost. A shortest path tree minimizes distance from
    one source. Same word, different objectives.
  moves:
  - table.show:
      name: obj
      zone: right_bottom
      cols:
      - Tree
      - Objective
      rows:
      - - STP
        - no layer 2 loops
      - - MST
        - least total cost
      - - Shortest path
        - least distance from source
- id: core
  stage: state
  pdf: 38
  c:
  - Core-Based Trees
  say: 'One more design: core-based trees. Pick one router as the meeting point, called
    the core. Each receiver''s router sends a join toward the core, and that request
    stops as soon as it hits a router already on the tree. Traffic then flows along
    those branches. It''s simple and uses little state. But the core could become
    a hot spot, and paths may take a detour through it.'
  moves:
