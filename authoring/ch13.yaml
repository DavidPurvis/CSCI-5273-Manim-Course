- id: pitfall
  stage: rule
  pdf: 38
  c:
  - Core-Based Trees
  say: These algorithms look alike, and they aren't. Dijkstra accumulates distance
    from a source. Prim just picks the cheapest edge reaching the growing tree. The
    resulting trees can differ.
  moves:
  - trap:
      wrong: Prim relaxes accumulated distances, like Dijkstra
      right: Prim adds the cheapest edge reaching the tree
- id: changed
  stage: changed_example
  pdf: 37
  c:
  - Minimum Spanning Trees
  say: Change one cost. Make the direct A to C edge cost 0 point 5.
