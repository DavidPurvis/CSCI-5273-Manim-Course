- id: dense
  stage: state
  pdf: 44
  c:
  - PIM Dense Mode
  say: PIM, protocol independent multicast, is the standard router protocol. It's
    called independent because it reuses whatever unicast routing is available. PIM
    dense mode is the approach we've just seen. Flood, then prune. Everything is forwarded
    unless a branch opts out. That's sensible if most networks want the data, but
    wasteful if very few do. Prunes also expire, so the flooding comes back periodically.
  moves:
  - net.pulse:
      name: pr
      path:
      - S
      - Y
      - L3
      when: It's called independent
  - net.state:
      name: pr
