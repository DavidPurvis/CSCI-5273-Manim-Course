          - 2.5
          - 1
          l: M
        A:
          k: router
          at:
          - 0
          - 0
          l: A
        B:
          k: router
          at:
          - 5
          - 0
          l: B
        D:
          k: router
          at:
          - 8.5
          - 1
          l: D
      links:
      - - A
        - M
      - - M
        - C
      - - B
        - M
      - - D
        - C
  - packet.spawn:
      name: j
      net: cb
      at: A
      layers:
      - label
      when: Each receiver's
  - packet.hop:
      name: j
      to:
      - M
      - C
  - net.path:
      name: cb
      path:
      - A
      - M
