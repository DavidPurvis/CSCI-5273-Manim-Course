dish: '17.5'
title: 'Practice question 5: longest match'
deck: lec08-network2.pdf
target_min: 2.5
beats:
- id: question
  stage: question
  pdf: 28
  c:
  - Longest Prefix Matching
  say: Practice question 5. Installed routes are 10.0.0.0/8 to A, 10.4.0.0/16 to B, 10.4.8.0/21 to C,
    and slash 0 to D. Choose outputs for 10.4.9.7, 10.4.20.1, 10.8.1.2, and 192.0.2.8. Then explain why
    a lower-cost slash 8 would not replace a matching slash 21 during ordinary lookup.
  moves:
  - heading:
      text: Practice midterm, question 5
  - table.show:
      name: rt
      zone: left_top
      data: $practice.q5_routes
      when: Installed routes are
  - bullets:
      name: d
      zone: right_top
      show: 4
      items:
      - 10.4.9.7
      - 10.4.20.1
      - 10.8.1.2
      - 192.0.2.8
- id: predict
  stage: prediction
  pdf: 28
  hold: 20
  say: Choose all four outputs before going on.
  moves:
  - pause:
      text: the output for each of the four destinations
- id: first
  stage: state
  pdf: 29
  c:
  - Longest Prefix Matching
  say: 'Start with 10.4.9.7. It''s inside the slash 8, and inside the slash 16. For the slash 21, third-byte
    blocks have size 8, and 9 lies in 8 through 15. So it matches that too, and the longest wins: output
    C.'
  moves:
  - table.show:
      name: lk
      zone: bottom
      data: $practice.q5_table
      show: 0
  - table.flash:
      name: rt
      rows:
      - 0
      - 1
      state: candidate
      when: It's inside
  - table.mark:
      name: rt
      r: 2
      state: candidate
      when: For the slash 21
  - table.flash:
      name: rt
      rows:
      - 0
      - 1
      state: null
      when: So it matches
  - table.mark:
      name: rt
      r: 2
      state: done
  - table.reveal:
      name: lk
  - keep: {}
- id: rest
  stage: state
  pdf: 29
  c:
  - Longest Prefix Matching
  say: '10.4.20.1 matches the slash 8 and the slash 16. Its third byte, 20, is outside 8 through 15, so
    the slash 21 doesn''t match. Output B. 10.8.1.2 matches only the slash 8 and the default. Output A.
    And 192.0.2.8 matches only the default: output D.'
  moves:
  - table.mark:
      name: rt
      r: 2
      state: error
      when: Its third byte
  - table.mark:
      name: rt
      r: 1
      state: done
      when: Output B
  - table.reveal:
      name: lk
  - table.flash:
      name: rt
      rows:
      - 1
      - 2
      state: null
      when: matches only the slash 8
  - table.mark:
      name: rt
      r: 0
      state: done
  - table.reveal:
      name: lk
  - table.mark:
      name: rt
      r: 0
      state: null
      when: And 192.0.2.8
  - table.mark:
      name: rt
      r: 3
      state: done
  - table.reveal:
      name: lk
  - keep: {}
- id: why
  stage: explanation
  pdf: 29
  c:
  - Longest Prefix Matching
  say: Why doesn't cost matter? Cost belongs to route selection, which happens before a prefix is installed.
    Forwarding among installed matches uses prefix length alone. So a matching slash 21 beats a slash
    8, however cheap the slash 8 looks.
  moves:
  - rule:
      text: Cost belongs to route selection. Forwarding among installed matches uses prefix length.
      when: Cost belongs
  - keep: {}
- id: trap
  stage: rule
  pdf: 29
  c:
  - Longest Prefix Matching
  say: The tempting answer lets the cheaper route win, or takes whichever route is listed first. Neither
    one affects an ordinary lookup.
  moves:
  - trap:
      wrong: The cheaper /8 wins, or the first route listed
      right: The longest matching prefix wins
      when: The tempting
  - keep: {}
- id: marks
  stage: explanation
  pdf: 29
  say: 'On marks: four points for the outputs, and one for the distinction.'
  moves:
  - rule:
      text: '4 points: the outputs. 1 point: prefix length versus route selection cost.'
      when: On marks
  - keep: {}
