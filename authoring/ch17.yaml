dish: '17.2'
title: 'Practice question 2: collisions and loops'
deck: lec06-lan.pdf
target_min: 2
beats:
- id: question
  stage: question
  pdf: 22
  c:
  - Full-Duplex Links
  say: 'Practice question 2. Explain why full-duplex switching can still queue, and why redundant Ethernet
    links need spanning tree. Then say which problem each mechanism addresses: collision, output contention,
    or a flooding loop.'
  moves:
  - heading:
      text: Practice midterm, question 2
  - bullets:
      name: q
      zone: top
      show: 3
      items:
      - Why can full-duplex switching still queue?
      - Why do redundant links need spanning tree?
      - Collision, output contention, or flooding loop?
      when: Explain why full-duplex
- id: predict
  stage: prediction
  pdf: 22
  hold: 12
  say: Match each mechanism to its problem before going on.
  moves:
  - pause:
      text: match each mechanism to the problem it addresses
- id: duplex
  stage: state
  pdf: 23
  c:
  - Full-Duplex Links
  say: Full duplex gives each point-to-point link its own send and receive paths, so the shared half-duplex
    collision contest is gone on that link. But two inputs can still want the same output at the same
    moment. Only one frame can leave at a time, so the other one queues. There's no collision, just contention.
  moves:
  - clear: {}
  - net.show:
      name: d
      zone: left
      nodes:
        A:
          k: host
          at:
          - 0
          - 1.4
          l: A
        B:
          k: host
          at:
          - 0
          - -1.4
          l: B
        S:
          k: switch
          at:
          - 3
          - 0
          l: Switch
          lp: up
        C:
          k: host
          at:
          - 6
          - 0
          l: C
      links:
      - - A
        - S
      - - B
        - S
      - - S
        - C
  - packet.spawn:
      name: a
      net: d
      at: A
      layers:
      - eth
      when: two inputs
  - packet.spawn:
      name: b
      net: d
      at: B
      layers:
      - eth
  - packet.both:
      moves:
      - name: a
        to: S
      - name: b
        to: S
  - packet.hop:
      name: a
      to: C
      when: Only one frame
  - queue.show:
      name: wait
      zone: right
      items:
      - B's frame
      kind: eth
      title: Output queue
      when: so the other
  - packet.fade:
      name: b
  - keep: {}
- id: stp
  stage: state
  pdf: 35
  c:
  - Spanning Tree Protocol
  say: The loop. Redundant links form a cycle in the active topology. A flooded frame goes around that
    cycle, and Ethernet has no hop limit to stop it. Spanning tree blocks enough links that the active
    topology has no cycle, so flooded frames can't circulate forever.
  moves:
  - clear: {}
  - net.show:
      name: tri
      zone: left
      nodes:
        S1:
          k: switch
          at:
          - 0
          - 1.3
          l: S1
          lp: up
        S2:
          k: switch
          at:
          - -2.4
          - -1.2
          l: S2
        S3:
          k: switch
          at:
          - 2.4
          - -1.2
          l: S3
      links:
      - - S1
        - S2
      - - S1
        - S3
      - - S2
        - S3
  - packet.spawn:
      name: l
      net: tri
      at: S1
      layers:
      - eth
      when: A flooded frame
  - packet.hop:
      name: l
      to:
      - S2
      - S3
      - S1
      - S2
      - S3
      t: 3
  - packet.fade:
      name: l
  - net.state:
      name: tri
      links:
      - - S1
        - S2
        - tree
      - - S1
        - S3
        - tree
      - - S2
        - S3
        - blocked
      when: Spanning tree blocks
  - keep: {}
- id: trap
  stage: rule
  pdf: 37
  c:
  - Spanning Tree Protocol
  say: The tempting answer blurs these together. Full duplex does not remove queues, and spanning tree
    does not prevent collisions. Keep the scopes apart. Full duplex ends the collision contest on a link.
    Queues handle output contention. Spanning tree handles flooding loops.
  moves:
  - trap:
      wrong: Full duplex ends all waiting, and STP stops collisions
      right: Full duplex ends link collisions; outputs still queue; STP stops flood loops
      when: The tempting
  - keep: {}
- id: marks
  stage: explanation
  pdf: 37
  say: 'On marks: two points for output contention, two for flooding and spanning tree, and one for keeping
    the scopes separate.'
  moves:
  - rule:
      text: '2 points: output contention. 2 points: flooding and STP. 1 point: separate scopes.'
      when: On marks
  - keep: {}
prediction_contracts:
- prediction_beat: 17.2.predict
  answer_beat: 17.2.marks
  answer_events:
  - 17.2.marks:move:0
  answer_objects:
  - object: _rule
    after: 17.2.marks:move:0
    effect: rule
    selector: {}
    before_answer: hidden_or_neutral
  review_scope: Inspect the listed answer objects for neutral or hidden state during the prediction hold.
