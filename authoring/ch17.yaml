dish: '17.1'
title: 'Practice question 1: switch learning'
deck: lec06-lan.pdf
target_min: 2
beats:
- id: question
  stage: question
  pdf: 31
  c:
  - Self-Learning Switch Tables
  say: Practice question 1. This walkthrough follows a generated practice midterm, not your instructor's
    exam, so use it to test your reasoning, not to predict questions. If you haven't tried the test yet,
    stop now and take it first. A switch starts with an empty table. A is on port 1, B is on port 2, and
    C is on port 3, all in one VLAN. Trace A to B, then B to A, then C to B. After each frame, give the
    table change and the output ports.
  moves:
  - heading:
      text: Practice midterm, question 1
  - net.show:
      name: sw
      zone: left
      nodes:
        X:
          k: switch
          at:
          - 0
          - 0
          l: Switch
          lp: up
        A:
          k: host
          at:
          - -3
          - -1
          l: A (port 1)
        B:
          k: host
          at:
          - 0
          - -1.6
          l: B (port 2)
        C:
          k: host
          at:
          - 3
          - -1
          l: C (port 3)
      links:
      - - A
        - X
      - - B
        - X
      - - C
        - X
      when: This walkthrough follows
  - table.show:
      name: mac
      zone: right_top
      cols:
      - MAC
      - Port
      rows: []
- id: predict
  stage: prediction
  pdf: 31
  hold: 15
  say: Work all three frames before going on.
  moves:
  - pause:
      text: the table change and output ports for all three frames
- id: first
  stage: state
  pdf: 31
  c:
  - Self-Learning Switch Tables
  say: First frame, A to B. The switch reads the source address, so it learns that A is on port 1. Then
    it looks up the destination. B is unknown, so it floods out ports 2 and 3.
  moves:
  - packet.spawn:
      name: f
      net: sw
      at: A
      layers:
      - eth
      when: First frame
  - packet.hop:
      name: f
      to: X
  - switch.learn_source:
      table: mac
      mac: A
      port: '1'
      when: so it learns
  - packet.flood:
      name: f
      to:
      - B
      - C
      when: so it floods
  - packet.fade:
      name: f
  - keep: {}
- id: second
  stage: state
  pdf: 32
  c:
  - Self-Learning Switch Tables
  say: 'Second frame, B to A. Source first: B is on port 2. Now the destination, A, is in the table, so
    the frame goes only out port 1.'
  moves:
  - packet.spawn:
      name: g
      net: sw
      at: B
      layers:
      - eth
      when: Second frame
  - packet.hop:
      name: g
      to: X
  - switch.learn_source:
      table: mac
      mac: B
      port: '2'
      when: Source first
  - packet.hop:
      name: g
      to: A
      when: so the frame goes
  - packet.fade:
      name: g
  - keep: {}
- id: third
  stage: state
  pdf: 34
  c:
  - Self-Learning Switch Tables
  say: Third frame, C to B. The source teaches the switch that C is on port 3. B is known, so the frame
    goes out port 2. The final table is A on 1, B on 2, and C on 3.
  moves:
  - packet.spawn:
      name: h
      net: sw
      at: C
      layers:
      - eth
      when: Third frame
  - packet.hop:
      name: h
      to: X
  - switch.learn_source:
      table: mac
      mac: C
      port: '3'
      when: The source teaches
  - packet.hop:
      name: h
      to: B
      when: B is known
  - packet.fade:
      name: h
  - keep: {}
- id: trap
  stage: rule
  pdf: 34
  c:
  - Self-Learning Switch Tables
  say: The tempting mistake. After the first frame, many people write B into the table, because A mentioned
    B. But a destination address tells the switch nothing about where B is. Only a frame sent by B can
    do that.
  moves:
  - trap:
      wrong: A's frame teaches the switch where B is
      right: 'Only the source address teaches: B is learned when B sends'
      when: many people
  - keep: {}
- id: marks
  stage: explanation
  pdf: 34
  say: 'On marks: three points for the three forwarding actions, and two for source learning with the
    correct final table.'
  moves:
  - rule:
      text: '3 points: the three actions. 2 points: source learning and the final table.'
      when: On marks
  - keep: {}
prediction_contracts:
- prediction_beat: 17.1.predict
  answer_beat: 17.1.marks
  answer_events:
  - 17.1.marks:move:0
  answer_objects:
  - object: _rule
    after: 17.1.marks:move:0
    effect: rule
    selector: {}
    before_answer: hidden_or_neutral
  review_scope: Inspect the listed answer objects for neutral or hidden state during the prediction hold.
