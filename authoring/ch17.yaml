dish: '17.3'
title: 'Practice question 3: prefix arithmetic'
deck: lec07-network1.pdf
target_min: 2.5
beats:
- id: question
  stage: question
  pdf: 23
  c:
  - Network and Broadcast Addresses
  say: Practice question 3. For 172.16.5.130/22, give the mask, the network, the broadcast address, and
    the conventional usable count. Then decide whether 172.16.7.12 is on the same subnet.
  moves:
  - heading:
      text: Practice midterm, question 3
  - bullets:
      name: q
      zone: top
      show: 2
      items:
      - '172.16.5.130/22: mask, network, broadcast, usable count'
      - Is 172.16.7.12 on the same subnet?
      when: For 172.16.5.130/22, give
- id: predict
  stage: prediction
  pdf: 23
  hold: 20
  say: Do the arithmetic on paper. Remember to show your work.
  moves:
  - pause:
      text: mask, network, broadcast, usable count, and same subnet?
- id: mask
  stage: state
  pdf: 22
  c:
  - Subnet Masks
  say: A slash 22 means 22 network bits, so the mask is 255.255.252.0. The boundary falls inside the third
    byte. Six of that byte's bits are network bits and two are host bits, so third-byte blocks have size
    4.
  moves:
  - clear: {}
  - bits.show:
      name: d
      zone: full
      rows:
      - label: Address 172.16.5.130
        value: $practice.q3.address
      - label: Mask 255.255.252.0
        value: $practice.q3.mask
      reserve: 4
  - bits.draw_mask:
      name: d
      prefix: 22
      when: A slash 22
  - bits.mark:
      name: d
      row: 1
      start: 16
      end: 24
      when: inside the third
  - bits.mark:
      name: d
      row: 1
      start: 22
      end: 24
      state: candidate
      when: two are host
  - keep: {}
  pre_roll: 1.7000000000000002
- id: network
  stage: state
  pdf: 23
  c:
  - Network and Broadcast Addresses
  say: The third byte is 5, and 5 lies in the block from 4 through 7. So the network is 172.16.4.0, and
    the broadcast is 172.16.7.255. That leaves 10 host bits, so 2 to the 10th, minus 2, gives 1,022 usable
    addresses.
  moves:
  - bits.mark:
      name: d
      row: 1
      start: 22
      end: 24
      state: null
  - bits.scan:
      name: d
      label: Network 172.16.4.0
      value: $practice.q3.network
      when: So the network
  - bits.scan:
      name: d
      label: Broadcast 172.16.7.255
      value: $practice.q3.broadcast
      when: and the broadcast
  - rule:
      text: 2^10 − 2 = 1022 usable addresses
      when: That leaves
  - keep: {}
- id: same
  stage: explanation
  pdf: 23
  c:
  - Subnet Masks
  say: 172.16.7.12. Its third byte is 7, which sits in the same block. So yes, it's on the same subnet,
    even though 5 and 7 look different.
  moves:
  - rule:
      text: '172.16.7.12: third byte 7 lies in 4 to 7. Same subnet.'
      when: Its third byte
  - keep: {}
- id: trap
  stage: rule
  pdf: 23
  c:
  - Network and Broadcast Addresses
  say: 'The tempting answer treats this like a slash 24: network 172.16.5.0, broadcast 172.16.5.255. That
    ignores the mask. The host part begins inside the third byte, so the block crosses several values
    of it.'
  moves:
  - trap:
      wrong: Network 172.16.5.0, broadcast 172.16.5.255
      right: 'Network 172.16.4.0, broadcast 172.16.7.255: the boundary is inside byte three'
      when: The tempting
  - keep: {}
- id: marks
  stage: explanation
  pdf: 23
  say: 'On marks: one point for each requested result.'
  moves:
  - rule:
      text: 1 point for each requested result.
      when: On marks
  - keep: {}
prediction_contracts:
- prediction_beat: 17.3.predict
  answer_beat: 17.3.same
  answer_events:
  - 17.3.same:move:0
  answer_objects:
  - object: _rule
    after: 17.3.same:move:0
    effect: rule
    selector: {}
    before_answer: hidden_or_neutral
  review_scope: Inspect the listed answer objects for neutral or hidden state during the prediction hold.
