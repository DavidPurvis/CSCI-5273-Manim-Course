dish: '17.4'
title: 'Practice question 4: fragmentation'
deck: lec07-network1.pdf
target_min: 2.5
beats:
- id: question
  stage: question
  pdf: 36
  c:
  - IPv4 Fragmentation
  say: Practice question 4. A 2,600 byte IPv4 datagram, with a 20 byte header and no options, may be fragmented
    over an MTU of 1,000. Give each fragment's payload length, total length, offset, and more fragments
    flag. Then explain the offset unit.
  moves:
  - heading:
      text: Practice midterm, question 4
  - bar.show:
      name: b
      zone: full
      total: 2600
      header: 20
      rows: 3
      when: A 2,600 byte
- id: predict
  stage: prediction
  pdf: 37
  hold: 20
  say: Work out the whole table on paper.
  moves:
  - pause:
      text: payload, total length, offset, and MF for each fragment
- id: size
  stage: state
  pdf: 37
  c:
  - IPv4 Fragmentation
  say: The data is 2,600 minus 20, which is 2,580 bytes. Each fragment has room for 1,000 minus 20, or
    980 bytes of data. But nonfinal payloads must be multiples of 8, so round down to 976.
  moves:
  - bar.ruler:
      name: b
      when: Each fragment has room
  - bar.zoom:
      name: b
      at: 980
      state: error
      when: or 980 bytes
  - bar.snap:
      name: b
      at: 976
      when: so round down
  - keep: {}
- id: slices
  stage: state
  pdf: 37
  c:
  - IPv4 Fragmentation
  say: The payloads are 976, 976, and what's left, 628. Adding 20 byte headers gives total lengths of
    996, 996, and 648. The offsets are 0, 122, and 244. The more fragments flags are 1, 1, and 0.
  moves:
  - bar.slice:
      name: b
      i: 0
      frag: $practice.q4.0
      info: false
      when: The payloads
      t: 0.8
  - bar.slice:
      name: b
      i: 1
      frag: $practice.q4.1
      info: false
      t: 0.8
  - bar.slice:
      name: b
      i: 2
      frag: $practice.q4.2
      info: false
      t: 0.8
  - bar.info:
      name: b
      i: 0
      frag: $practice.q4.0
      when: The offsets are
  - bar.info:
      name: b
      i: 1
      frag: $practice.q4.1
  - bar.info:
      name: b
      i: 2
      frag: $practice.q4.2
  - keep: {}
- id: unit
  stage: explanation
  pdf: 37
  c:
  - IPv4 Fragmentation
  say: Why 122? The offset field counts in units of 8 bytes of original data, and 976 divided by 8 is
    122. It counts position in the data, not headers.
  moves:
  - bar.span:
      name: b
      to: 976
      text: offset 122 × 8 = 976
      when: The offset field
  - keep: {}
- id: trap
  stage: rule
  pdf: 37
  c:
  - IPv4 Fragmentation
  say: The tempting answer cuts at 980, the space that's available. But then a second fragment would start
    at byte 980, and that position can't be written as a whole number of 8 byte units.
  moves:
  - trap:
      wrong: Payloads of 980, 980, and 620
      right: '980 isn''t a multiple of 8: payloads are 976, 976, and 628'
      when: The tempting
  - keep: {}
- id: marks
  stage: explanation
  pdf: 37
  say: 'On marks: one point each for the payload calculation, the totals, the offsets, the flags, and
    the explanation of the unit.'
  moves:
  - rule:
      text: '1 point each: payloads, totals, offsets, MF flags, and the offset unit.'
      when: On marks
  - keep: {}
prediction_contracts:
- prediction_beat: 17.4.predict
  answer_beat: 17.4.unit
  answer_events:
  - 17.4.unit:move:0
  answer_objects:
  - object: b
    after: 17.4.unit:move:0
    effect: bar.span
    selector: {}
    before_answer: hidden_or_neutral
  review_scope: Inspect the listed answer objects for neutral or hidden state during the prediction hold.
