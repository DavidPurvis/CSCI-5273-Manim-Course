    narration_excerpt: A repeater amplifies a weakening signal, so a LAN can stretch
      further. A hub is a repeater with many ports. Every bit arriving on one port
      is copied out of all the others. It reads no addresses. It stores nothing. So
      a hub with eight ports is still one wire, wearing a different shape. If A sends
      to B while C sends to D, they collide. The boundary that matters is the collision
      domain, not the number of boxes in the picture.
