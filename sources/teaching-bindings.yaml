    beat: 7.1.statmux
    narration_excerpt: Why does this suit computers? Their traffic is bursty. A web
      page arrives in a rush, and then the link goes silent. Sharing capacity according
      to actual arrivals is called statistical multiplexing, and it lets many bursty
      users share a link that could never hold all their peaks. The price comes when
      bursts overlap. If 8 megabits per second arrive at a 4 megabit link for 10 milliseconds,
