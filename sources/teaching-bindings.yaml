      between hosts and their directly attached router. The router sends a query:
      any members out there? Hosts reply with reports. Here''s a clever trick. H1
      and H2 both want group G. Each picks a random delay, say 2 seconds and 6 seconds.
      H1''s timer fires first, and it sends its report to the group itself. H2 hears
      the report, and cancels its own. Why? Because the router only needs to know
      that someone on this LAN wants G, not who, or how many. In version 1 there''s
      no leave message. Membership simply expires when reports stop.'
