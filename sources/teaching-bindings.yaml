  review: not_reviewed
  mechanism:
    beat: 9.2.lookup
    narration_excerpt: 'Follow one lookup with empty caches. The laptop asks its resolver:
      please find this name for me. That is a recursive query. It asks the server
      to do all the work. The resolver then asks the root. The root doesn''t know
      the answer, but it gives a referral: ask the dot test servers. The resolver
