    while transmitting.'
  review: not_reviewed
  mechanism:
    beat: 6.1.csma
    narration_excerpt: 'The Ethernet rule, called CSMA/CD. Carrier sense: listen first,
      and if someone is talking, wait. Collision detection: keep listening while you
      send. If what you hear differs from what you sent, there is a collision, so
      stop and send a brief jam signal. But why would a collision ever happen, if
      everyone listens first? Because signals take time to travel. A and B can both
      hear silence, because neither signal has arrived yet.'
