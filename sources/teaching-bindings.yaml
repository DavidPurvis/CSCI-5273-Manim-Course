    beat: 15.2.gtp
    narration_excerpt: The core. Inside the core, the phone's packet isn't routed
      by its own address. It travels in a tunnel, using GTP, the GPRS tunneling protocol.
      The eNodeB wraps the phone's IP packet in a GTP header, that in UDP, and that
      in an outer IP header addressed to the S-GW. Core routers read only that outer
      header. The S-GW then unwraps and rewraps, into a new tunnel toward the P-GW.
      There the outer layers come off, and the original packet heads into the Internet,
      unchanged.
