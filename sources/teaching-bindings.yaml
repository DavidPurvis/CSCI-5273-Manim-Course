    portions of time, frequency, or code.'
  review: not_reviewed
  mechanism:
    beat: 6.1.partition
    narration_excerpt: One family of answers is channel partitioning. Divide the wire
      into fixed shares of time or frequency, one for each user. With four users on
      a 12 megabit per second wire, each user owns 3 megabits per second. It is perfectly
      fair and collision free. But watch what happens when only one user has anything
      to send. Three quarters of the wire sits idle, and that lone user still gets
      just 3.
