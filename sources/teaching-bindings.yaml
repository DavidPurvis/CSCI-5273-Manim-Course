Binary Exponential Backoff:
  concept_id: Binary Exponential Backoff
  primary_beats:
  - 6.1.backoff
  supporting_beats: []
  source_refs:
  - Concepts/Binary Exponential Backoff.md
  explanation_claim: '**Binary Exponential Backoff** increases the range of randomized
    retry delays after repeated collisions.'
  review: not_reviewed
  mechanism:
    beat: 6.1.backoff
    narration_excerpt: After a collision, if both retry immediately, they collide
      again forever. So each picks a random wait. After the m-th collision, choose
      K from zero up to 2 to the m, minus one, and wait K times 512 bit times. Each
      further collision doubles the range, so the group spreads itself out without
      any coordination. That is binary exponential backoff. Try one. After the third
      collision, K ranges from 0 to 7. On 10 megabit Ethernet, 512 bit times is 51
      point 2 microseconds. So K equal to 5 means a wait of 256 microseconds.
    visible_events:
    - 6.1.backoff:move:0
    - 6.1.backoff:move:1
    - 6.1.backoff:move:2
    - 6.1.backoff:move:3
