  source_refs:
  - Concepts/CSMA-CA.md
  explanation_claim: '**CSMA-CA** uses sensing, randomized waiting, and acknowledgments
    to reduce wireless collisions.'
  review: not_reviewed
  mechanism:
    beat: 14.4.csmaca
    narration_excerpt: Wi-Fi avoids collisions instead of detecting them. It's called
      CSMA/CA. Here's the sender's routine. Wait until the channel has been idle for
      a period called DIFS. Then count down a random backoff, one idle slot at a time.
      If the channel goes busy, freeze the counter. Do not reset it. Transmit when
      it reaches zero. Then the receiver checks the frame, and after a shorter gap
      called SIFS, returns an ACK. Why shorter? So the ACK goes first, before anyone
      else can grab the channel. If no ACK arrives, the sender retries with a larger
      backoff range.
