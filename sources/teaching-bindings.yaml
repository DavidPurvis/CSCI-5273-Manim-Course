  supporting_beats:
  - 13.3.answer
  - 13.3.objectives
  - 13.3.changed
  source_refs:
  - Concepts/Minimum Spanning Trees.md
  explanation_claim: '**Minimum Spanning Trees** connect all vertices of a weighted
    graph with minimum total edge cost and no cycles.'
  review: not_reviewed
  mechanism:
    beat: 13.3.mst
    narration_excerpt: 'Next, objectives. A minimum spanning tree connects all nodes
      with the smallest total edge cost. There are two classic ways to find one. Prim''s
      algorithm grows one tree outward, always adding the cheapest edge that crosses
