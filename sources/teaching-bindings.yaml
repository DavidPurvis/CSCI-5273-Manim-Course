    lifetime expires.'
  review: not_reviewed
  mechanism:
    beat: 9.2.cache
    narration_excerpt: Doing all that for every request would crush the root. So the
      resolver caches. Each answer carries a TTL, in seconds. Store a record with
      TTL 300 at noon, and it can be reused until 12:05. Now the catch. If the real
      address changes at 12:01, the cache keeps giving out the old one for four more
      minutes. A shorter TTL narrows that window, at the cost of more lookups. That's
      a straight trade between freshness and load. Resolvers also cache referrals,
      so most queries never touch the root.
