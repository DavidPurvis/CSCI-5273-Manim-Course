version: 3
# Applied in order. Patterns first, then whole words (case sensitive).
patterns:
  '\(\*,\s?G\)': 'star comma G'
  '\(S,\s?G\)': 'S comma G'
  '802\.1Q': 'eight oh two dot one Q'
  '(\d+)\.(\d+)\.(\d+)\.(\d+)': '\1 dot \2 dot \3 dot \4'
  '/(\d+)\b': ' slash \1'
  '\bMb/s\b': 'megabits per second'
  '\bGb/s\b': 'gigabits per second'
  '\bms\b': 'milliseconds'
  '\b([01])([01])([01])([01])([01])([01])([01])([01])\b': '\1 \2 \3 \4 \5 \6 \7 \8'
