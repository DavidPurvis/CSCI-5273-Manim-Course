# Kokoro reads plain words well and knows Dijkstra; say needed respellings. Entries replace `words` when the engine is kokoro.
# [word](/phonemes/) is Kokoro's own notation, for the words its dictionary lacks. Lowercase keys also match a capitalized first letter.
