- id: 14.2.answer
  stage: explanation
  narration: 14.2.answer
  pdf:
  - lec14-wireless.pdf
  - 16
  concepts:
  - CDMA
  clarifications: []
  moves:
  - chips.sum:
      name: w
      when: z is minus 2
  - tex:
      name: dc1
      zone: lower
      tex: z\cdot c_1/4=(-2+0+0-2)/4=-1
      size: 38
      when: Correlate with c 1
  - tex:
      name: dc2
      zone: lower
      tex: z\cdot c_2/4=(-2+0+0-2)/4=-1
      size: 38
      when: Correlate with c 2
  - rule:
      text: 'Both decode to −1. Next: joining a Wi-Fi network.'
      when: Both bits
  - keep: {}
  adjust: {}
