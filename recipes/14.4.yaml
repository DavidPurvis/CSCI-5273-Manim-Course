      when: RTS frames can
  - reveal:
      name: tr
      when: And the four-frame
  - reveal:
      name: tr
      when: For short frames
  - rule:
      text: RTS/CTS trades overhead for cheaper collisions. Good for long frames under contention.
      when: So choose
  adjust: {}
