- id: 15.2.gtp
  stage: animation
  narration: 15.2.gtp
  pdf:
  - lec15-mobile.pdf
  - 18
  concepts:
  - GTP Tunnels
  clarifications: []
  moves:
  - clear: {}
  - net.show:
      name: t
      zone: top
      nodes:
        U:
          k: phone
          at:
          - 0
          - 0
          l: UE
        E:
          k: tower
          at:
          - 3
          - 0
          l: eNodeB
        S:
          k: box
          at:
          - 6.4
          - 0
          l: S-GW
        G:
          k: box
          at:
          - 9.8
          - 0
          l: P-GW
        I:
          k: cloud
          at:
          - 13
          - 0
          l: Internet
      links:
      - - U
        - E
        - s: radio
      - - E
        - S
        - s: tunnel
      - - S
        - G
        - s: tunnel
      - - G
        - I
  - stack.show:
      name: enc
      zone: bottom
      width: 6.5
      reserve: 3
      layers:
      - t: 'Inner IP: UE → server'
        k: ip
  - packet.spawn:
      name: p
      net: t
      at: U
      layers:
      - ip
  - packet.hop:
      name: p
      to: E
  - packet.wrap:
      name: p
      kind: tunnel
      when: The eNodeB wraps
  - stack.push:
      name: enc
      text: GTP-U
      kind: tunnel
  - stack.push:
      name: enc
      text: UDP
      kind: transport
  - stack.push:
      name: enc
      text: 'Outer IP: eNodeB → S-GW'
      kind: tunnel
  - packet.hop:
      name: p
      to: S
      when: Core routers read
  - tunnel.reencapsulate:
      stack: enc
      outer: 'Outer IP: S-GW → P-GW'
      when: The S-GW then
  - packet.hop:
      name: p
      to: G
  - packet.peel:
      name: p
      when: There the outer
  - packet.hop:
      name: p
      to: I
  adjust: {}
